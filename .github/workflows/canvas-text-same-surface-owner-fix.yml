name: Canvas same-surface text owner fix

on:
  push:
    branches:
      - agent/canvas-miro-editing-selection-polish
    paths:
      - .github/workflows/canvas-text-same-surface-owner-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canvas-miro-editing-selection-polish
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Replace edit-mode swap with one persistent text surface
        shell: python
        run: |
          from pathlib import Path

          shell_path = Path("src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx")
          shell = shell_path.read_text()

          shell = shell.replace(
              "  useEffect,\n  useMemo,",
              "  useEffect,\n  useLayoutEffect,\n  useMemo,",
              1,
          )

          start = shell.index("function CanvasTextEditor({")
          end = shell.index("\nfunction TaskNodeBody({", start)
          replacement = r'''type PendingCanvasTextEditPoint = {
  id: string;
  clientX: number;
  clientY: number;
};

let pendingCanvasTextEditPoint: PendingCanvasTextEditPoint | null = null;

function placeCanvasTextCaretAtPoint(
  editor: HTMLDivElement,
  clientX: number,
  clientY: number,
): boolean {
  const caretDocument = document as Document & {
    caretPositionFromPoint?: (
      x: number,
      y: number,
    ) => { offsetNode: Node; offset: number } | null;
    caretRangeFromPoint?: (x: number, y: number) => Range | null;
  };
  let range: Range | null = null;
  const caretPosition = caretDocument.caretPositionFromPoint?.(clientX, clientY);
  if (caretPosition && editor.contains(caretPosition.offsetNode)) {
    range = document.createRange();
    range.setStart(caretPosition.offsetNode, caretPosition.offset);
    range.collapse(true);
  } else {
    const fallbackRange = caretDocument.caretRangeFromPoint?.(clientX, clientY);
    if (fallbackRange && editor.contains(fallbackRange.startContainer)) {
      range = fallbackRange;
    }
  }
  if (!range) return false;
  const selection = window.getSelection();
  if (!selection) return false;
  selection.removeAllRanges();
  selection.addRange(range);
  return true;
}

function moveCanvasTextCaretToEnd(editor: HTMLDivElement): void {
  const range = document.createRange();
  range.selectNodeContents(editor);
  range.collapse(false);
  const selection = window.getSelection();
  if (!selection) return;
  selection.removeAllRanges();
  selection.addRange(range);
}

function CanvasTextSurface({
  id,
  markdown,
  isEditing,
}: {
  id: string;
  markdown: string;
  isEditing: boolean;
}): React.JSX.Element {
  const inputRef = useRef<HTMLDivElement | null>(null);
  const markdownRef = useRef(markdown);
  const draftRef = useRef(markdown);
  const wasEditingRef = useRef(false);
  const skipNextBlurCommitRef = useRef(false);
  markdownRef.current = markdown;

  useLayoutEffect(() => {
    const input = inputRef.current;
    if (!input) return;
    const enteringEdit = isEditing && !wasEditingRef.current;
    if (enteringEdit) {
      draftRef.current = markdownRef.current;
      input.textContent = draftRef.current;
      input.focus({ preventScroll: true });
      const point = pendingCanvasTextEditPoint;
      pendingCanvasTextEditPoint = null;
      if (
        !point ||
        point.id !== id ||
        !placeCanvasTextCaretAtPoint(input, point.clientX, point.clientY)
      ) {
        moveCanvasTextCaretToEnd(input);
      }
    } else if (!isEditing) {
      draftRef.current = markdownRef.current;
    }
    wasEditingRef.current = isEditing;
  }, [id, isEditing]);

  const update = (value: string) => {
    draftRef.current = value;
    window.dispatchEvent(
      new CustomEvent("mozg:canvas-text-draft", {
        detail: { id, markdown: value },
      }),
    );
  };
  const commit = () => {
    window.dispatchEvent(
      new CustomEvent("mozg:canvas-text-commit", {
        detail: { id, markdown: commitTextMarkdown(draftRef.current) },
      }),
    );
  };
  const cancel = () => {
    skipNextBlurCommitRef.current = true;
    window.dispatchEvent(
      new CustomEvent("mozg:canvas-text-cancel", { detail: { id } }),
    );
  };

  return (
    <div
      ref={inputRef}
      role={isEditing ? "textbox" : undefined}
      aria-label={isEditing ? "Canvas text" : undefined}
      aria-multiline={isEditing ? "true" : undefined}
      contentEditable={isEditing}
      suppressContentEditableWarning
      className={`${styles.textEditorInput} ${isEditing ? "nodrag nopan nowheel" : ""}`.trim()}
      onDoubleClick={(event) => {
        event.stopPropagation();
        if (isEditing) return;
        pendingCanvasTextEditPoint = {
          id,
          clientX: event.clientX,
          clientY: event.clientY,
        };
        window.dispatchEvent(
          new CustomEvent("mozg:canvas-text-edit", { detail: { id } }),
        );
      }}
      onBlur={() => {
        if (!isEditing) return;
        if (skipNextBlurCommitRef.current) {
          skipNextBlurCommitRef.current = false;
          return;
        }
        commit();
      }}
      onInput={(event) => {
        if (!isEditing) return;
        update(event.currentTarget.innerText.replace(/\r/g, ""));
      }}
      onKeyDown={(event) => {
        if (!isEditing) return;
        event.stopPropagation();
        if (event.key === "Escape") {
          event.preventDefault();
          cancel();
        } else if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          event.currentTarget.blur();
        }
      }}
      onPaste={(event) => {
        if (isEditing) event.stopPropagation();
      }}
    >
      {isEditing ? null : markdown}
    </div>
  );
}

function TextNodeBody({
  data,
  selected,
  id,
}: NodeProps<CanvasTextFlowNode>): React.JSX.Element {
  const textStyle = canvasTextCss(data.style);
  return (
    <CanvasNodeFrame
      selected={selected}
      minWidth={120}
      minHeight={32}
      className={styles.textNodeFrame}
      toolbar={<TextSelectionToolbar id={id} style={data.style} />}
      connectionHandleLayer={<ConnectionHandleLayer selected={selected} />}
    >
      <div className={styles.textNodeContent} style={textStyle}>
        <CanvasTextSurface
          id={id}
          markdown={data.markdown}
          isEditing={Boolean(data.isEditing)}
        />
      </div>
    </CanvasNodeFrame>
  );
}
'''
          shell = shell[:start] + replacement + shell[end:]
          shell_path.write_text(shell)

          css_path = Path("src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css")
          css = css_path.read_text()
          start = css.index(".textPreview {")
          end = css.index("\n.textEditorInput::placeholder", start)
          replacement = '''.textEditorInput {
  box-sizing: border-box;
  display: block;
  width: 100%;
  height: auto;
  max-height: 100%;
  min-width: 0;
  min-height: 1.25em;
  align-self: center;
  overflow: visible;
  border: 0;
  outline: 0;
  padding: 0;
  color: inherit;
  caret-color: #111111;
  background: transparent;
  font: inherit;
  line-height: inherit;
  text-align: inherit;
  text-decoration: inherit;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  word-break: normal;
}
.textEditorInput[contenteditable="true"] {
  cursor: text;
}
.textEditorInput:empty::before {
  content: "Type something";
  color: #a8a29e;
  font: inherit;
  font-style: normal;
  font-weight: 400;
  text-decoration: none;
  pointer-events: none;
}
'''
          css = css[:start] + replacement + css[end:]
          css = css.replace(
              '.textEditorInput::placeholder,\n.textPlaceholder {\n  color: #a8a29e;\n  font: inherit;\n  font-style: normal;\n  font-weight: 400;\n  text-decoration: none;\n}\n.textPlaceholder {\n  width: 100%;\n}\n',
              '',
              1,
          )
          css_path.write_text(css)

          test_path = Path("tests/canvas-miro-text-editing-runtime.test.ts")
          test_path.write_text(r'''import fs from "node:fs";
import path from "node:path";
import { describe, expect, it } from "vitest";

const shell = fs.readFileSync(
  path.resolve(
    process.cwd(),
    "src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx",
  ),
  "utf8",
);
const frame = fs.readFileSync(
  path.resolve(
    process.cwd(),
    "src/prototype/infinite-canvas-local-shell/canvas-node-frame.tsx",
  ),
  "utf8",
);
const css = fs.readFileSync(
  path.resolve(
    process.cwd(),
    "src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css",
  ),
  "utf8",
);

describe("Canvas Miro-style in-place text editing", () => {
  it("keeps one persistent text surface instead of swapping preview and editor DOM", () => {
    expect(shell).toContain("function CanvasTextSurface({");
    expect(shell).toContain("contentEditable={isEditing}");
    expect(shell).toContain("useLayoutEffect(() => {");
    expect(shell).not.toMatch(/<textarea[\s\S]*?aria-label="Canvas text"/);
    expect(shell).not.toContain("<MarkdownStringPreview contentId={id}");
    expect(frame).not.toContain("withCenteredTextContent");
  });

  it("places the native caret from the actual double-click point", () => {
    expect(shell).toContain("pendingCanvasTextEditPoint = {");
    expect(shell).toContain("clientX: event.clientX");
    expect(shell).toContain("clientY: event.clientY");
    expect(shell).toContain("placeCanvasTextCaretAtPoint(");
    expect(shell).toContain("caretPositionFromPoint");
    expect(shell).toContain("caretRangeFromPoint");
  });

  it("uses exactly the same typography box before and during editing", () => {
    expect(css).toMatch(
      /\.textNodeContent \{[\s\S]*display: flex;[\s\S]*align-items: center;/,
    );
    expect(css).toMatch(
      /\.textEditorInput \{[\s\S]*width: 100%;[\s\S]*height: auto;[\s\S]*align-self: center;/,
    );
    expect(css).toContain("caret-color: #111111");
    expect(css).toContain('content: "Type something"');
    expect(css).not.toContain("field-sizing: content");
  });
});
''')

      - name: Format and focused verification
        run: |
          pnpm exec prettier --write src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css src/prototype/infinite-canvas-local-shell/canvas-node-frame.tsx tests/canvas-miro-text-editing-runtime.test.ts
          pnpm exec vitest run tests/canvas-miro-text-editing-runtime.test.ts
          pnpm typecheck

      - name: Commit verified fix and remove temporary workflow
        run: |
          rm .github/workflows/canvas-text-same-surface-owner-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css src/prototype/infinite-canvas-local-shell/canvas-node-frame.tsx tests/canvas-miro-text-editing-runtime.test.ts .github/workflows/canvas-text-same-surface-owner-fix.yml
          git diff --cached --check
          git commit -m "Canvas: edit text on the same layout surface"
          git push origin HEAD:agent/canvas-miro-editing-selection-polish
