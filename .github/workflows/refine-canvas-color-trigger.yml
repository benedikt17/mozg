name: Refine Canvas color picker toolbar triggers

on:
  push:
    branches:
      - feat/canvas-custom-color-picker
    paths:
      - .github/workflows/refine-canvas-color-trigger.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canvas-custom-color-picker
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replace glyph triggers with color swatches
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          picker = Path("src/prototype/infinite-canvas-local-shell/canvas-color-picker.tsx")
          text = picker.read_text()
          for old in ["  glyph,\n", "  glyph: string;\n", "        <span className={styles.glyph}>{glyph}</span>\n"]:
              if old not in text:
                  raise SystemExit(f"picker fragment not found: {old!r}")
              text = text.replace(old, "", 1)
          picker.write_text(text)

          shell = Path("src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx")
          text = shell.read_text()
          for old in ['        glyph="A"\n', '        glyph="▣"\n']:
              if old not in text:
                  raise SystemExit(f"shell fragment not found: {old!r}")
              text = text.replace(old, "", 1)
          shell.write_text(text)

          css = Path("src/prototype/infinite-canvas-local-shell/canvas-color-picker.module.css")
          text = css.read_text()
          panel = text.index(".panel {")
          css.write_text('''.root {
  position: relative;
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
}

.trigger {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 5px;
  padding: 0;
  background: transparent;
  cursor: pointer;
}

.trigger:hover,
.trigger:focus-visible,
.trigger[aria-expanded="true"] {
  background: #f5f5f4;
  outline: none;
}

.swatch {
  width: 19px;
  height: 19px;
  border: 1px solid rgba(28, 25, 23, 0.28);
  border-radius: 4px;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28);
}

''' + text[panel:])

          test = Path("tests/canvas-custom-color-picker-runtime.test.ts")
          text = test.read_text()
          needle = "    expect(shellSource).not.toContain('type=\"color\"');\n"
          if needle not in text:
              raise SystemExit("test insertion point not found")
          text = text.replace(
              needle,
              needle +
              "    expect(shellSource).not.toContain('glyph=\"A\"');\n" +
              "    expect(shellSource).not.toContain('glyph=\"▣\"');\n" +
              '    expect(pickerSource).not.toContain("styles.glyph");\n' +
              '    expect(pickerSource).toContain("className={styles.swatch}");\n',
              1,
          )
          test.write_text(text)
          PY
          pnpm exec prettier --write \
            src/prototype/infinite-canvas-local-shell/canvas-color-picker.tsx \
            src/prototype/infinite-canvas-local-shell/canvas-color-picker.module.css \
            src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx \
            tests/canvas-custom-color-picker-runtime.test.ts
          git diff --check
      - name: Validate
        run: |
          pnpm exec vitest run tests/canvas-custom-color-picker-runtime.test.ts tests/canvas-miro-text-toolbar-runtime.test.ts tests/canvas-color.test.ts
          pnpm lint
          pnpm typecheck
      - name: Commit refinement and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/refine-canvas-color-trigger.yml
          git add \
            src/prototype/infinite-canvas-local-shell/canvas-color-picker.tsx \
            src/prototype/infinite-canvas-local-shell/canvas-color-picker.module.css \
            src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx \
            tests/canvas-custom-color-picker-runtime.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Canvas: use direct color swatches in toolbar"
          git push origin HEAD:feat/canvas-custom-color-picker
