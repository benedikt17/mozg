name: Apply Canvas color swatches in toolbar

on:
  push:
    branches:
      - feat/canvas-custom-color-picker
    paths:
      - .github/workflows/apply-canvas-color-swatch-shell.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canvas-custom-color-picker
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove toolbar glyph props
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx')
          t = p.read_text()
          t2 = t.replace('        glyph="A"\n', '', 1).replace('        glyph="▣"\n', '', 1)
          if t2 == t:
              raise SystemExit('CanvasColorPicker glyph props were not found')
          p.write_text(t2)
          PY
          pnpm exec prettier --write src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx
          git diff --check
      - name: Validate
        run: |
          pnpm exec vitest run tests/canvas-custom-color-picker-runtime.test.ts tests/canvas-miro-text-toolbar-runtime.test.ts tests/canvas-color.test.ts
          pnpm lint
          pnpm typecheck
      - name: Commit and clean temporary workflows
        shell: bash
        run: |
          git rm .github/workflows/apply-canvas-color-swatch-shell.yml
          git rm -f .github/workflows/refine-canvas-color-trigger.yml || true
          git add src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Canvas: show direct color swatches in toolbar"
          git push origin HEAD:feat/canvas-custom-color-picker
