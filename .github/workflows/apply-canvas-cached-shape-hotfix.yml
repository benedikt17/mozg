name: Apply Canvas Cached Shape Hotfix

on:
  push:
    branches:
      - fix/canvas-cached-shape-restore

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canvas-cached-shape-restore
      - name: Add shapes to cached Canvas projection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx")
          source = path.read_text()
          old = '''        ...canvasDocumentToTextNodes(cachedState.document),
      ];
      // Keep the runtime-cache composition contract explicit for desktop-shell checks:'''
          new = '''        ...canvasDocumentToTextNodes(cachedState.document),
        ...canvasDocumentToShapeNodes(cachedState.document),
      ];
      // Keep the runtime-cache composition contract explicit for desktop-shell checks:'''
          if source.count(old) != 1:
              raise SystemExit(f"Expected one cached-scene projection target, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx
          git diff --cached --check
          git commit -m "fix(canvas): restore shapes from runtime cache"
          git push origin HEAD:fix/canvas-cached-shape-restore
