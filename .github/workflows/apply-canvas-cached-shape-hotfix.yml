name: Apply Canvas Cached Shape Hotfix

on:
  push:
    branches:
      - fix/canvas-cached-shape-restore

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canvas-cached-shape-restore
      - name: Add shapes to cached Canvas projection
        run: |
          python -c 'from pathlib import Path; p=Path("src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx"); s=p.read_text(); old="        ...canvasDocumentToTextNodes(cachedState.document),\n      ];\n      // Keep the runtime-cache composition contract explicit for desktop-shell checks:"; new="        ...canvasDocumentToTextNodes(cachedState.document),\n        ...canvasDocumentToShapeNodes(cachedState.document),\n      ];\n      // Keep the runtime-cache composition contract explicit for desktop-shell checks:"; assert s.count(old) == 1, s.count(old); p.write_text(s.replace(old, new, 1))'
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx
          git diff --cached --check
          git commit -m "fix(canvas): restore shapes from runtime cache"
          git push origin HEAD:fix/canvas-cached-shape-restore
