name: Stage 6.3 format lab E2E

on:
  push:
    branches:
      - agent/stage6-lab-route-hygiene

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/e2e/critical-desktop.spec.ts
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/critical-desktop.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format Stage 6.3 lab E2E"
          git push
