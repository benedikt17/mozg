name: Apply Knowledge tree article link picker

on:
  push:
    branches:
      - fix/knowledge-internal-links-beside
    paths:
      - .github/workflows/apply-knowledge-tree-link-picker.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/knowledge-internal-links-beside
          fetch-depth: 0
      - name: Patch Knowledge link picker UX
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrences, found {actual}: {old[:120]!r}")
              text = text.replace(old, new, count)
              p.write_text(text)

          # markdown-source-editor.tsx: article links use the shared tree picker; external-link modal stays intact.
          path = "src/prototype/knowledge/markdown-source-editor.tsx"
          replace(path,
          '''type MarkdownEditAction =\n''',
          '''export type KnowledgeArticleLinkPickRequest = {\n  sourceDocumentId: string;\n  onPick: (documentId: string) => void;\n};\n\ntype MarkdownEditAction =\n''')
          replace(path,
          '''export function MarkdownSourceEditor({\n  document,\n  documents = [],\n}: {\n  document: PrototypeDocument;\n  documents?: PrototypeDocument[];\n}): React.JSX.Element {''',
          '''export function MarkdownSourceEditor({\n  document,\n  documents = [],\n  onBeginArticleLinkPick,\n}: {\n  document: PrototypeDocument;\n  documents?: PrototypeDocument[];\n  onBeginArticleLinkPick?: (request: KnowledgeArticleLinkPickRequest) => void;\n}): React.JSX.Element {''')
          replace(path,
          '''  const textareaRef = useRef<HTMLTextAreaElement>(null);\n  const markdown = document.content.join("\\n");\n''',
          '''  const textareaRef = useRef<HTMLTextAreaElement>(null);\n  const markdown = document.content.join("\\n");\n  const markdownRef = useRef(markdown);\n  const documentsRef = useRef(documents);\n  const articleLinkSelectionRef = useRef<{\n    start: number;\n    end: number;\n    label: string;\n  } | null>(null);\n  markdownRef.current = markdown;\n  documentsRef.current = documents;\n''')
          replace(path,
          '''  const [dialog, setDialog] = useState<"external" | "article" | null>(null);\n''',
          '''  const [dialog, setDialog] = useState<"external" | null>(null);\n''')
          replace(path,
          '''  const [articleId, setArticleId] = useState("");\n''',
          '''''')
          replace(path,
          '''  const openArticleDialog = (): void => {\n    const textarea = textareaRef.current;\n    if (!textarea) return;\n    setSelection({\n      start: textarea.selectionStart,\n      end: textarea.selectionEnd,\n    });\n    setLinkText(markdown.slice(textarea.selectionStart, textarea.selectionEnd));\n    setArticleId("");\n    setDialog("article");\n  };\n\n  const insertLink = (): void => {\n    const label = linkText.trim();\n    const target = dialog === "external" ? url.trim() : articleId;\n    if (\n      !label ||\n      !target ||\n      (dialog === "external" && !/^https?:\\/\\//i.test(target))\n    )\n      return;\n    const token =\n      dialog === "external"\n        ? `[${label}](${target})`\n        : `[[doc:${target}|${label}]]`;\n    updateMarkdown(\n      markdown.slice(0, selection.start) +\n        token +\n        markdown.slice(selection.end),\n      {\n        origin: "toolbar",\n        selectionEnd: selection.start + token.length,\n        selectionStart: selection.start + token.length,\n      },\n    );\n    setDialog(null);\n    restoreSelection(selection.start + token.length);\n  };''',
          '''  const openArticlePicker = (): void => {\n    const textarea = textareaRef.current;\n    if (!textarea || !onBeginArticleLinkPick) return;\n    articleLinkSelectionRef.current = {\n      start: textarea.selectionStart,\n      end: textarea.selectionEnd,\n      label: markdown\n        .slice(textarea.selectionStart, textarea.selectionEnd)\n        .trim(),\n    };\n    onBeginArticleLinkPick({\n      sourceDocumentId: document.id,\n      onPick: (targetDocumentId) => {\n        const draft = articleLinkSelectionRef.current;\n        const target = documentsRef.current.find(\n          (item) =>\n            item.id === targetDocumentId &&\n            item.id !== document.id &&\n            item.projectId === document.projectId,\n        );\n        if (!draft || !target) return;\n        const label = draft.label || target.title;\n        const token = `[[doc:${target.id}|${label}]]`;\n        const currentMarkdown = markdownRef.current;\n        contentHistory.commitMarkdown(\n          document.id,\n          currentMarkdown.slice(0, draft.start) +\n            token +\n            currentMarkdown.slice(draft.end),\n          {\n            origin: "toolbar",\n            selectionEnd: draft.start + token.length,\n            selectionStart: draft.start + token.length,\n          },\n        );\n        articleLinkSelectionRef.current = null;\n        restoreSelection(draft.start + token.length);\n      },\n    });\n  };\n\n  const insertLink = (): void => {\n    const label = linkText.trim();\n    const target = url.trim();\n    if (!label || !/^https?:\\/\\//i.test(target)) return;\n    const token = `[${label}](${target})`;\n    updateMarkdown(\n      markdown.slice(0, selection.start) +\n        token +\n        markdown.slice(selection.end),\n      {\n        origin: "toolbar",\n        selectionEnd: selection.start + token.length,\n        selectionStart: selection.start + token.length,\n      },\n    );\n    setDialog(null);\n    restoreSelection(selection.start + token.length);\n  };''')
          replace(path, '''          onClick={openArticleDialog}\n''', '''          onClick={openArticlePicker}\n''')
          replace(path,
          '''                    <h3 id="markdown-link-dialog-title">\n                      {dialog === "external"\n                        ? "Добавить внешнюю ссылку"\n                        : "Ссылка на статью"}\n                    </h3>''',
          '''                    <h3 id="markdown-link-dialog-title">\n                      Добавить внешнюю ссылку\n                    </h3>''')
          replace(path,
          '''                    <label htmlFor="markdown-link-target">\n                      {dialog === "external" ? "Адрес" : "Статья"}\n                    </label>\n                    {dialog === "external" ? (\n                      <input\n                        id="markdown-link-target"\n                        ref={addressRef}\n                        placeholder="https://…"\n                        value={url}\n                        onChange={(event) => setUrl(event.currentTarget.value)}\n                      />\n                    ) : (\n                      <select\n                        id="markdown-link-target"\n                        autoFocus\n                        value={articleId}\n                        onChange={(event) => {\n                          setArticleId(event.currentTarget.value);\n                          const item = documents.find(\n                            (entry) => entry.id === event.currentTarget.value,\n                          );\n                          if (item && !linkText) setLinkText(item.title);\n                        }}\n                      >\n                        <option value="">Выберите статью</option>\n                        {documents\n                          .filter(\n                            (item) =>\n                              item.id !== document.id &&\n                              item.projectId === document.projectId,\n                          )\n                          .map((item) => (\n                            <option key={item.id} value={item.id}>\n                              {item.title}\n                            </option>\n                          ))}\n                      </select>\n                    )}''',
          '''                    <label htmlFor="markdown-link-target">Адрес</label>\n                    <input\n                      id="markdown-link-target"\n                      ref={addressRef}\n                      placeholder="https://…"\n                      value={url}\n                      onChange={(event) => setUrl(event.currentTarget.value)}\n                    />''')
          replace(path,
          '''                        disabled={\n                          !linkText.trim() ||\n                          !(dialog === "external"\n                            ? /^https?:\\/\\//i.test(url.trim())\n                            : articleId)\n                        }''',
          '''                        disabled={\n                          !linkText.trim() || !/^https?:\\/\\//i.test(url.trim())\n                        }''')

          # knowledge-workspace.tsx: relay picker start callback to both editor panes.
          path = "src/prototype/knowledge/knowledge-workspace.tsx"
          replace(path,
          '''import { MarkdownSourceEditor } from "./markdown-source-editor";''',
          '''import {\n  MarkdownSourceEditor,\n  type KnowledgeArticleLinkPickRequest,\n} from "./markdown-source-editor";''')
          replace(path,
          '''  treeOpen?: boolean;\n};''',
          '''  treeOpen?: boolean;\n  onBeginArticleLinkPick?: (request: KnowledgeArticleLinkPickRequest) => void;\n};''')
          replace(path,
          '''  onToggleTree,\n  treeOpen = true,\n}: KnowledgeWorkspaceProps): React.JSX.Element {''',
          '''  onToggleTree,\n  treeOpen = true,\n  onBeginArticleLinkPick,\n}: KnowledgeWorkspaceProps): React.JSX.Element {''')
          replace(path,
          '''                onActivate={() => activatePane("primary")}\n                splitEnabled={splitEnabled}\n''',
          '''                onActivate={() => activatePane("primary")}\n                onBeginArticleLinkPick={onBeginArticleLinkPick}\n                splitEnabled={splitEnabled}\n''')
          replace(path,
          '''                  onActivate={() => activatePane("secondary")}\n                  secondary\n''',
          '''                  onActivate={() => activatePane("secondary")}\n                  onBeginArticleLinkPick={onBeginArticleLinkPick}\n                  secondary\n''')
          replace(path,
          '''  onActivate,\n  splitEnabled,\n}: {''',
          '''  onActivate,\n  onBeginArticleLinkPick,\n  splitEnabled,\n}: {''')
          replace(path,
          '''  onActivate: () => void;\n  splitEnabled: boolean;\n}): React.JSX.Element {''',
          '''  onActivate: () => void;\n  onBeginArticleLinkPick?: (request: KnowledgeArticleLinkPickRequest) => void;\n  splitEnabled: boolean;\n}): React.JSX.Element {''')
          replace(path,
          '''        <MarkdownSourceEditor\n          document={document}\n          documents={documents}\n          key={document.id}\n        />''',
          '''        <MarkdownSourceEditor\n          document={document}\n          documents={documents}\n          key={document.id}\n          onBeginArticleLinkPick={onBeginArticleLinkPick}\n        />''')

          # knowledge-sidebar.tsx: tree becomes the article target picker without navigating away.
          path = "src/prototype/knowledge/knowledge-sidebar.tsx"
          replace(path,
          '''  dispatch,\n  onClose,\n}: {\n  state: DesktopPrototypeState;\n  dispatch: Dispatch;\n  onClose?: () => void;\n}): React.JSX.Element {''',
          '''  dispatch,\n  onClose,\n  linkPickerSourceDocumentId,\n  onCancelLinkPick,\n  onPickLinkTarget,\n}: {\n  state: DesktopPrototypeState;\n  dispatch: Dispatch;\n  onClose?: () => void;\n  linkPickerSourceDocumentId?: string | null;\n  onCancelLinkPick?: () => void;\n  onPickLinkTarget?: (documentId: string) => void;\n}): React.JSX.Element {''')
          replace(path,
          '''  const treeCollapsed = state.knowledgeExpandedBeforeCollapse !== null;\n''',
          '''  const treeCollapsed = state.knowledgeExpandedBeforeCollapse !== null;\n  const linkPickerActive = Boolean(linkPickerSourceDocumentId);\n''')
          replace(path,
          '''      className="tool-sidebar knowledge-sidebar"\n''',
          '''      className={`tool-sidebar knowledge-sidebar ${\n        linkPickerActive ? "is-link-picker" : ""\n      }`}\n''')
          replace(path,
          '''      <nav\n        className="knowledge-tree"\n''',
          '''      {linkPickerActive ? (\n        <div className="knowledge-link-picker-banner" role="status">\n          <span>Выберите статью для ссылки</span>\n          <button onClick={onCancelLinkPick} type="button">\n            Отмена\n          </button>\n        </div>\n      ) : null}\n      <nav\n        className="knowledge-tree"\n''')
          replace(path,
          '''              onKnowledgeMenuChange={setOpenKnowledgeMenu}\n              onDropTargetChange={setKnowledgeDropTarget}\n              openKnowledgeMenu={openKnowledgeMenu}\n              state={state}\n''',
          '''              onKnowledgeMenuChange={setOpenKnowledgeMenu}\n              onDropTargetChange={setKnowledgeDropTarget}\n              openKnowledgeMenu={openKnowledgeMenu}\n              state={state}\n              linkPickerSourceDocumentId={linkPickerSourceDocumentId}\n              onPickLinkTarget={onPickLinkTarget}\n''')
          replace(path,
          '''  openKnowledgeMenu,\n}: {\n''',
          '''  openKnowledgeMenu,\n  linkPickerSourceDocumentId,\n  onPickLinkTarget,\n}: {\n''')
          replace(path,
          '''  openKnowledgeMenu: KnowledgeMenuTarget;\n}): React.JSX.Element {''',
          '''  openKnowledgeMenu: KnowledgeMenuTarget;\n  linkPickerSourceDocumentId?: string | null;\n  onPickLinkTarget?: (documentId: string) => void;\n}): React.JSX.Element {''')
          replace(path,
          '''                openKnowledgeMenu={openKnowledgeMenu}\n                state={state}\n''',
          '''                openKnowledgeMenu={openKnowledgeMenu}\n                state={state}\n                linkPickerSourceDocumentId={linkPickerSourceDocumentId}\n                onPickLinkTarget={onPickLinkTarget}\n''')
          replace(path,
          '''    documentPathIsSelected ? "is-path-selected" : "",\n  ]''',
          '''    documentPathIsSelected ? "is-path-selected" : "",\n    linkPickerSourceDocumentId && node.document.id !== linkPickerSourceDocumentId\n      ? "is-link-picker-target"\n      : "",\n    linkPickerSourceDocumentId === node.document.id\n      ? "is-link-picker-source"\n      : "",\n  ]''')
          replace(path, '''        draggable\n''', '''        draggable={!linkPickerSourceDocumentId}\n''')
          replace(path,
          '''        onClick={() =>\n          dispatch({\n            type: "open-knowledge-document-in-active-pane",\n            documentId: node.document.id,\n          })\n        }\n        type="button"''',
          '''        disabled={linkPickerSourceDocumentId === node.document.id}\n        onClick={() => {\n          if (linkPickerSourceDocumentId) {\n            if (node.document.id === linkPickerSourceDocumentId) return;\n            onPickLinkTarget?.(node.document.id);\n            return;\n          }\n          dispatch({\n            type: "open-knowledge-document-in-active-pane",\n            documentId: node.document.id,\n          });\n        }}\n        type="button"''')
          replace(path,
          '''      <IconButton\n        aria-expanded={\n          openKnowledgeMenu?.kind === "document" &&\n          openKnowledgeMenu.id === node.document.id\n        }''',
          '''      {!linkPickerSourceDocumentId ? (\n        <IconButton\n        aria-expanded={\n          openKnowledgeMenu?.kind === "document" &&\n          openKnowledgeMenu.id === node.document.id\n        }''')
          replace(path,
          '''        variant="ghost"\n      />\n      {openKnowledgeMenu?.kind === "document" &&\n      openKnowledgeMenu.id === node.document.id ? (''',
          '''        variant="ghost"\n        />\n      ) : null}\n      {!linkPickerSourceDocumentId &&\n      openKnowledgeMenu?.kind === "document" &&\n      openKnowledgeMenu.id === node.document.id ? (''')

          # desktop-shell.tsx: transient picker state lives beside the sidebar/workspace; never persisted.
          path = "src/prototype/desktop-shell.tsx"
          replace(path,
          '''import { KnowledgeWorkspace } from "@/prototype/knowledge/knowledge-workspace";''',
          '''import { KnowledgeWorkspace } from "@/prototype/knowledge/knowledge-workspace";\nimport type { KnowledgeArticleLinkPickRequest } from "@/prototype/knowledge/markdown-source-editor";''')
          replace(path,
          '''  const [knowledgeSidebarCollapsed, setKnowledgeSidebarCollapsed] =\n    useState(false);\n  const knowledgeDispatch = knowledgeHistory.dispatchKnowledgeAction;''',
          '''  const [knowledgeSidebarCollapsed, setKnowledgeSidebarCollapsed] =\n    useState(false);\n  const [knowledgeArticleLinkPicker, setKnowledgeArticleLinkPicker] =\n    useState<KnowledgeArticleLinkPickRequest | null>(null);\n  const knowledgeDispatch = knowledgeHistory.dispatchKnowledgeAction;\n\n  useEffect(() => {\n    setKnowledgeArticleLinkPicker(null);\n  }, [state.activeProjectId, state.activeSection]);\n\n  useEffect(() => {\n    if (!knowledgeArticleLinkPicker) return;\n    const cancelOnEscape = (event: KeyboardEvent): void => {\n      if (event.key !== "Escape") return;\n      event.preventDefault();\n      setKnowledgeArticleLinkPicker(null);\n    };\n    window.addEventListener("keydown", cancelOnEscape);\n    return () => window.removeEventListener("keydown", cancelOnEscape);\n  }, [knowledgeArticleLinkPicker]);\n\n  const beginKnowledgeArticleLinkPick = (\n    request: KnowledgeArticleLinkPickRequest,\n  ): void => {\n    setKnowledgeArticleLinkPicker(request);\n    setKnowledgeSidebarCollapsed(false);\n    if (\n      typeof window !== "undefined" &&\n      window.matchMedia("(max-width: 1023px)").matches\n    ) {\n      setKnowledgeTreeOverlayOpen(true);\n    }\n  };\n\n  const pickKnowledgeArticleLinkTarget = (documentId: string): void => {\n    const picker = knowledgeArticleLinkPicker;\n    if (!picker || documentId === picker.sourceDocumentId) return;\n    setKnowledgeArticleLinkPicker(null);\n    picker.onPick(documentId);\n    setKnowledgeTreeOverlayOpen(false);\n  };''')
          replace(path,
          '''    {\n      onCloseKnowledgeTree: () => setKnowledgeTreeOverlayOpen(false),\n    },\n''',
          '''    {\n      onCloseKnowledgeTree: () => setKnowledgeTreeOverlayOpen(false),\n      linkPickerSourceDocumentId:\n        knowledgeArticleLinkPicker?.sourceDocumentId ?? null,\n      onCancelKnowledgeLinkPick: () => setKnowledgeArticleLinkPicker(null),\n      onPickKnowledgeLinkTarget: pickKnowledgeArticleLinkTarget,\n    },\n''')
          replace(path,
          '''              onOpenKnowledgeTree: () => {\n''',
          '''              onBeginArticleLinkPick: beginKnowledgeArticleLinkPick,\n              onOpenKnowledgeTree: () => {\n''')
          replace(path,
          '''  options?: { onCloseKnowledgeTree?: () => void },\n''',
          '''  options?: {\n    onCloseKnowledgeTree?: () => void;\n    linkPickerSourceDocumentId?: string | null;\n    onCancelKnowledgeLinkPick?: () => void;\n    onPickKnowledgeLinkTarget?: (documentId: string) => void;\n  },\n''')
          replace(path,
          '''        onClose={options?.onCloseKnowledgeTree}\n      />''',
          '''        onClose={options?.onCloseKnowledgeTree}\n        linkPickerSourceDocumentId={options?.linkPickerSourceDocumentId}\n        onCancelLinkPick={options?.onCancelKnowledgeLinkPick}\n        onPickLinkTarget={options?.onPickKnowledgeLinkTarget}\n      />''')
          replace(path,
          '''    onOpenKnowledgeTree?: () => void;\n''',
          '''    onBeginArticleLinkPick?: (request: KnowledgeArticleLinkPickRequest) => void;\n    onOpenKnowledgeTree?: () => void;\n''')
          replace(path,
          '''        onOpenTree={options?.onOpenKnowledgeTree}\n''',
          '''        onBeginArticleLinkPick={options?.onBeginArticleLinkPick}\n        onOpenTree={options?.onOpenKnowledgeTree}\n''')

          # desktop-knowledge.css: internal links look like links; picker gets a compact tree-local banner.
          path = "src/prototype/desktop-knowledge.css"
          replace(path,
          '''  .knowledge-sidebar {\n    display: grid;\n    grid-template-rows: auto auto minmax(0, 1fr) auto;\n    overflow: hidden;\n  }''',
          '''  .knowledge-sidebar {\n    display: grid;\n    grid-template-rows: auto auto minmax(0, 1fr) auto;\n    overflow: hidden;\n  }\n\n  .knowledge-sidebar.is-link-picker {\n    grid-template-rows: auto auto auto minmax(0, 1fr) auto;\n  }''')
          replace(path,
          '''  .knowledge-tree {\n    min-height: 0;\n    overflow: auto;\n    padding: 6px 8px 12px;\n  }''',
          '''  .knowledge-link-picker-banner {\n    min-width: 0;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 8px;\n    border-bottom: 1px solid var(--border);\n    background: color-mix(in srgb, #ff5200 7%, var(--surface) 93%);\n    color: var(--text-2);\n    padding: 7px 10px;\n    font-size: 12px;\n    line-height: 16px;\n  }\n\n  .knowledge-link-picker-banner span {\n    min-width: 0;\n    overflow: hidden;\n    text-overflow: ellipsis;\n    white-space: nowrap;\n  }\n\n  .knowledge-link-picker-banner button {\n    flex: 0 0 auto;\n    border: 0;\n    background: transparent;\n    color: #ff5200;\n    padding: 2px 4px;\n    font: inherit;\n    font-weight: 600;\n    cursor: pointer;\n  }\n\n  .knowledge-link-picker-banner button:hover,\n  .knowledge-link-picker-banner button:focus-visible {\n    text-decoration: underline;\n    text-underline-offset: 2px;\n  }\n\n  .knowledge-tree {\n    min-height: 0;\n    overflow: auto;\n    padding: 6px 8px 12px;\n  }''')
          replace(path,
          '''  .knowledge-tree-row:focus-visible {\n    outline: 2px solid var(--sidebar-focus-ring);\n    outline-offset: -1px;\n  }''',
          '''  .knowledge-tree-row:focus-visible {\n    outline: 2px solid var(--sidebar-focus-ring);\n    outline-offset: -1px;\n  }\n\n  .knowledge-action-row.is-link-picker-target .knowledge-tree-row.document {\n    cursor: pointer;\n  }\n\n  .knowledge-action-row.is-link-picker-target:hover {\n    background: color-mix(in srgb, #ff5200 9%, var(--surface) 91%);\n  }\n\n  .knowledge-action-row.is-link-picker-target:hover\n    .knowledge-tree-row.document {\n    color: #ff5200;\n  }\n\n  .knowledge-action-row.is-link-picker-source {\n    opacity: 0.42;\n  }\n\n  .knowledge-action-row.is-link-picker-source .knowledge-tree-row.document {\n    cursor: not-allowed;\n  }''')
          replace(path,
          '''  .document-page a {\n    color: var(--accent-2);\n    text-decoration: underline;\n    text-underline-offset: 2px;\n  }''',
          '''  .document-page a {\n    color: var(--accent-2);\n    text-decoration: underline;\n    text-underline-offset: 2px;\n  }\n\n  .document-internal-link {\n    display: inline;\n    appearance: none;\n    border: 0;\n    background: transparent;\n    color: #ff5200;\n    margin: 0;\n    padding: 0;\n    font: inherit;\n    line-height: inherit;\n    text-align: inherit;\n    text-decoration: underline;\n    text-decoration-thickness: 0.08em;\n    text-underline-offset: 0.14em;\n    cursor: pointer;\n    vertical-align: baseline;\n  }\n\n  .document-internal-link:hover {\n    color: #d94800;\n  }\n\n  .document-internal-link:focus-visible {\n    border-radius: 2px;\n    outline: 2px solid currentColor;\n    outline-offset: 2px;\n  }''')

          # Add a focused regression contract for the UX wiring.
          test = Path("tests/knowledge-internal-link-picker-runtime.test.ts")
          test.write_text('''import { describe, expect, it } from "vitest";\nimport { readFileSync } from "node:fs";\nimport { resolve } from "node:path";\n\nconst root = resolve(process.cwd());\nconst read = (path: string): string => readFileSync(resolve(root, path), "utf8");\n\ndescribe("Knowledge internal article link picker runtime", () => {\n  it("uses the Knowledge tree instead of an article dropdown modal", () => {\n    const editor = read("src/prototype/knowledge/markdown-source-editor.tsx");\n    const sidebar = read("src/prototype/knowledge/knowledge-sidebar.tsx");\n    const shell = read("src/prototype/desktop-shell.tsx");\n\n    expect(editor).toContain("onBeginArticleLinkPick");\n    expect(editor).toContain("openArticlePicker");\n    expect(editor).not.toContain('setDialog("article")');\n    expect(editor).not.toContain("<option value=\\\"\\\">Выберите статью</option>");\n    expect(sidebar).toContain("Выберите статью для ссылки");\n    expect(sidebar).toContain("onPickLinkTarget?.(node.document.id)");\n    expect(shell).toContain("knowledgeArticleLinkPicker");\n    expect(shell).toContain("pickKnowledgeArticleLinkTarget");\n  });\n\n  it("styles internal links as orange underlined links", () => {\n    const css = read("src/prototype/desktop-knowledge.css");\n    expect(css).toContain(".document-internal-link {");\n    expect(css).toContain("color: #ff5200;");\n    expect(css).toContain("text-decoration: underline;");\n  });\n});\n''')
          PY
      - name: Check patch
        run: |
          git diff --check
          grep -q 'className="document-internal-link"' src/prototype/knowledge/markdown-document-preview.tsx
          grep -q 'Выберите статью для ссылки' src/prototype/knowledge/knowledge-sidebar.tsx
          ! grep -q 'setDialog("article")' src/prototype/knowledge/markdown-source-editor.tsx
      - name: Commit final patch and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-knowledge-tree-link-picker.yml
          git add src/prototype/desktop-shell.tsx src/prototype/desktop-knowledge.css src/prototype/knowledge/knowledge-sidebar.tsx src/prototype/knowledge/knowledge-workspace.tsx src/prototype/knowledge/markdown-source-editor.tsx tests/knowledge-internal-link-picker-runtime.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Knowledge: pick internal article links from tree"
          git push origin HEAD:fix/knowledge-internal-links-beside
