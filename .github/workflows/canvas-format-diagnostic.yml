name: Canvas Format Diagnostic

on:
  push:
    branches:
      - agent/canvas-miro-ux-corrections

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show exact Prettier diff
        shell: bash
        run: |
          pnpm exec prettier --write \
            src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx \
            tests/canvas-undo-redo-runtime.test.ts
          git diff -- \
            src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx \
            tests/canvas-undo-redo-runtime.test.ts
