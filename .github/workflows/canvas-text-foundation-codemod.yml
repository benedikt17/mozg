name: Canvas text foundation follow-up

on:
  push:
    branches:
      - agent/canvas-miro-text-foundation
    paths:
      - .github/workflows/canvas-text-foundation-codemod.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Harden inline text interaction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shell = Path('src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx')
          source = shell.read_text()
          draft_anchor = '''  const [draft, setDraft] = useState(data.markdown);\n  useEffect(() => {\n    if (!data.isEditing) setDraft(data.markdown);\n  }, [data.isEditing, data.markdown]);'''
          draft_replacement = '''  const [draft, setDraft] = useState(data.markdown);\n  const skipNextBlurCommitRef = useRef(false);\n  useEffect(() => {\n    if (!data.isEditing) setDraft(data.markdown);\n    else skipNextBlurCommitRef.current = false;\n  }, [data.isEditing, data.markdown]);'''
          assert source.count(draft_anchor) == 1
          source = source.replace(draft_anchor, draft_replacement, 1)
          cancel_anchor = '''  const cancel = () => {\n    setDraft(data.markdown);'''
          cancel_replacement = '''  const cancel = () => {\n    skipNextBlurCommitRef.current = true;\n    setDraft(data.markdown);'''
          assert source.count(cancel_anchor) == 1
          source = source.replace(cancel_anchor, cancel_replacement, 1)
          blur_anchor = '''            onBlur={commit}\n            onChange={(event) => update(event.target.value)}'''
          blur_replacement = '''            onBlur={() => {\n              if (skipNextBlurCommitRef.current) {\n                skipNextBlurCommitRef.current = false;\n                return;\n              }\n              commit();\n            }}\n            onChange={(event) => update(event.target.value)}'''
          assert source.count(blur_anchor) == 1
          source = source.replace(blur_anchor, blur_replacement, 1)
          ctrl_anchor = '''                event.preventDefault();\n                commit();\n              }'''
          ctrl_replacement = '''                event.preventDefault();\n                event.currentTarget.blur();\n              }'''
          assert source.count(ctrl_anchor) == 1
          source = source.replace(ctrl_anchor, ctrl_replacement, 1)
          shell.write_text(source)

          css = Path('src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css')
          source = css.read_text()
          toolbar_anchor = '''.nodeToolbarSlot {\n  top: -34px;\n  left: 0;\n}'''
          toolbar_replacement = '''.nodeToolbarSlot {\n  z-index: 20;\n  pointer-events: all;\n}'''
          assert source.count(toolbar_anchor) == 1
          source = source.replace(toolbar_anchor, toolbar_replacement, 1)
          css.write_text(source)
          PY
      - run: pnpm exec prettier --write src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css
      - name: Commit follow-up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css
          git commit -m "Canvas: harden inline text editing behavior"
          git push
