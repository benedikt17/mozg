name: Mobile responsive shell runner

on:
  push:
    branches:
      - feat/mobile-responsive-shell

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-responsive-shell
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply Mobile Stage 1
        run: python .github/scripts/apply_mobile_responsive_shell.py

      - name: Format touched files
        run: >-
          pnpm exec prettier --write
          src/prototype/desktop-shell.tsx
          src/prototype/desktop-shell.css
          src/prototype/shell/application-header.tsx
          src/prototype/shell/mobile-navigation.tsx
          src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx
          src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css
          tests/mobile-responsive-shell.test.ts

      - name: Focused mobile regression
        run: pnpm exec vitest run tests/mobile-responsive-shell.test.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Diff check
        run: git diff --check

      - name: Commit Mobile Stage 1
        run: |
          rm .github/scripts/apply_mobile_responsive_shell.py
          rm .github/workflows/mobile-responsive-shell-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Mobile: add responsive application shell"
          git push origin HEAD:feat/mobile-responsive-shell
