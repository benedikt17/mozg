name: One-time format Files Knowledge layout

on:
  push:
    branches:
      - feat/project-files-stage-a2-preview
    paths:
      - .github/workflows/one-time-format-files-knowledge-layout.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-files-stage-a2-preview
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/prototype/files/files-workspace.tsx
      - run: git diff --check
      - name: Remove formatter and commit
        run: |
          rm .github/workflows/one-time-format-files-knowledge-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/files/files-workspace.tsx .github/workflows/one-time-format-files-knowledge-layout.yml
          git commit -m "Files: apply canonical Knowledge-layout formatting"
          git push origin HEAD:feat/project-files-stage-a2-preview
