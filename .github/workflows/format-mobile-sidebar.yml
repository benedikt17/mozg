name: Format Mobile Sidebar Spec

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-sidebar-gestures-single-tap
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format mobile browser regression
        run: pnpm exec prettier --write tests/e2e/mobile-sidebar-navigation.spec.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/mobile-sidebar-navigation.spec.ts
          git commit -m "style: format mobile sidebar browser regression"
          git push origin HEAD:fix/mobile-sidebar-gestures-single-tap
