name: Apply Canvas PDF feature

on:
  push:
    branches:
      - feature/canvas-pdf-split-view

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canvas-pdf-split-view
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply feature patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          # Canvas document: introduce a V2-only PDF Project File node.
          path = "src/lib/canvas/canvas-document.ts"
          text = read(path)
          text = replace_once(text, '  maxTitleLength: 200,\n  maxIdLength: 256,', '  maxTitleLength: 200,\n  maxFileNameLength: 255,\n  maxIdLength: 256,', "canvas limits")
          text = replace_once(text, '''export type CanvasImageNode =\n  CanvasLegacyImageNode | CanvasProjectFileImageNode;\n\nexport type CanvasNode =\n  | CanvasTaskNode\n  | CanvasArticleNode\n  | CanvasTextNode\n  | CanvasShapeNode\n  | CanvasImageNode;''', '''export type CanvasImageNode =\n  CanvasLegacyImageNode | CanvasProjectFileImageNode;\n\nexport type CanvasPdfNode = CanvasNodeBase & {\n  kind: "pdf";\n  fileId: string;\n  lastKnownName?: string;\n};\n\nexport type CanvasNode =\n  | CanvasTaskNode\n  | CanvasArticleNode\n  | CanvasTextNode\n  | CanvasShapeNode\n  | CanvasImageNode\n  | CanvasPdfNode;''', "pdf canonical type")
          text = replace_once(text, '''function requireBoolean(value: unknown, path: string): boolean {''', '''function requireLastKnownFileName(value: unknown, path: string): string {\n  const name = requireString(value, path);\n  if (name.length > CANVAS_DOCUMENT_LIMITS.maxFileNameLength) {\n    fail(\n      "file_name_too_long",\n      path,\n      "lastKnownName exceeds the Canvas file name limit",\n    );\n  }\n  return name;\n}\n\nfunction requireBoolean(value: unknown, path: string): boolean {''', "pdf name validator")
          text = replace_once(text, '''function parseNode(\n  value: unknown,\n  path: string,\n  allowShape = false,\n): CanvasNode {\n  const node = requireRecord(value, path);\n  const kind = requireString(node.kind, `${path}.kind`) as CanvasNode["kind"];\n  if (kind === "shape" && !allowShape) {\n    fail(\n      "unsupported_node_kind",\n      `${path}.kind`,\n      "Canvas shape nodes require CanvasDocumentV2",\n    );\n  }''', '''function parseNode(\n  value: unknown,\n  path: string,\n  allowV2Extensions = false,\n): CanvasNode {\n  const node = requireRecord(value, path);\n  const kind = requireString(node.kind, `${path}.kind`) as CanvasNode["kind"];\n  if ((kind === "shape" || kind === "pdf") && !allowV2Extensions) {\n    fail(\n      "unsupported_node_kind",\n      `${path}.kind`,\n      "This Canvas node kind requires CanvasDocumentV2",\n    );\n  }''', "v2-only pdf parser gate")
          text = replace_once(text, '''  const allowedKeys =\n    kind === "task" || kind === "article"\n      ? optionalKeys\n      : kind === "text"\n        ? ["style"]\n        : [];''', '''  const allowedKeys =\n    kind === "task" || kind === "article"\n      ? optionalKeys\n      : kind === "text"\n        ? ["style"]\n        : kind === "pdf"\n          ? ["lastKnownName"]\n          : [];''', "pdf optional keys")
          text = replace_once(text, '''          : kind === "shape"\n            ? "shape"\n            : kind === "image"\n              ? hasImageFileId\n                ? "fileId"\n                : "assetId"\n              : null;''', '''          : kind === "shape"\n            ? "shape"\n            : kind === "image"\n              ? hasImageFileId\n                ? "fileId"\n                : "assetId"\n              : kind === "pdf"\n                ? "fileId"\n                : null;''', "pdf specific key")
          text = replace_once(text, '''  const aspectRatioLocked = node.aspectRatioLocked;''', '''  if (kind === "pdf") {\n    const result: CanvasPdfNode = {\n      id,\n      kind,\n      position,\n      size,\n      zIndex,\n      fileId: requireIdentifier(node.fileId, `${path}.fileId`),\n    };\n    if (Object.prototype.hasOwnProperty.call(node, "lastKnownName")) {\n      result.lastKnownName = requireLastKnownFileName(\n        node.lastKnownName,\n        `${path}.lastKnownName`,\n      );\n    }\n    return result;\n  }\n\n  const aspectRatioLocked = node.aspectRatioLocked;''', "pdf parse branch")
          write(path, text)

          path = "src/lib/canvas/react-flow-canvas-adapter.ts"
          text = read(path)
          text = replace_once(text, '  type CanvasPoint,\n  type CanvasSize,', '  type CanvasPoint,\n  type CanvasPdfNode,\n  type CanvasSize,', "adapter pdf import")
          text = replace_once(text, 'export const CANVAS_IMAGE_NODE_TYPE = "canvasImage";\nexport const CANVAS_TEXT_NODE_TYPE = "canvasText";', 'export const CANVAS_IMAGE_NODE_TYPE = "canvasImage";\nexport const CANVAS_PDF_NODE_TYPE = "canvasPdf";\nexport const CANVAS_TEXT_NODE_TYPE = "canvasText";', "adapter pdf type constant")
          text = replace_once(text, '''export type CanvasTextNodeData = {''', '''export type CanvasPdfNodeData = {\n  fileId: string;\n  lastKnownName?: string;\n};\n\nexport type CanvasPdfFlowNode = Node<\n  CanvasPdfNodeData,\n  typeof CANVAS_PDF_NODE_TYPE\n>;\n\nexport type CanvasTextNodeData = {''', "adapter pdf data")
          text = replace_once(text, '''export type CanvasFlowNode =\n  | CanvasImageFlowNode\n  | CanvasTextFlowNode''', '''export type CanvasFlowNode =\n  | CanvasImageFlowNode\n  | CanvasPdfFlowNode\n  | CanvasTextFlowNode''', "adapter flow union")
          marker = '''export function createCanvasTaskId(\n  idGenerator: () => string = () =>\n    globalThis.crypto?.randomUUID?.() ??\n    `${Date.now()}-${Math.random().toString(36).slice(2)}`,\n): string {'''
          insert = '''export function createCanvasPdfId(\n  idGenerator: () => string = () =>\n    globalThis.crypto?.randomUUID?.() ??\n    `${Date.now()}-${Math.random().toString(36).slice(2)}`,\n): string {\n  return `pdf-node-${idGenerator()}`;\n}\n\nexport function createCanvasPdfFlowNode(input: {\n  id: string;\n  fileId: string;\n  lastKnownName?: string;\n  position: FlowPosition;\n  size?: CanvasSize;\n  zIndex?: number;\n}): CanvasPdfFlowNode {\n  const size = input.size ?? { width: 300, height: 180 };\n  return {\n    id: input.id,\n    type: CANVAS_PDF_NODE_TYPE,\n    position: { ...input.position },\n    width: size.width,\n    height: size.height,\n    style: { width: size.width, height: size.height },\n    zIndex: input.zIndex,\n    data: {\n      fileId: input.fileId,\n      ...(input.lastKnownName === undefined\n        ? {}\n        : { lastKnownName: input.lastKnownName }),\n    },\n  };\n}\n\n''' + marker
          text = replace_once(text, marker, insert, "adapter pdf factory")
          marker = '''export function canvasDocumentToTaskNodes(\n  document: CanvasDocument,'''
          insert = '''export function canvasDocumentToPdfNodes(\n  document: CanvasDocument,\n): CanvasPdfFlowNode[] {\n  return document.nodes\n    .filter((node): node is CanvasPdfNode => node.kind === "pdf")\n    .map((node) =>\n      createCanvasPdfFlowNode({\n        id: node.id,\n        fileId: node.fileId,\n        lastKnownName: node.lastKnownName,\n        position: node.position,\n        size: node.size,\n        zIndex: node.zIndex,\n      }),\n    );\n}\n\n''' + marker
          text = replace_once(text, marker, insert, "adapter pdf projection")
          text = replace_once(text, '''    if (node.kind === "text" && runtime.type === CANVAS_TEXT_NODE_TYPE) {''', '''    if (node.kind === "pdf" && runtime.type === CANVAS_PDF_NODE_TYPE) {\n      return {\n        ...node,\n        position: { ...runtime.position },\n        size: runtimeNodeSize(runtime),\n      };\n    }\n    if (node.kind === "text" && runtime.type === CANVAS_TEXT_NODE_TYPE) {''', "adapter pdf runtime serialization")
          write(path, text)

          path = "src/lib/canvas/canvas-node-clipboard.ts"
          text = read(path)
          text = replace_once(text, '''    node.kind === "image" ||\n    node.kind === "text" ||''', '''    node.kind === "image" ||\n    node.kind === "pdf" ||\n    node.kind === "text" ||''', "clipboard pdf")
          write(path, text)

          path = "src/prototype/canvases/canvas-project-file-picker.tsx"
          text = read(path)
          text = replace_once(text, '                      : "В этом проекте нет изображений"}', '                      : "В этом проекте нет изображений и PDF"}', "file picker empty copy")
          text = replace_once(text, '''                      <span>\n                        {file.width}×{file.height} · {file.mimeType}\n                      </span>''', '''                      <span>\n                        {file.mimeType === "application/pdf"\n                          ? `PDF · ${Math.max(1, Math.round(file.byteSize / 1024))} КБ`\n                          : `${file.width}×${file.height} · ${file.mimeType}`}\n                      </span>''', "file picker pdf metadata")
          write(path, text)

          path = "src/prototype/canvases/canvas-desktop-composition.tsx"
          text = read(path)
          text = replace_once(text, '''  onAddImage,\n  onAddText,''', '''  onAddImage,\n  onAddPdf,\n  onAddText,''', "toolbar pdf destructure")
          text = replace_once(text, '''  onAddImage: (files: File[]) => void;\n  onAddText: () => void;''', '''  onAddImage: (files: File[]) => void;\n  onAddPdf: (files: File[]) => void;\n  onAddText: () => void;''', "toolbar pdf prop")
          text = replace_once(text, '''  const fileInputRef = useRef<HTMLInputElement>(null);\n  const taskPickerTriggerRef''', '''  const fileInputRef = useRef<HTMLInputElement>(null);\n  const pdfInputRef = useRef<HTMLInputElement>(null);\n  const taskPickerTriggerRef''', "toolbar pdf input ref")
          text = replace_once(text, '''        <input\n          ref={fileInputRef}\n          type="file"\n          accept="image/*"\n          multiple\n          hidden\n          onChange={(event) => {\n            onAddImage(Array.from(event.target.files ?? []));\n            event.target.value = "";\n          }}\n        />''', '''        <input\n          ref={fileInputRef}\n          type="file"\n          accept="image/*"\n          multiple\n          hidden\n          onChange={(event) => {\n            onAddImage(Array.from(event.target.files ?? []));\n            event.target.value = "";\n          }}\n        />\n        <input\n          ref={pdfInputRef}\n          type="file"\n          accept="application/pdf,.pdf"\n          multiple\n          hidden\n          onChange={(event) => {\n            onAddPdf(Array.from(event.target.files ?? []));\n            event.target.value = "";\n          }}\n        />''', "toolbar hidden pdf input")
          text = replace_once(text, '''        <Button\n          type="button"\n          variant="ghost"\n          size="sm"\n          onClick={() => fileInputRef.current?.click()}\n          aria-label="Добавить изображение"\n          title="Добавить изображение"\n        >\n          <UiIcon name="upload" />\n        </Button>''', '''        <Button\n          type="button"\n          variant="ghost"\n          size="sm"\n          onClick={() => fileInputRef.current?.click()}\n          aria-label="Добавить изображение"\n          title="Добавить изображение"\n        >\n          <UiIcon name="upload" />\n        </Button>\n        <Button\n          type="button"\n          variant="ghost"\n          size="sm"\n          onClick={() => pdfInputRef.current?.click()}\n          aria-label="Добавить PDF"\n          title="Добавить PDF"\n        >\n          <UiIcon name="file-plus" />\n        </Button>''', "toolbar pdf button")
          write(path, text)

          path = "src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx"
          text = read(path)
          text = replace_once(text, '''  CANVAS_IMAGE_NODE_TYPE,\n  CANVAS_SHAPE_NODE_TYPE,''', '''  CANVAS_IMAGE_NODE_TYPE,\n  CANVAS_PDF_NODE_TYPE,\n  CANVAS_SHAPE_NODE_TYPE,''', "shell pdf type import")
          text = replace_once(text, '''  canvasDocumentToShapeNodes,\n  canvasDocumentToTaskNodes,''', '''  canvasDocumentToPdfNodes,\n  canvasDocumentToShapeNodes,\n  canvasDocumentToTaskNodes,''', "shell pdf projection import")
          text = replace_once(text, '''  createCanvasShapeFlowNode,\n  createCanvasTaskFlowNode,''', '''  createCanvasPdfFlowNode,\n  createCanvasPdfId,\n  createCanvasShapeFlowNode,\n  createCanvasTaskFlowNode,''', "shell pdf factory import")
          text = replace_once(text, '''  const [filePickerOpen, setFilePickerOpen] = useState(false);''', '''  const [filePickerOpen, setFilePickerOpen] = useState(false);\n  const [openPdf, setOpenPdf] = useState<{ fileId: string; name: string; objectUrl: string } | null>(null);''', "shell pdf reader state")
          text = replace_once(text, '''        ...canvasDocumentToTextNodes(state.document),\n        ...canvasDocumentToShapeNodes(state.document),''', '''        ...canvasDocumentToTextNodes(state.document),\n        ...canvasDocumentToPdfNodes(state.document),\n        ...canvasDocumentToShapeNodes(state.document),''', "shell restore pdf nodes")
          text = replace_once(text, '''          } else if (node.kind === "shape") {''', '''          } else if (node.kind === "pdf") {\n            runtimeNodes.push(\n              createCanvasPdfFlowNode({\n                id: node.id,\n                fileId: node.fileId,\n                lastKnownName: node.lastKnownName,\n                position: node.position,\n                size: node.size,\n                zIndex: node.zIndex,\n              }),\n            );\n          } else if (node.kind === "shape") {''', "clipboard pdf runtime")
          marker = '''  const createProjectFileNode = useCallback(\n    async (file: ProjectFileRecord) => {'''
          insert = '''  const createPdfNodeFromProjectFile = useCallback(\n    (file: ProjectFileRecord) => {\n      if (file.mimeType !== "application/pdf" || !shellStateRef.current.canvasId)\n        return;\n      const zIndex =\n        Math.max(\n          0,\n          ...controller.state.document.nodes.map((node) => node.zIndex),\n        ) + 1;\n      const canonical = {\n        id: createCanvasPdfId(),\n        kind: "pdf" as const,\n        fileId: file.id,\n        lastKnownName: file.name,\n        position: centerPosition(),\n        size: { width: 300, height: 180 },\n        zIndex,\n      };\n      const runtime = createCanvasPdfFlowNode(canonical);\n      setNodes((current) => [\n        ...current.map((node) =>\n          node.selected ? { ...node, selected: false } : node,\n        ),\n        { ...runtime, selected: true },\n      ]);\n      controller.insertCanvasNodes([canonical]);\n      syncState();\n      scheduleSave();\n      setFilePickerOpen(false);\n    },\n    [centerPosition, controller, scheduleSave, setNodes, syncState],\n  );\n\n''' + marker
          text = replace_once(text, marker, insert, "shell create pdf node")
          text = replace_once(text, '''    async (file: ProjectFileRecord) => {\n      const canvasId = shellStateRef.current.canvasId;''', '''    async (file: ProjectFileRecord) => {\n      if (file.mimeType === "application/pdf") {\n        createPdfNodeFromProjectFile(file);\n        return;\n      }\n      const canvasId = shellStateRef.current.canvasId;''', "project file picker pdf branch")
          text = replace_once(text, '''      centerPosition,\n      controller,\n      projectFileImageDependenciesForCanvas,''', '''      centerPosition,\n      controller,\n      createPdfNodeFromProjectFile,\n      projectFileImageDependenciesForCanvas,''', "project file callback dep")
          marker = '''  const onPicker = useCallback(\n    (event: ChangeEvent<HTMLInputElement>) => {'''
          insert = '''  const uploadPdfFiles = useCallback(\n    async (files: File[]) => {\n      if (!projectFileRepository || !projectId || files.length === 0) return;\n      for (const file of files) {\n        if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf"))\n          continue;\n        try {\n          const uploaded = await projectFileRepository.uploadFile({\n            workspaceId: shellWorkspaceId,\n            projectId,\n            name: file.name,\n            originalName: file.name,\n            blob: file,\n            mimeType: "application/pdf",\n            byteSize: file.size,\n          });\n          createPdfNodeFromProjectFile(uploaded);\n        } catch (error: unknown) {\n          setShellState((current) => ({\n            ...current,\n            status: "error",\n            error: error instanceof Error ? error.message : "PDF upload failed.",\n          }));\n        }\n      }\n    },\n    [createPdfNodeFromProjectFile, projectFileRepository, projectId, shellWorkspaceId],\n  );\n\n''' + marker
          text = replace_once(text, marker, insert, "shell pdf uploader")
          marker = '''  const onDrop = useCallback(\n    (event: ReactDragEvent<HTMLDivElement>) => {'''
          insert = '''  const openPdfNode = useCallback(\n    async (node: CanvasFlowNode) => {\n      if (node.type !== CANVAS_PDF_NODE_TYPE || !projectFileRepository || !projectId)\n        return;\n      try {\n        const downloaded = await projectFileRepository.downloadFile({\n          workspaceId: shellWorkspaceId,\n          projectId,\n          fileId: node.data.fileId,\n        });\n        setOpenPdf((current) => {\n          if (current) URL.revokeObjectURL(current.objectUrl);\n          return {\n            fileId: node.data.fileId,\n            name: downloaded.name || node.data.lastKnownName || "PDF",\n            objectUrl: URL.createObjectURL(downloaded.blob),\n          };\n        });\n      } catch (error: unknown) {\n        setShellState((current) => ({\n          ...current,\n          status: "error",\n          error: error instanceof Error ? error.message : "PDF failed to open.",\n        }));\n      }\n    },\n    [projectFileRepository, projectId, shellWorkspaceId],\n  );\n\n  const closePdfReader = useCallback(() => {\n    setOpenPdf((current) => {\n      if (current) URL.revokeObjectURL(current.objectUrl);\n      return null;\n    });\n  }, []);\n\n''' + marker
          text = replace_once(text, marker, insert, "shell pdf reader callbacks")
          text = replace_once(text, '''          onNodeDoubleClick={onNodeDoubleClick}''', '''          onNodeDoubleClick={(event, node) => {\n            if (node.type === CANVAS_PDF_NODE_TYPE) {\n              event.preventDefault();\n              void openPdfNode(node);\n              return;\n            }\n            onNodeDoubleClick?.(event, node);\n          }}''', "shell pdf double click")
          text = replace_once(text, '''          onAddImage={(files) => {''', '''          onAddPdf={(files) => void uploadPdfFiles(files)}\n          onAddImage={(files) => {''', "shell toolbar pdf prop")
          text = replace_once(text, '''      <div className={styles.canvasWrap}>''', '''      <div className={`${styles.canvasWorkspace}${openPdf ? ` ${styles.canvasWorkspaceSplit}` : ""}`}>\n      <div className={styles.canvasWrap}>''', "shell workspace split open")
          text = replace_once(text, '''      </div>\n      {filePickerOpen ? (''', '''      </div>\n      {openPdf ? (\n        <aside className={styles.pdfReader} aria-label="Просмотр PDF">\n          <header className={styles.pdfReaderHeader}>\n            <strong title={openPdf.name}>{openPdf.name}</strong>\n            <button type="button" onClick={closePdfReader} aria-label="Закрыть PDF" title="Закрыть PDF">×</button>\n          </header>\n          <iframe src={openPdf.objectUrl} title={openPdf.name} className={styles.pdfReaderFrame} />\n        </aside>\n      ) : null}\n      </div>\n      {filePickerOpen ? (''', "shell reader panel")
          text = replace_once(text, '''  useEffect(() => {\n    let active = true;''', '''  useEffect(() => () => {\n    setOpenPdf((current) => {\n      if (current) URL.revokeObjectURL(current.objectUrl);\n      return null;\n    });\n  }, []);\n\n  useEffect(() => {\n    let active = true;''', "shell pdf cleanup")
          write(path, text)

          path = "src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css"
          text = read(path)
          text += '''\n.canvasWorkspace {\n  min-width: 0;\n  min-height: 0;\n  flex: 1 1 auto;\n  display: grid;\n  grid-template-columns: minmax(0, 1fr);\n  overflow: hidden;\n}\n.canvasWorkspaceSplit {\n  grid-template-columns: minmax(0, 1fr) minmax(360px, 50%);\n}\n.pdfReader {\n  min-width: 0;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n  overflow: hidden;\n  border-left: 1px solid var(--border, #deddd8);\n  background: var(--surface, #fbfbfa);\n}\n.pdfReaderHeader {\n  min-width: 0;\n  height: 38px;\n  flex: 0 0 38px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 8px;\n  border-bottom: 1px solid var(--border, #deddd8);\n  padding: 0 8px 0 12px;\n}\n.pdfReaderHeader strong {\n  min-width: 0;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  font-size: 12px;\n  font-weight: 600;\n}\n.pdfReaderHeader button {\n  width: 30px;\n  height: 30px;\n  border: 0;\n  border-radius: var(--radius-md, 6px);\n  background: transparent;\n  color: var(--text-2, #52524c);\n  font-size: 22px;\n  line-height: 1;\n  cursor: pointer;\n}\n.pdfReaderHeader button:hover,\n.pdfReaderHeader button:focus-visible {\n  outline: none;\n  background: var(--surface-2, #f1f1ef);\n}\n.pdfReaderFrame {\n  min-width: 0;\n  min-height: 0;\n  flex: 1 1 auto;\n  width: 100%;\n  border: 0;\n  background: #fff;\n}\n.pdfNodeFrame .nodeBody {\n  border: 1px solid var(--border, #deddd8);\n  border-radius: var(--radius-lg, 8px);\n  background: var(--surface, #fbfbfa);\n  box-shadow: var(--shadow-sm, 0 1px 2px rgb(32 32 29 / 8%));\n}\n.pdfNodeContent {\n  box-sizing: border-box;\n  width: 100%;\n  height: 100%;\n  display: grid;\n  place-items: center;\n  gap: 8px;\n  padding: 18px;\n  text-align: center;\n  color: var(--text-2, #52524c);\n}\n.pdfNodeBadge {\n  display: grid;\n  place-items: center;\n  width: 52px;\n  height: 64px;\n  border: 1px solid var(--border, #deddd8);\n  border-radius: 6px;\n  background: var(--surface-2, #f1f1ef);\n  font-size: 12px;\n  font-weight: 700;\n  letter-spacing: 0.08em;\n}\n.pdfNodeName {\n  max-width: 100%;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  font-size: 12px;\n}\n@media (max-width: 900px) {\n  .canvasWorkspaceSplit {\n    grid-template-columns: minmax(0, 1fr);\n  }\n  .pdfReader {\n    position: absolute;\n    inset: 38px 0 0;\n    z-index: 30;\n    border-left: 0;\n  }\n}\n'''
          write(path, text)

          # Migration: accept canonical pdf node and validate same-project PDF Project File.
          path = "supabase/migrations/20260826160000_canvas_pdf_nodes.sql"
          Path(path).write_text(r'''-- Canvas PDF nodes: first-class Project File references for application/pdf.\n\ncreate or replace function public.validate_canvas_document_v2(\n  target_schema_version smallint,\n  target_document jsonb\n)\nreturns void\nlanguage plpgsql\nimmutable\nset search_path = pg_catalog, public, private\nas $$\ndeclare\n  normalized_document jsonb := target_document;\n  node_item jsonb;\nbegin\n  if jsonb_typeof(target_document) = 'object'\n     and jsonb_typeof(target_document -> 'nodes') = 'array' then\n    if exists (\n      select 1 from jsonb_array_elements(target_document -> 'nodes') as item\n      where item ->> 'kind' = 'image' and (item ? 'assetId') = (item ? 'fileId')\n    ) then\n      raise exception using errcode = '22023', message = 'Canvas image must reference exactly one assetId or fileId';\n    end if;\n\n    for node_item in\n      select value from jsonb_array_elements(target_document -> 'nodes')\n      where value ->> 'kind' = 'pdf'\n    loop\n      if not private.canvas_object_has_exact_keys(\n        node_item,\n        array['id','kind','position','size','zIndex','fileId'],\n        array['lastKnownName']\n      ) then\n        raise exception using errcode = '22023', message = 'invalid Canvas PDF node';\n      end if;\n      if jsonb_typeof(node_item -> 'fileId') is distinct from 'string'\n         or private.canvas_utf16_length(node_item ->> 'fileId') = 0\n         or private.canvas_utf16_length(node_item ->> 'fileId') > 256 then\n        raise exception using errcode = '22023', message = 'invalid Canvas PDF fileId';\n      end if;\n      if node_item ? 'lastKnownName' and (\n        jsonb_typeof(node_item -> 'lastKnownName') is distinct from 'string'\n        or private.canvas_utf16_length(node_item ->> 'lastKnownName') > 255\n      ) then\n        raise exception using errcode = '22023', message = 'invalid Canvas PDF name';\n      end if;\n    end loop;\n\n    select jsonb_set(\n      target_document,\n      '{nodes}',\n      coalesce(jsonb_agg(\n        case\n          when item.value ->> 'kind' = 'image' and item.value ? 'fileId'\n            then (item.value - 'fileId') || jsonb_build_object('assetId', item.value -> 'fileId')\n          when item.value ->> 'kind' = 'shape'\n            then (item.value - 'shape') || jsonb_build_object('kind', 'text') || jsonb_build_object(\n              'style', ((item.value -> 'style') - 'fillColor') || jsonb_build_object('backgroundColor', item.value -> 'style' -> 'fillColor')\n            )\n          when item.value ->> 'kind' = 'pdf'\n            then jsonb_build_object(\n              'id', item.value -> 'id',\n              'kind', 'text',\n              'position', item.value -> 'position',\n              'size', item.value -> 'size',\n              'zIndex', item.value -> 'zIndex',\n              'markdown', '',\n              'style', jsonb_build_object(\n                'fontFamily','sans','fontSize',16,'bold',false,'italic',false,'underline',false,'strikethrough',false,\n                'color','#000000','backgroundColor','transparent','textAlign','center'\n              )\n            )\n          else item.value\n        end order by item.ordinality\n      ), '[]'::jsonb)\n    ) into normalized_document\n    from jsonb_array_elements(target_document -> 'nodes') with ordinality as item(value, ordinality);\n  end if;\n\n  perform private.validate_canvas_document_v2_legacy_b3(target_schema_version, normalized_document);\nend;\n$$;\n\ncreate or replace function private.assert_canvas_project_file_references(\n  target_workspace_id uuid,\n  target_project_id text,\n  target_document jsonb\n)\nreturns void\nlanguage plpgsql\nstable\nset search_path = pg_catalog, public\nas $$\ndeclare\n  node_item jsonb;\n  target_file_id text;\n  target_kind text;\nbegin\n  for node_item in\n    select value from jsonb_array_elements(target_document -> 'nodes')\n    where (value ->> 'kind' = 'image' and value ? 'fileId')\n       or value ->> 'k