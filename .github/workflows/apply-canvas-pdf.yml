          Path("supabase/migrations/20260826193000_canvas_pdf_project_file_nodes.sql").write_text(r'''-- Canvas PDFs are shared Project Files referenced by fileId. The PDF bytes stay\n-- in project-files storage; Canvas persists only presentation metadata and identity.\n\ncreate or replace function public.validate_canvas_document_v2(\n  target_schema_version smallint,\n  target_document jsonb\n)\nreturns void\nlanguage plpgsql\nimmutable\nset search_path = pg_catalog, public, private\nas $$\ndeclare\n  normalized_document jsonb := target_document;\n  node_item jsonb;\nbegin\n  if jsonb_typeof(target_document) = 'object'\n     and jsonb_typeof(target_document -> 'nodes') = 'array' then\n    if exists (\n      select 1\n      from jsonb_array_elements(target_document -> 'nodes') as item\n      where item ->> 'kind' = 'image'\n        and (item ? 'assetId') = (item ? 'fileId')\n    ) then\n      raise exception using\n        errcode = '22023',\n        message = 'Canvas image must reference exactly one assetId or fileId';\n    end if;\n\n    for node_item in\n      select value\n      from jsonb_array_elements(target_document -> 'nodes')\n      where value ->> 'kind' = 'shape'\n    loop\n      if not private.canvas_object_has_exact_keys(\n        node_item,\n        array[\n          'id', 'kind', 'position', 'size', 'zIndex', 'shape', 'markdown', 'style'\n        ]\n      ) then\n        raise exception using errcode = '22023', message = 'invalid Canvas shape node';\n      end if;\n\n      if jsonb_typeof(node_item -> 'shape') is distinct from 'string'\n         or node_item ->> 'shape' not in ('rectangle', 'circle') then\n        raise exception using errcode = '22023', message = 'invalid Canvas shape variant';\n      end if;\n\n      if jsonb_typeof(node_item -> 'markdown') is distinct from 'string'\n         or private.canvas_utf16_length(node_item ->> 'markdown') > 250000 then\n        raise exception using errcode = '22023', message = 'invalid Canvas shape markdown';\n      end if;\n\n      perform private.assert_canvas_shape_style(node_item -> 'style');\n    end loop;\n\n    for node_item in\n      select value\n      from jsonb_array_elements(target_document -> 'nodes')\n      where value ->> 'kind' = 'pdf'\n    loop\n      if not private.canvas_object_has_exact_keys(\n        node_item,\n        array['id', 'kind', 'position', 'size', 'zIndex', 'fileId'],\n        array['lastKnownName']\n      ) then\n        raise exception using errcode = '22023', message = 'invalid Canvas PDF node';\n      end if;\n      if node_item ? 'lastKnownName'\n         and (\n           jsonb_typeof(node_item -> 'lastKnownName') is distinct from 'string'\n           or private.canvas_utf16_length(node_item ->> 'lastKnownName') > 255\n         ) then\n        raise exception using errcode = '22023', message = 'invalid Canvas PDF file name';\n      end if;\n    end loop;\n\n    select jsonb_set(\n      target_document,\n      '{nodes}',\n      coalesce(\n        jsonb_agg(\n          case\n            when item.value ->> 'kind' = 'image' and item.value ? 'fileId'\n              then (item.value - 'fileId')\n                || jsonb_build_object('assetId', item.value -> 'fileId')\n            when item.value ->> 'kind' = 'shape'\n              then (item.value - 'shape')\n                || jsonb_build_object('kind', 'text')\n                || jsonb_build_object(\n                  'style',\n                  ((item.value -> 'style') - 'fillColor')\n                    || jsonb_build_object(\n                      'backgroundColor',\n                      item.value -> 'style' -> 'fillColor'\n                    )\n                )\n            when item.value ->> 'kind' = 'pdf'\n              then (item.value - 'fileId' - 'lastKnownName')\n                || jsonb_build_object(\n                  'kind', 'image',\n                  'assetId', item.value -> 'fileId',\n                  'aspectRatioLocked', true\n                )\n            else item.value\n          end\n          order by item.ordinality\n        ),\n        '[]'::jsonb\n      )\n    )\n    into normalized_document\n    from jsonb_array_elements(target_document -> 'nodes')\n      with ordinality as item(value, ordinality);\n  end if;\n\n  perform private.validate_canvas_document_v2_legacy_b3(\n    target_schema_version,\n    normalized_document\n  );\nend;\n$$;\n\ncreate or replace function private.assert_canvas_project_file_references(\n  target_workspace_id uuid,\n  target_project_id text,\n  target_document jsonb\n)\nreturns void\nlanguage plpgsql\nstable\nset search_path = pg_catalog, public\nas $$\ndeclare\n  node_item jsonb;\n  target_file_id text;\nbegin\n  for node_item in\n    select value\n    from jsonb_array_elements(target_document -> 'nodes')\n    where value ->> 'kind' = 'image'\n      and value ? 'fileId'\n  loop\n    target_file_id := node_item ->> 'fileId';\n    if target_project_id is null\n       or not exists (\n         select 1\n         from public.project_files as file_row\n         where file_row.workspace_id = target_workspace_id\n           and file_row.project_id = target_project_id\n           and file_row.id::text = target_file_id\n           and file_row.ready_at is not null\n           and file_row.deleted_at is null\n           and file_row.mime_type like 'image/%'\n           and file_row.width is not null\n           and file_row.height is not null\n       ) then\n      raise exception using\n        errcode = '22023',\n        message = 'Canvas Project File reference is unavailable';\n    end if;\n  end loop;\n\n  for node_item in\n    select value\n    from jsonb_array_elements(target_document -> 'nodes')\n    where value ->> 'kind' = 'pdf'\n      and value ? 'fileId'\n  loop\n    target_file_id := node_item ->> 'fileId';\n    if target_project_id is null\n       or not exists (\n         select 1\n         from public.project_files as file_row\n         where file_row.workspace_id = target_workspace_id\n           and file_row.project_id = target_project_id\n           and file_row.id::text = target_file_id\n           and file_row.ready_at is not null\n           and file_row.deleted_at is null\n           and file_row.mime_type = 'application/pdf'\n       ) then\n      raise exception using\n        errcode = '22023',\n        message = 'Canvas PDF Project File reference is unavailable';\n    end if;\n  end loop;\nend;\n$$;\n\nrevoke all on function public.validate_canvas_document_v2(smallint, jsonb)\n  from public, anon, authenticated;\nrevoke all on function private.assert_canvas_project_file_references(uuid, text, jsonb)\n  from public, anon, authenticated;\n\ncomment on function public.validate_canvas_document_v2(smallint, jsonb) is\n  'Validates CanvasDocumentV2 including shapes, shared image references and PDF Project File nodes.';\ncomment on function private.assert_canvas_project_file_references(uuid, text, jsonb) is\n  'Canvas shared-file invariant: image and PDF fileId references must be ready, active and belong to the same workspace and Project.';\n'''.replace('\\n', '\n'))

          # Unit coverage for canonical + runtime PDF behavior.
          Path("tests/canvas-pdf-node.test.ts").write_text(r'''import { describe, expect, it } from "vitest";\n\nimport {\n  parseCanvasDocumentV1,\n  parseCanvasDocumentV2,\n} from "@/lib/canvas/canvas-document";\nimport {\n  CANVAS_PDF_NODE_TYPE,\n  canvasDocumentToPdfNodes,\n  runtimeNodesToCanvasDocument,\n} from "@/lib/canvas/react-flow-canvas-adapter";\n\nconst pdfNode = {\n  id: "pdf-node-1",\n  kind: "pdf" as const,\n  fileId: "63000000-0000-0000-0000-000000000010",\n  lastKnownName: "reference.pdf",\n  position: { x: 40, y: 60 },\n  size: { width: 300, height: 180 },\n  zIndex: 4,\n};\n\ndescribe("Canvas PDF nodes", () => {\n  it("accepts PDFs in V2 while keeping V1 strict", () => {\n    const v2 = parseCanvasDocumentV2({\n      schemaVersion: 2,\n      nodes: [pdfNode],\n      edges: [],\n    });\n    expect(v2.nodes[0]).toEqual(pdfNode);\n    expect(() =>\n      parseCanvasDocumentV1({ schemaVersion: 1, nodes: [pdfNode], edges: [] }),\n    ).toThrow(/requires CanvasDocumentV2/);\n  });\n\n  it("projects and serializes PDF geometry without embedding binary data", () => {\n    const document = parseCanvasDocumentV2({\n      schemaVersion: 2,\n      nodes: [pdfNode],\n      edges: [],\n    });\n    const [runtime] = canvasDocumentToPdfNodes(document);\n    expect(runtime?.type).toBe(CANVAS_PDF_NODE_TYPE);\n    expect(runtime?.data).toEqual({\n      fileId: pdfNode.fileId,\n      lastKnownName: pdfNode.lastKnownName,\n    });\n    if (!runtime) throw new Error("PDF runtime node missing");\n    const moved = {\n      ...runtime,\n      position: { x: 180, y: 220 },\n      width: 420,\n      height: 260,\n      style: { width: 420, height: 260 },\n    };\n    const saved = runtimeNodesToCanvasDocument(document, [moved]);\n    expect(saved.nodes[0]).toMatchObject({\n      kind: "pdf",\n      fileId: pdfNode.fileId,\n      lastKnownName: pdfNode.lastKnownName,\n      position: { x: 180, y: 220 },\n      size: { width: 420, height: 260 },\n    });\n    expect(JSON.stringify(saved)).not.toContain("blob:");\n  });\n});\n'''.replace('\\n', '\n'))

