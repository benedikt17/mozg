name: Apply Canvas PDF feature

on:
  push:
    branches:
      - feature/canvas-pdf-split-view

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canvas-pdf-split-view
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply feature patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          def replace_count(text, old, new, expected, label):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} matches, got {count}")
              return text.replace(old, new)

          # Canvas document: introduce a V2-only PDF Project File node.
          path = "src/lib/canvas/canvas-document.ts"
          text = read(path)
          text = replace_once(
              text,
              '  maxTitleLength: 200,\n  maxIdLength: 256,',
              '  maxTitleLength: 200,\n  maxFileNameLength: 255,\n  maxIdLength: 256,',
              "canvas limits",
          )
          text = replace_once(
              text,
              '''export type CanvasImageNode =\n  CanvasLegacyImageNode | CanvasProjectFileImageNode;\n\nexport type CanvasNode =\n  | CanvasTaskNode\n  | CanvasArticleNode\n  | CanvasTextNode\n  | CanvasShapeNode\n  | CanvasImageNode;''',
              '''export type CanvasImageNode =\n  CanvasLegacyImageNode | CanvasProjectFileImageNode;\n\nexport type CanvasPdfNode = CanvasNodeBase & {\n  kind: "pdf";\n  fileId: string;\n  lastKnownName?: string;\n};\n\nexport type CanvasNode =\n  | CanvasTaskNode\n  | CanvasArticleNode\n  | CanvasTextNode\n  | CanvasShapeNode\n  | CanvasImageNode\n  | CanvasPdfNode;''',
              "pdf canonical type",
          )
          text = replace_once(
              text,
              '''function requireBoolean(value: unknown, path: string): boolean {''',
              '''function requireLastKnownFileName(value: unknown, path: string): string {\n  const name = requireString(value, path);\n  if (name.length > CANVAS_DOCUMENT_LIMITS.maxFileNameLength) {\n    fail(\n      "file_name_too_long",\n      path,\n      "lastKnownName exceeds the Canvas file name limit",\n    );\n  }\n  return name;\n}\n\nfunction requireBoolean(value: unknown, path: string): boolean {''',
              "pdf name validator",
          )
          text = replace_once(
              text,
              '''function parseNode(\n  value: unknown,\n  path: string,\n  allowShape = false,\n): CanvasNode {\n  const node = requireRecord(value, path);\n  const kind = requireString(node.kind, `${path}.kind`) as CanvasNode["kind"];\n  if (kind === "shape" && !allowShape) {\n    fail(\n      "unsupported_node_kind",\n      `${path}.kind`,\n      "Canvas shape nodes require CanvasDocumentV2",\n    );\n  }''',
              '''function parseNode(\n  value: unknown,\n  path: string,\n  allowV2Extensions = false,\n): CanvasNode {\n  const node = requireRecord(value, path);\n  const kind = requireString(node.kind, `${path}.kind`) as CanvasNode["kind"];\n  if ((kind === "shape" || kind === "pdf") && !allowV2Extensions) {\n    fail(\n      "unsupported_node_kind",\n      `${path}.kind`,\n      "This Canvas node kind requires CanvasDocumentV2",\n    );\n  }''',
              "v2-only pdf parser gate",
          )
          text = replace_once(
              text,
              '''  const allowedKeys =\n    kind === "task" || kind === "article"\n      ? optionalKeys\n      : kind === "text"\n        ? ["style"]\n        : [];''',
              '''  const allowedKeys =\n    kind === "task" || kind === "article"\n      ? optionalKeys\n      : kind === "text"\n        ? ["style"]\n        : kind === "pdf"\n          ? ["lastKnownName"]\n          : [];''',
              "pdf optional keys",
          )
          text = replace_once(
              text,
              '''          : kind === "shape"\n            ? "shape"\n            : kind === "image"\n              ? hasImageFileId\n                ? "fileId"\n                : "assetId"\n              : null;''',
              '''          : kind === "shape"\n            ? "shape"\n            : kind === "image"\n              ? hasImageFileId\n                ? "fileId"\n                : "assetId"\n              : kind === "pdf"\n                ? "fileId"\n                : null;''',
              "pdf specific key",
          )
          text = replace_once(
              text,
              '''  const aspectRatioLocked = node.aspectRatioLocked;''',
              '''  if (kind === "pdf") {\n    const result: CanvasPdfNode = {\n      id,\n      kind,\n      position,\n      size,\n      zIndex,\n      fileId: requireIdentifier(node.fileId, `${path}.fileId`),\n    };\n    if (Object.prototype.hasOwnProperty.call(node, "lastKnownName")) {\n      result.lastKnownName = requireLastKnownFileName(\n        node.lastKnownName,\n        `${path}.lastKnownName`,\n      );\n    }\n    return result;\n  }\n\n  const aspectRatioLocked = node.aspectRatioLocked;''',
              "pdf parse branch",
          )
          write(path, text)

          # React Flow adapter: runtime PDF node and round-trip support.
          path = "src/lib/canvas/react-flow-canvas-adapter.ts"
          text = read(path)
          text = replace_once(
              text,
              '  type CanvasPoint,\n  type CanvasSize,',
              '  type CanvasPoint,\n  type CanvasPdfNode,\n  type CanvasSize,',
              "adapter pdf import",
          )
          text = replace_once(
              text,
              'export const CANVAS_IMAGE_NODE_TYPE = "canvasImage";\nexport const CANVAS_TEXT_NODE_TYPE = "canvasText";',
              'export const CANVAS_IMAGE_NODE_TYPE = "canvasImage";\nexport const CANVAS_PDF_NODE_TYPE = "canvasPdf";\nexport const CANVAS_TEXT_NODE_TYPE = "canvasText";',
              "adapter pdf type constant",
          )
          text = replace_once(
              text,
              '''export type CanvasTextNodeData = {''',
              '''export type CanvasPdfNodeData = {\n  fileId: string;\n  lastKnownName?: string;\n};\n\nexport type CanvasPdfFlowNode = Node<\n  CanvasPdfNodeData,\n  typeof CANVAS_PDF_NODE_TYPE\n>;\n\nexport type CanvasTextNodeData = {''',
              "adapter pdf data",
          )
          text = replace_once(
              text,
              '''export type CanvasFlowNode =\n  | CanvasImageFlowNode\n  | CanvasTextFlowNode''',
              '''export type CanvasFlowNode =\n  | CanvasImageFlowNode\n  | CanvasPdfFlowNode\n  | CanvasTextFlowNode''',
              "adapter flow union",
          )
          marker = '''export function createCanvasTaskId(\n  idGenerator: () => string = () =>\n    globalThis.crypto?.randomUUID?.() ??\n    `${Date.now()}-${Math.random().toString(36).slice(2)}`,\n): string {'''
          insert = '''export function createCanvasPdfId(\n  idGenerator: () => string = () =>\n    globalThis.crypto?.randomUUID?.() ??\n    `${Date.now()}-${Math.random().toString(36).slice(2)}`,\n): string {\n  return `pdf-node-${idGenerator()}`;\n}\n\nexport function createCanvasPdfFlowNode(input: {\n  id: string;\n  fileId: string;\n  lastKnownName?: string;\n  position: FlowPosition;\n  size?: CanvasSize;\n  zIndex?: number;\n}): CanvasPdfFlowNode {\n  const size = input.size ?? { width: 300, height: 180 };\n  return {\n    id: input.id,\n    type: CANVAS_PDF_NODE_TYPE,\n    position: { ...input.position },\n    width: size.width,\n    height: size.height,\n    style: { width: size.width, height: size.height },\n    zIndex: input.zIndex,\n    data: {\n      fileId: input.fileId,\n      ...(input.lastKnownName === undefined\n        ? {}\n        : { lastKnownName: input.lastKnownName }),\n    },\n  };\n}\n\n''' + marker
          text = replace_once(text, marker, insert, "adapter pdf factory")
          marker = '''export function canvasDocumentToTaskNodes(\n  document: CanvasDocument,'''
          insert = '''export function canvasDocumentToPdfNodes(\n  document: CanvasDocument,\n): CanvasPdfFlowNode[] {\n  return document.nodes\n    .filter((node): node is CanvasPdfNode => node.kind === "pdf")\n    .map((node) =>\n      createCanvasPdfFlowNode({\n        id: node.id,\n        fileId: node.fileId,\n        lastKnownName: node.lastKnownName,\n        position: node.position,\n        size: node.size,\n        zIndex: node.zIndex,\n      }),\n    );\n}\n\n''' + marker
          text = replace_once(text, marker, insert, "adapter pdf projection")
          text = replace_once(
              text,
              '''    if (node.kind === "text" && runtime.type === CANVAS_TEXT_NODE_TYPE) {''',
              '''    if (node.kind === "pdf" && runtime.type === CANVAS_PDF_NODE_TYPE) {\n      return {\n        ...node,\n        position: { ...runtime.position },\n        size: runtimeNodeSize(runtime),\n      };\n    }\n    if (node.kind === "text" && runtime.type === CANVAS_TEXT_NODE_TYPE) {''',
              "adapter pdf runtime serialization",
          )
          write(path, text)

          # Clipboard: PDFs are first-class copy/paste nodes.
          path = "src/lib/canvas/canvas-node-clipboard.ts"
          text = read(path)
          text = replace_once(
              text,
              '''    node.kind === "image" ||\n    node.kind === "text" ||''',
              '''    node.kind === "image" ||\n    node.kind === "pdf" ||\n    node.kind === "text" ||''',
              "clipboard pdf",
          )
          write(path, text)

          # Files picker: show both images and PDFs.
          path = "src/prototype/canvases/canvas-project-file-picker.tsx"
          text = read(path)
          text = replace_once(
              text,
              '                      : "В этом проекте нет изображений"}',
              '                      : "В этом проекте нет изображений и PDF"}',
              "file picker empty copy",
          )
          text = replace_once(
              text,
              '''                      <span>\n                        {file.width}×{file.height} · {file.mimeType}\n                      </span>''',
              '''                      <span>\n                        {file.mimeType === "application/pdf"\n                          ? `PDF · ${Math.max(1, Math.round(file.byteSize / 1024))} КБ`\n                          : `${file.width}×${file.height} · ${file.mimeType}`}\n                      </span>''',
              "file picker pdf metadata",
          )
          write(path, text)

          # Desktop toolbar: explicit PDF upload action.
          path = "src/prototype/canvases/canvas-desktop-composition.tsx"
          text = read(path)
          text = replace_once(
              text,
              '''  onAddImage,\n  onAddText,''',
              '''  onAddImage,\n  onAddPdf,\n  onAddText,''',
              "toolbar pdf destructure",
          )
          text = replace_once(
              text,
              '''  onAddImage: (files: File[]) => void;\n  onAddText: () => void;''',
              '''  onAddImage: (files: File[]) => void;\n  onAddPdf: (files: File[]) => void;\n  onAddText: () => void;''',
              "toolbar pdf prop",
          )
          text = replace_once(
              text,
              '''  const fileInputRef = useRef<HTMLInputElement>(null);\n  const taskPickerTriggerRef''',
              '''  const fileInputRef = useRef<HTMLInputElement>(null);\n  const pdfInputRef = useRef<HTMLInputElement>(null);\n  const taskPickerTriggerRef''',
              "toolbar pdf input ref",
          )
          marker = '''        <CanvasProjectFilePicker\n          interactive={isReady}'''
          insert = '''        <IconButton\n          disabled={!isReady || !fileToolsReady}\n          icon={<UiIcon name="file" />}\n          label="Добавить PDF"\n          onClick={() => pdfInputRef.current?.click()}\n          title="Добавить PDF"\n          type="button"\n          variant="quiet"\n        />\n        <input\n          accept="application/pdf,.pdf"\n          hidden\n          multiple\n          onChange={(event) => {\n            const files = Array.from(event.target.files ?? []);\n            event.target.value = "";\n            if (files.length > 0) onAddPdf(files);\n          }}\n          ref={pdfInputRef}\n          type="file"\n        />\n''' + marker
          text = replace_once(text, marker, insert, "toolbar pdf button")
          write(path, text)

          # Canvas shell: PDF card, upload-to-Files, Files insertion and split reader.
          path = "src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx"
          text = read(path)
          text = replace_once(
              text,
              '''  CANVAS_IMAGE_NODE_TYPE,\n  CANVAS_SHAPE_NODE_TYPE,''',
              '''  CANVAS_IMAGE_NODE_TYPE,\n  CANVAS_PDF_NODE_TYPE,\n  CANVAS_SHAPE_NODE_TYPE,''',
              "shell pdf constant import",
          )
          text = replace_once(
              text,
              '''  canvasDocumentToImageNodes,\n  canvasDocumentToShapeNodes,''',
              '''  canvasDocumentToImageNodes,\n  canvasDocumentToPdfNodes,\n  canvasDocumentToShapeNodes,''',
              "shell pdf projection import",
          )
          text = replace_once(
              text,
              '''  createCanvasTaskFlowNode,\n  createCanvasTaskId,''',
              '''  createCanvasPdfFlowNode,\n  createCanvasPdfId,\n  createCanvasTaskFlowNode,\n  createCanvasTaskId,''',
              "shell pdf factory import",
          )
          text = replace_once(
              text,
              '''  type CanvasImageFlowNode,\n  type CanvasShapeFlowNode,''',
              '''  type CanvasImageFlowNode,\n  type CanvasPdfFlowNode,\n  type CanvasShapeFlowNode,''',
              "shell pdf flow import",
          )
          text = replace_once(
              text,
              '''  type CanvasHandleSide,\n  type CanvasShapeNode,''',
              '''  type CanvasHandleSide,\n  type CanvasPdfNode,\n  type CanvasShapeNode,''',
              "shell pdf canonical import",
          )
          text = replace_once(
              text,
              '''import type { ProjectFileImageVariantRepository } from "@/lib/files/project-file-image-variants";\nimport {\n  isProjectFileImageMimeType,''',
              '''import type { ProjectFileImageVariantRepository } from "@/lib/files/project-file-image-variants";\nimport {\n  prepareProjectFileBrowserUpload,\n  resolveProjectFileBrowserMimeType,\n} from "@/lib/files/project-file-browser-upload";\nimport {\n  isProjectFileImageMimeType,''',
              "shell browser upload import",
          )
          marker = '''const CANVAS_TEXT_FONT_LABELS: Record<CanvasTextFontFamily, string> = {'''
          insert = '''function PdfNodeBody({\n  data,\n  selected,\n}: NodeProps<CanvasPdfFlowNode>): React.JSX.Element {\n  return (\n    <CanvasNodeFrame\n      selected={selected}\n      minWidth={180}\n      minHeight={110}\n      className={styles.pdfNodeFrame}\n      connectionHandleLayer={<ConnectionHandleLayer selected={selected} />}\n    >\n      <div\n        className={styles.pdfNodeContent}\n        data-canvas-pdf-file-id={data.fileId}\n        title="Двойной клик — открыть PDF"\n      >\n        <span className={styles.pdfNodeBadge}>PDF</span>\n        <strong title={data.lastKnownName ?? "PDF"}>\n          {data.lastKnownName ?? "PDF"}\n        </strong>\n        <span>Двойной клик — открыть</span>\n      </div>\n    </CanvasNodeFrame>\n  );\n}\n\n''' + marker
          text = replace_once(text, marker, insert, "shell pdf body")
          text = replace_once(
              text,
              '''const nodeTypes = {\n  [CANVAS_IMAGE_NODE_TYPE]: ImageNodeBody,''',
              '''const nodeTypes = {\n  [CANVAS_IMAGE_NODE_TYPE]: ImageNodeBody,\n  [CANVAS_PDF_NODE_TYPE]: PdfNodeBody,''',
              "shell pdf node type",
          )
          text = replace_once(
              text,
              '''type CanvasLoadingLifecycle =\n  | "list-loading"''',
              '''type CanvasPdfViewerState = {\n  fileId: string;\n  name: string;\n  status: "loading" | "ready" | "error";\n  objectUrl: string | null;\n  error: string | null;\n};\n\ntype CanvasLoadingLifecycle =\n  | "list-loading"''',
              "shell viewer state type",
          )
          text = replace_once(
              text,
              '''  const variantDowngradeTimerRef = useRef<number | null>(null);\n  const imageLoadCacheRef''',
              '''  const variantDowngradeTimerRef = useRef<number | null>(null);\n  const pdfOpenSequenceRef = useRef(0);\n  const pdfObjectUrlRef = useRef<string | null>(null);\n  const imageLoadCacheRef''',
              "shell viewer refs",
          )
          text = replace_once(
              text,
              '''  const [fileCatalog, setFileCatalog] = useState<ProjectFileRecord[]>([]);\n  const [fileSearchStatus,''',
              '''  const [fileCatalog, setFileCatalog] = useState<ProjectFileRecord[]>([]);\n  const [pdfViewer, setPdfViewer] = useState<CanvasPdfViewerState | null>(null);\n  const [fileSearchStatus,''',
              "shell viewer state",
          )
          marker = '''  useEffect(() => {\n    const activeTaskId = activeTaskDetailsTaskId;'''
          insert = '''  const closePdfViewer = useCallback((): void => {\n    pdfOpenSequenceRef.current += 1;\n    if (pdfObjectUrlRef.current) {\n      URL.revokeObjectURL(pdfObjectUrlRef.current);\n      pdfObjectUrlRef.current = null;\n    }\n    setPdfViewer(null);\n  }, []);\n\n  const openPdfNode = useCallback(\n    async (node: CanvasPdfFlowNode): Promise<void> => {\n      if (!projectFileRepository || !projectId) return;\n      const sequence = ++pdfOpenSequenceRef.current;\n      if (pdfObjectUrlRef.current) {\n        URL.revokeObjectURL(pdfObjectUrlRef.current);\n        pdfObjectUrlRef.current = null;\n      }\n      setPdfViewer({\n        fileId: node.data.fileId,\n        name: node.data.lastKnownName ?? "PDF",\n        status: "loading",\n        objectUrl: null,\n        error: null,\n      });\n      try {\n        const downloaded = await projectFileRepository.downloadFile({\n          workspaceId: shellWorkspaceId,\n          projectId,\n          fileId: node.data.fileId,\n        });\n        if (downloaded.mimeType !== "application/pdf") {\n          throw new Error("Выбранный файл больше не является PDF.");\n        }\n        const objectUrl = URL.createObjectURL(downloaded.blob);\n        if (sequence !== pdfOpenSequenceRef.current) {\n          URL.revokeObjectURL(objectUrl);\n          return;\n        }\n        pdfObjectUrlRef.current = objectUrl;\n        setPdfViewer({\n          fileId: downloaded.id,\n          name: downloaded.name,\n          status: "ready",\n          objectUrl,\n          error: null,\n        });\n      } catch (error: unknown) {\n        if (sequence !== pdfOpenSequenceRef.current) return;\n        setPdfViewer({\n          fileId: node.data.fileId,\n          name: node.data.lastKnownName ?? "PDF",\n          status: "error",\n          objectUrl: null,\n          error:\n            error instanceof Error ? error.message : "Не удалось открыть PDF.",\n        });\n      }\n    },\n    [projectFileRepository, projectId, shellWorkspaceId],\n  );\n\n  useEffect(() => {\n    return () => {\n      pdfOpenSequenceRef.current += 1;\n      if (pdfObjectUrlRef.current) URL.revokeObjectURL(pdfObjectUrlRef.current);\n      pdfObjectUrlRef.current = null;\n    };\n  }, []);\n\n  useEffect(() => {\n    closePdfViewer();\n  }, [closePdfViewer, shellState.canvasId]);\n\n''' + marker
          text = replace_once(text, marker, insert, "shell viewer lifecycle")
          text = replace_once(
              text,
              '''                file.readyAt !== null &&\n                file.deletedAt === null &&\n                file.width !== null &&\n                file.height !== null &&\n                isProjectFileImageMimeType(file.mimeType),''',
              '''                file.readyAt !== null &&\n                file.deletedAt === null &&\n                (file.mimeType === "application/pdf" ||\n                  (file.width !== null &&\n                    file.height !== null &&\n                    isProjectFileImageMimeType(file.mimeType))),''',
              "shell file catalog pdf filter",
          )
          text = replace_count(
              text,
              '''        ...canvasDocumentToTextNodes(nextState.document),\n        ...canvasDocumentToShapeNodes(nextState.document),''',
              '''        ...canvasDocumentToTextNodes(nextState.document),\n        ...canvasDocumentToShapeNodes(nextState.document),\n        ...canvasDocumentToPdfNodes(nextState.document),''',
              1,
              "restore pdf placeholders",
          )
          text = replace_count(
              text,
              '''        ...canvasDocumentToTextNodes(cachedState.document),\n        ...canvasDocumentToShapeNodes(cachedState.document),''',
              '''        ...canvasDocumentToTextNodes(cachedState.document),\n        ...canvasDocumentToShapeNodes(cachedState.document),\n        ...canvasDocumentToPdfNodes(cachedState.document),''',
              1,
              "cache pdf skeleton",
          )
          text = replace_once(
              text,
              '''          } else if (node.kind === "task") {\n            runtimeNodes.push(''',
              '''          } else if (node.kind === "pdf") {\n            runtimeNodes.push(\n              createCanvasPdfFlowNode({\n                id: node.id,\n                fileId: node.fileId,\n                lastKnownName: node.lastKnownName,\n                position: node.position,\n                size: node.size,\n                zIndex: node.zIndex,\n              }),\n            );\n          } else if (node.kind === "task") {\n            runtimeNodes.push(''',
              "paste pdf runtime",
          )
          start = text.index('  const createProjectFileNode = useCallback(')
          end = text.index('\n\n  useEffect(() => {\n    const onCopy', start)
          old_block = text[start:end]
          new_block = '''  const createProjectFileNode = useCallback(\n    async (file: ProjectFileRecord, requestedPosition?: FlowPosition) => {\n      const canvasId = shellStateRef.current.canvasId;\n      if (!canvasId) return;\n      try {\n        const zIndex =\n          Math.max(\n            0,\n            ...controller.state.document.nodes.map((node) => node.zIndex),\n          ) + 1;\n        const position = requestedPosition ?? centerPosition();\n\n        if (file.mimeType === "application/pdf") {\n          const canonical: CanvasPdfNode = {\n            id: createCanvasPdfId(),\n            kind: "pdf",\n            fileId: file.id,\n            lastKnownName: file.name,\n            position,\n            size: { width: 300, height: 180 },\n            zIndex,\n          };\n          const runtime = createCanvasPdfFlowNode({\n            id: canonical.id,\n            fileId: canonical.fileId,\n            lastKnownName: canonical.lastKnownName,\n            position: canonical.position,\n            size: canonical.size,\n            zIndex: canonical.zIndex,\n          });\n          setNodes((current) => [\n            ...current.map((node) =>\n              node.selected ? { ...node, selected: false } : node,\n            ),\n            { ...runtime, selected: true },\n          ]);\n          controller.insertCanvasNodes([canonical]);\n          syncState();\n          scheduleSave();\n          setFilePickerOpen(false);\n          return;\n        }\n\n        const dependencies = projectFileImageDependenciesForCanvas(canvasId);\n        if (!dependencies || !isProjectFileImageMimeType(file.mimeType)) {\n          throw new Error("Этот тип файла нельзя добавить на холст.");\n        }\n        const canonical = createCanvasProjectFileImageNode({\n          file,\n          position,\n          zIndex,\n        });\n        const restored = await restoreProjectFileCanvasImageNodes(\n          { schemaVersion: 2, nodes: [canonical], edges: [] },\n          dependencies,\n          {\n            cachedAssetPayloads: variantPayloadsRef.current,\n            viewportZoom: shellStateRef.current.viewport.zoom,\n            allowDowngrade: false,\n          },\n        );\n        const runtime = restored.nodes[0];\n        if (!runtime) throw new Error("Project File image is unavailable.");\n        rememberImageRuntimePayload(variantPayloadsRef.current, runtime, {\n          workspaceId: shellWorkspaceId,\n          canvasId,\n        });\n        setNodes((current) => [\n          ...current.map((node) =>\n            node.selected ? { ...node, selected: false } : node,\n          ),\n          { ...runtime, selected: true },\n        ]);\n        controller.insertCanvasNodes([canonical]);\n        syncState();\n        scheduleSave();\n        setFilePickerOpen(false);\n      } catch (error: unknown) {\n        setShellState((current) => ({\n          ...current,\n          status: "error",\n          error:\n            error instanceof Error\n              ? error.message\n              : "Не удалось добавить файл на холст.",\n        }));\n      }\n    },\n    [\n      centerPosition,\n      controller,\n      projectFileImageDependenciesForCanvas,\n      scheduleSave,\n      setNodes,\n      shellWorkspaceId,\n      syncState,\n    ],\n  );\n\n  const ingestPdfFiles = useCallback(\n    async (files: readonly File[], client: FlowPosition | null) => {\n      if (!projectFileRepository || !projectId || !shellStateRef.current.canvasId)\n        return;\n      const pdfFiles = files.filter(\n        (file) =>\n          resolveProjectFileBrowserMimeType(file.name, file.type) ===\n          "application/pdf",\n      );\n      if (pdfFiles.length === 0) return;\n      const basePosition = client\n        ? screenToFlowRef.current(client)\n        : centerPosition();\n      try {\n        for (const [index, file] of pdfFiles.entries()) {\n          const prepared = await prepareProjectFileBrowserUpload(file);\n          if (prepared.mimeType !== "application/pdf") continue;\n          const uploaded = await projectFileRepository.uploadFile({\n            workspaceId: shellWorkspaceId,\n            projectId,\n            folderId: null,\n            ...prepared,\n          });\n          await createProjectFileNode(uploaded, {\n            x: basePosition.x + index * 36,\n            y: basePosition.y + index * 36,\n          });\n        }\n      } catch (error: unknown) {\n        setShellState((current) => ({\n          ...current,\n          status: "error",\n          error:\n            error instanceof Error ? error.message : "Не удалось загрузить PDF.",\n        }));\n      }\n    },\n    [\n      centerPosition,\n      createProjectFileNode,\n      projectFileRepository,\n      projectId,\n      shellWorkspaceId,\n    ],\n  );'''
          text = text[:start] + new_block + text[end:]
          text = replace_once(
              text,
              '''      void ingest(transferPayload(event.nativeEvent), "drop", {\n        x: event.clientX,\n        y: event.clientY,\n      });\n    },\n    [ingest],''',
              '''      const client = { x: event.clientX, y: event.clientY };\n      void ingest(transferPayload(event.nativeEvent), "drop", client);\n      void ingestPdfFiles(Array.from(event.dataTransfer.files), client);\n    },\n    [ingest, ingestPdfFiles],''',
              "drop pdf ingestion",
          )
          text = replace_once(
              text,
