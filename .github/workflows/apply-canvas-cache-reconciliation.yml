name: Apply Canvas Cache Reconciliation

on:
  push:
    branches:
      - fix/canvas-active-asset-lifecycle

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[canvas-cache-reconciled]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canvas-active-asset-lifecycle
      - name: Apply reconciliation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx')
          text = p.read_text()
          import_anchor = 'import { shouldCloseCanvasTaskDetails } from "@/lib/canvas/canvas-task-selection";\n'
          import_add = import_anchor + 'import {\n  reconcileCachedRuntimeWithServer,\n  serverCanvasMatchesCachedRuntime,\n} from "@/lib/canvas/canvas-runtime-cache-reconciliation";\n'
          if text.count(import_anchor) != 1:
              raise SystemExit('import anchor mismatch')
          text = text.replace(import_anchor, import_add, 1)

          old = '''        if (cachedSummary && initialRuntime) {\n          const unchanged =\n            cachedSummary.revision === initialRuntime.shellState.revision;\n          if (unchanged) {\n            void restoreForCanvas(controller.state).catch((error: unknown) => {\n              if (!active) return;\n              setLoadingLifecycle("error");\n              setShellState((current) => ({\n                ...current,\n                status: "error",\n                error:\n                  error instanceof Error\n                    ? error.message\n                    : "Canvas content refresh failed.",\n              }));\n            });\n            return;\n          }\n          if (initialRuntime.shellState.status !== "saved") {\n            setLoadingLifecycle("error");\n            setShellState((current) => ({\n              ...current,\n              status: "conflict",\n              autosaveBlocked: true,\n              conflictRevision: cachedSummary.revision,\n              error: "Canvas changed elsewhere. Reload to continue.",\n            }));\n            return;\n          }\n          await openCanvasRef.current(cachedSummary.id);\n          return;\n        }'''
          new = '''        if (cachedSummary && initialRuntime) {\n          const unchanged =\n            cachedSummary.revision === initialRuntime.shellState.revision;\n\n          if (initialRuntime.shellState.status !== "saved" && unchanged) {\n            const saveResult = await controller.save();\n            if (saveResult?.status !== "conflict" && controller.state.status === "saved") {\n              const savedState = controller.state;\n              setShellState(savedState);\n              setRenameTitle(savedState.title);\n              await restoreForCanvas(savedState);\n              return;\n            }\n          }\n\n          if (initialRuntime.shellState.status !== "saved") {\n            const latest = await repository.loadCanvas({\n              workspaceId: shellWorkspaceId,\n              canvasId: cachedSummary.id,\n            });\n            if (serverCanvasMatchesCachedRuntime(latest, initialRuntime.shellState)) {\n              const reconciled = controller.restoreRuntimeState(\n                reconcileCachedRuntimeWithServer(latest, initialRuntime.shellState),\n              );\n              setShellState(reconciled);\n              setRenameTitle(reconciled.title);\n              await restoreForCanvas(reconciled);\n              return;\n            }\n            setLoadingLifecycle("error");\n            setShellState((current) => ({\n              ...current,\n              status: "conflict",\n              autosaveBlocked: true,\n              conflictRevision: cachedSummary.revision,\n              error: "Canvas changed elsewhere. Reload to continue.",\n            }));\n            return;\n          }\n\n          if (unchanged) {\n            await restoreForCanvas(controller.state);\n            return;\n          }\n          await openCanvasRef.current(cachedSummary.id);\n          return;\n        }'''
          if text.count(old) != 1:
              raise SystemExit(f'cached branch match count: {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Add reconciliation tests
        shell: bash
        run: |
          cat > tests/canvas-runtime-cache-reconciliation.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { createEmptyCanvasDocumentV2 } from "@/lib/canvas/canvas-document";
          import {
            reconcileCachedRuntimeWithServer,
            serverCanvasMatchesCachedRuntime,
          } from "@/lib/canvas/canvas-runtime-cache-reconciliation";
          import type { LoadedCanvas } from "@/lib/canvas/local-canvas-repository";
          import type { LocalCanvasShellState } from "@/lib/canvas/local-canvas-shell-controller";

          const canvasId = "30000000-0000-0000-0000-000000000001";
          const workspaceId = "20000000-0000-0000-0000-000000000001";
          const document = createEmptyCanvasDocumentV2();
          const cached: LocalCanvasShellState = {
            canvasId,
            title: "Canvas",
            revision: 4,
            document,
            viewport: { x: 10, y: 20, zoom: 1.1 },
            status: "saving",
            error: null,
            conflictRevision: null,
            autosaveBlocked: false,
          };
          const latest: LoadedCanvas = {
            id: canvasId,
            workspaceId,
            title: "Canvas",
            groupId: null,
            sortOrder: 0,
            schemaVersion: 1,
            revision: 5,
            document,
            createdAt: "2026-08-20T00:00:00.000Z",
            updatedAt: "2026-08-20T00:01:00.000Z",
            deletedAt: null,
          };

          describe("Canvas runtime cache reconciliation", () => {
            it("recognizes an already-flushed cached document despite a newer server revision", () => {
              expect(serverCanvasMatchesCachedRuntime(latest, cached)).toBe(true);
              expect(reconcileCachedRuntimeWithServer(latest, cached)).toEqual(
                expect.objectContaining({
                  revision: 5,
                  status: "saved",
                  autosaveBlocked: false,
                  viewport: cached.viewport,
                }),
              );
            });

            it("does not dismiss a real divergent document as the same Canvas", () => {
              const divergent: LoadedCanvas = {
                ...latest,
                document: {
                  ...latest.document,
                  viewport: { x: 999, y: 0, zoom: 1 },
                },
              };
              expect(serverCanvasMatchesCachedRuntime(divergent, cached)).toBe(false);
            });
          });
          EOF
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx tests/canvas-runtime-cache-reconciliation.test.ts
          git commit -m "Reconcile Canvas runtime cache safely [canvas-cache-reconciled]"
          git push origin HEAD:fix/canvas-active-asset-lifecycle
