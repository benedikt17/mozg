name: Apply Canvas PDF feature ARM

on:
  push:
    branches:
      - feature/canvas-pdf-split-view
  pull_request:
    branches:
      - refactor/prototype-state-root
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canvas-pdf-split-view
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply and validate PDF feature
        run: bash scripts/vercel-canvas-pdf-bootstrap-run.sh
      - name: Commit product files only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/lib/canvas/canvas-document.ts \
            src/lib/canvas/react-flow-canvas-adapter.ts \
            src/lib/canvas/canvas-node-clipboard.ts \
            src/prototype/canvases/canvas-project-file-picker.tsx \
            src/prototype/canvases/canvas-desktop-composition.tsx \
            src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx \
            src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css \
            supabase/migrations/20260826160000_canvas_pdf_nodes.sql \
            tests/canvas-document-v2.test.ts
          git diff --cached --check
          git commit -m "feat: add Canvas PDF nodes and split reader"
          git push origin HEAD:feature/canvas-pdf-split-view
