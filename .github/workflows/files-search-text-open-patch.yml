name: Files Search Text Open Patch

on:
  push:
    branches:
      - feature/files-content-search
    paths:
      - .github/workflows/files-search-text-open-patch.yml
      - scripts/files-search-text-open-patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/files-search-text-open-patch.py
      - run: pnpm exec prettier --write src/prototype/files/files-workspace.tsx tests/e2e/files-content-search.spec.ts
      - run: pnpm typecheck
      - name: Commit UTF-8 opening fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/files/files-workspace.tsx tests/e2e/files-content-search.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(files): open text search results as UTF-8"
          git push origin HEAD:feature/files-content-search
