name: Temporary Knowledge Reading comments hotfix

on:
  push:
    branches:
      - feat/knowledge-annotations-clean

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/knowledge-annotations-clean
      - name: Patch runtime and remove temporary helper
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/prototype/knowledge/knowledge-annotations-runtime.tsx")
          text = path.read_text()
          text = text.replace(
              '".desktop-prototype.knowledge-active .document-page.is-active-pane[data-document-id]",',
              '".desktop-prototype .document-page.is-active-pane[data-document-id]",',
          )
          text = text.replace(
              '".desktop-prototype.knowledge-active .document-page.is-active-pane:not(.is-editing) .document-page-inner",',
              '".desktop-prototype .document-page.is-active-pane:not(.is-editing) .document-page-inner",',
          )
          old = '''    const root =\n      window.document.querySelector<HTMLElement>(".desktop-prototype");\n    if (!root) return;\n'''
          if old not in text:
              raise SystemExit("Expected observer root block not found")
          text = text.replace(old, '    const root = window.document.body;\n', 1)
          text = text.replace(
              'window.document.addEventListener("pointerup", onPointerUp);',
              'window.document.addEventListener("pointerup", onPointerUp, true);',
          )
          text = text.replace(
              'window.document.addEventListener("keyup", onKeyUp);',
              'window.document.addEventListener("keyup", onKeyUp, true);',
          )
          text = text.replace(
              'window.document.removeEventListener("pointerup", onPointerUp);',
              'window.document.removeEventListener("pointerup", onPointerUp, true);',
          )
          text = text.replace(
              'window.document.removeEventListener("keyup", onKeyUp);',
              'window.document.removeEventListener("keyup", onKeyUp, true);',
          )
          path.write_text(text)

          helper = Path("src/prototype/knowledge/knowledge-reading-comments-runtime.tsx")
          if helper.exists():
              helper.unlink()
      - name: Remove temporary workflow
        shell: bash
        run: rm .github/workflows/tmp-fix-knowledge-reading-comments.yml
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix Knowledge Reading selection comments"
          git push origin HEAD:feat/knowledge-annotations-clean
