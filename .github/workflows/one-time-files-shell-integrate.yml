name: One-time Files shell integrate

"on":
  push:
    branches:
      - feat/project-files-stage-a2-preview

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-files-stage-a2-preview
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply exact integration patch
        run: python scripts/one-time-integrate-files-shell.py

      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            src/prototype/desktop-mock-data.ts \
            src/prototype/desktop-shell.tsx \
            src/prototype/files/files-workspace.tsx \
            src/prototype/shell/mobile-navigation.tsx \
            src/app/prototype/desktop/files/page.tsx \
            tests/e2e/critical-desktop.spec.ts

      - run: git diff --check

      - name: Remove one-time integration helpers
        run: |
          rm scripts/one-time-integrate-files-shell.py
          rm .github/workflows/one-time-files-shell-integrate.yml

      - name: Commit integrated Desktop Files section
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Files: integrate section into Desktop shell"
          git push origin HEAD:feat/project-files-stage-a2-preview
