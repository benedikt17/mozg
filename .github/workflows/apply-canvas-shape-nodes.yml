name: Apply Canvas shape nodes

on:
  push:
    branches:
      - feat/canvas-shape-nodes
    paths:
      - .github/workflows/apply-canvas-shape-nodes.yml
      - tests/canvas-shape-nodes.test.ts
      - tests/canvas-node-frame.test.ts
      - tests/canvas-style-eyedropper-runtime.test.ts

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canvas-shape-nodes
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Make parser matcher robust
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-canvas-shape-nodes.py")
          source = path.read_text()
          marker = '    "document shape key",\n)\n'
          end = source.index(marker) + len(marker)
          start = source.rfind("text = replace_once(", 0, end)
          if start < 0:
              raise SystemExit("shape-key patch call not found")
          replacement = '''text = replace_once(
              text,
              '          : kind === "image"\\n            ? hasImageFileId\\n              ? "fileId"\\n              : "assetId"\\n            : null;\\n',
              '          : kind === "shape"\\n            ? "shape"\\n            : kind === "image"\\n              ? hasImageFileId\\n                ? "fileId"\\n                : "assetId"\\n              : null;\\n',
              "document shape key",
          )
          '''
          path.write_text(source[:start] + replacement + source[end:])
          PY
      - name: Apply shape node patch
        run: |
          python scripts/apply-canvas-shape-nodes.py
          pnpm exec prettier --write \
            src/lib/canvas/canvas-document.ts \
            src/lib/canvas/canvas-shape-style.ts \
            src/lib/canvas/react-flow-canvas-adapter.ts \
            src/lib/canvas/canvas-node-clipboard.ts \
            src/lib/canvas/canvas-alt-drag-duplicate.ts \
            src/lib/canvas/canvas-minimap.ts \
            src/prototype/infinite-canvas-local-shell/canvas-node-frame.tsx \
            src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx \
            src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css \
            src/prototype/canvases/canvas-desktop-composition.tsx \
            tests/canvas-shape-nodes.test.ts \
            tests/canvas-node-frame.test.ts \
            tests/canvas-style-eyedropper-runtime.test.ts
          git diff --check
      - name: Shape contract tests
        run: pnpm exec vitest run tests/canvas-shape-nodes.test.ts
      - name: Related Canvas regression tests
        run: |
          pnpm exec vitest run \
            tests/canvas-document-v2.test.ts \
            tests/canvas-node-clipboard.test.ts \
            tests/canvas-alt-drag-duplicate.test.ts \
            tests/canvas-runtime-projection.test.ts \
            tests/canvas-node-frame.test.ts \
            tests/canvas-style-eyedropper-runtime.test.ts \
            tests/desktop-canvas-composition.test.ts
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Commit implementation and remove patch helpers
        run: |
          git rm -f .github/workflows/apply-canvas-shape-nodes.yml scripts/apply-canvas-shape-nodes.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Canvas: add rectangle and circle shape nodes"
          git push origin HEAD:feat/canvas-shape-nodes
