name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm supabase start
      - run: pnpm supabase gen types typescript --local --schema public > /tmp/database.types.ts
      - run: perl -0pi -e 's/\n\n\z/\n/' /tmp/database.types.ts
      - run: cp /tmp/database.types.ts src/lib/supabase/database.types.ts
      - run: node scripts/stage34c-ci-sync.mjs
      - name: Commit exact Stage 3.4C generated fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/lib/supabase/database.types.ts tests/rls
          if ! git diff --cached --quiet; then
            git commit -m "test: sync Stage 3.4C database contracts"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: diff -u src/lib/supabase/database.types.ts /tmp/database.types.ts
      - run: pnpm test:rls
      - if: always()
        run: pnpm supabase stop --no-backup
      - run: pnpm build
