name: Files A4 Test Format Helper

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-files-stage-a4-lifecycle
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/prototype/files/files-workspace.test.ts tests/e2e/files-desktop.spec.ts
      - name: Commit canonical test formatting to A4
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/files/files-workspace.test.ts tests/e2e/files-desktop.spec.ts
          git commit -m "Files: apply canonical A4 test formatting"
          git push origin HEAD:feat/project-files-stage-a4-lifecycle
