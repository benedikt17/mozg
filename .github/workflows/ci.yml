name: CI

on:
  pull_request:
  push:
    branches:
      - refactor/prototype-state-root

permissions:
  contents: write

jobs:
  finalize_canvas_pdf:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/canvas-pdf-split-view' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canvas-pdf-split-view
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch PDF cached restore and drop flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx")
          text = path.read_text()

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return source.replace(old, new, 1)

          start = text.index("  const createPdfNodeFromProjectFile = useCallback(")
          end = text.index("  const createProjectFileNode = useCallback(", start)
          segment = text[start:end]
          segment = replace_once(
              segment,
              "    (file: ProjectFileRecord) => {",
              "    (file: ProjectFileRecord, position?: FlowPosition) => {",
              "pdf node position parameter",
          )
          segment = replace_once(
              segment,
              "        position: centerPosition(),",
              "        position: position ?? centerPosition(),",
              "pdf node position",
          )
          text = text[:start] + segment + text[end:]

          text = replace_once(
              text,
              "      const skeleton: CanvasFlowNode[] = [\n        ...canvasDocumentToImageNodes(cachedState.document),\n        ...canvasDocumentToTaskNodes(cachedState.document, {",
              "      const skeleton: CanvasFlowNode[] = [\n        ...canvasDocumentToImageNodes(cachedState.document),\n        ...canvasDocumentToPdfNodes(cachedState.document),\n        ...canvasDocumentToTaskNodes(cachedState.document, {",
              "cached PDF restore",
          )

          drop_start = text.index("  const onDrop = useCallback(")
          upload_start = text.index("  const uploadPdfFiles = useCallback(", drop_start)
          picker_start = text.index("  const onPicker = useCallback(", upload_start)
          drop_block = text[drop_start:upload_start]
          upload_block = text[upload_start:picker_start]

          upload_block = replace_once(
              upload_block,
              "    async (files: File[]) => {",
              "    async (files: File[], position?: FlowPosition) => {",
              "PDF upload position parameter",
          )
          upload_block = replace_once(
              upload_block,
              "          createPdfNodeFromProjectFile(uploaded);",
              "          createPdfNodeFromProjectFile(uploaded, position);",
              "PDF upload position forwarding",
          )

          old_drop = "\n".join([
              "      if (!shouldPreventFileNavigation(transferPayload(event.nativeEvent)))",
              "        return;",
              "      void ingest(transferPayload(event.nativeEvent), \"drop\", {",
              "        x: event.clientX,",
              "        y: event.clientY,",
              "      });",
          ])
          new_drop = "\n".join([
              "      const payload = transferPayload(event.nativeEvent);",
              "      if (!shouldPreventFileNavigation(payload)) return;",
              "      const client = { x: event.clientX, y: event.clientY };",
              "      const pdfFiles = payload.files.filter(",
              "        (file) =>",
              "          file.type === \"application/pdf\" ||",
              "          file.name.toLowerCase().endsWith(\".pdf\"),",
              "      );",
              "      if (pdfFiles.length === 0) {",
              "        void ingest(payload, \"drop\", client);",
              "        return;",
              "      }",
              "      const imageFiles = payload.files.filter((file) =>",
              "        [\"image/png\", \"image/jpeg\", \"image/webp\"].includes(file.type),",
              "      );",
              "      void (async () => {",
              "        if (imageFiles.length > 0) {",
              "          await ingest(",
              "            {",
              "              files: imageFiles,",
              "              items: [],",
              "              types: imageFiles.map((file) => file.type),",
              "            },",
              "            \"drop\",",
              "            client,",
              "          );",
              "        }",
              "        await uploadPdfFiles(",
              "          pdfFiles,",
              "          screenToFlowRef.current(client),",
              "        );",
              "      })();",
          ])
          drop_block = replace_once(drop_block, old_drop, new_drop, "PDF drop routing")
          drop_block = replace_once(
              drop_block,
              "    [ingest],",
              "    [ingest, uploadPdfFiles],",
              "PDF drop dependencies",
          )
          text = text[:drop_start] + upload_block + drop_block + text[picker_start:]
          path.write_text(text)

          test_lines = [
              'import { readFileSync } from "node:fs";',
              'import { describe, expect, it } from "vitest";',
              '',
              'const shell = readFileSync(',
              '  "src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx",',
              '  "utf8",',
              ');',
              '',
              'describe("Canvas PDF runtime contract", () => {',
              '  it("keeps PDF nodes in the cached Canvas scene", () => {',
              '    expect(shell).toContain(',
              '      "...canvasDocumentToPdfNodes(cachedState.document)",',
              '    );',
              '  });',
              '',
              '  it("separates PDF and image files in a mixed drop", () => {',
              '    expect(shell).toContain("const pdfFiles = payload.files.filter(");',
              '    expect(shell).toContain("const imageFiles = payload.files.filter((file) =>");',
              '    expect(shell).toContain("files: imageFiles");',
              '    expect(shell).toMatch(',
              '      /await uploadPdfFiles\\(\\s*pdfFiles,\\s*screenToFlowRef\\.current\\(client\\),?\\s*\\)/,',
              '    );',
              '    expect(shell).toContain(',
              '      "(file: ProjectFileRecord, position?: FlowPosition) =>",',
              '    );',
              '    expect(shell).toContain("position: position ?? centerPosition()");',
              '  });',
              '});',
          ]
          Path("tests/canvas-pdf-runtime.test.ts").write_text("\n".join(test_lines) + "\n")
          PY
      - run: pnpm exec prettier --write src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx tests/canvas-pdf-runtime.test.ts
      - run: git diff --check
      - run: pnpm test -- tests/canvas-pdf-runtime.test.ts tests/canvas-document-v2.test.ts tests/canvas-node-frame.test.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit product fix and restore canonical CI
        shell: bash
        run: |
          rm -f .github/workflows/finalize-canvas-pdf.yml
          git checkout origin/refactor/prototype-state-root -- .github/workflows/ci.yml
          git add \
            .github/workflows/ci.yml \
            .github/workflows/finalize-canvas-pdf.yml \
            src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx \
            tests/canvas-pdf-runtime.test.ts
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: finish Canvas PDF runtime flows"
          git push origin HEAD:feature/canvas-pdf-split-view

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve changed range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "DIFF_BASE_SHA=$PR_BASE_SHA" >> "$GITHUB_ENV"
          else
            echo "DIFF_BASE_SHA=$PUSH_BEFORE_SHA" >> "$GITHUB_ENV"
          fi
      - name: Check formatting of changed files
        shell: bash
        run: |
          git diff --name-only -z --diff-filter=ACMR "$DIFF_BASE_SHA...HEAD" -- \
            '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.css' '*.md' '*.yml' '*.yaml' \
            | xargs -0 -r pnpm exec prettier --check
      - name: Check changed-file whitespace
        run: git diff --check "$DIFF_BASE_SHA...HEAD"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm supabase start
      - run: pnpm supabase gen types typescript --local --schema public > /tmp/database.types.ts
      - run: perl -0pi -e 's/\n\n\z/\n/' /tmp/database.types.ts
      - run: diff -u src/lib/supabase/database.types.ts /tmp/database.types.ts
      - run: pnpm test:rls
      - name: Export local Supabase browser-test environment
        shell: bash
        run: |
          pnpm supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: pnpm supabase stop --no-backup
      - run: pnpm build
