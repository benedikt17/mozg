name: CI

on:
  pull_request:
  push:
    branches:
      - refactor/prototype-state-root

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Canvas bootstrap hotfix on feature branch
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/canvas-active-asset-lifecycle' }}
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          python - <<'PY'
          from pathlib import Path

          path = Path('src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx')
          source = path.read_text()

          anchor = '''  );\n\n  const applyCanvasHistory = useCallback('''
          if 'const restoreForCanvasRef = useRef(restoreForCanvas);' not in source:
              assert source.count(anchor) == 1, source.count(anchor)
              source = source.replace(
                  anchor,
                  '''  );\n\n  const restoreForCanvasRef = useRef(restoreForCanvas);\n  restoreForCanvasRef.current = restoreForCanvas;\n\n  const applyCanvasHistory = useCallback(''',
                  1,
              )

          replacements = {
              'await restoreForCanvas(savedState);': 'await restoreForCanvasRef.current(savedState);',
              'await restoreForCanvas(reconciled);': 'await restoreForCanvasRef.current(reconciled);',
              'await restoreForCanvas(controller.state);': 'await restoreForCanvasRef.current(controller.state);',
              '    restoreCachedScene,\n    restoreForCanvas,\n    runtimeCache,': '    restoreCachedScene,\n    runtimeCache,',
          }
          for old, new in replacements.items():
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY
          if git diff --quiet -- src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx; then
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx
          git commit -m "fix: keep Canvas bootstrap effect stable"
          git push origin HEAD:"$HEAD_REF"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve changed range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "DIFF_BASE_SHA=$PR_BASE_SHA" >> "$GITHUB_ENV"
          else
            echo "DIFF_BASE_SHA=$PUSH_BEFORE_SHA" >> "$GITHUB_ENV"
          fi
      - name: Check formatting of changed files
        shell: bash
        run: |
          git diff --name-only -z --diff-filter=ACMR "$DIFF_BASE_SHA...HEAD" -- \
            '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.css' '*.md' '*.yml' '*.yaml' \
            | xargs -0 -r pnpm exec prettier --check
      - name: Check changed-file whitespace
        run: git diff --check "$DIFF_BASE_SHA...HEAD"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm supabase start
      - run: pnpm supabase gen types typescript --local --schema public > /tmp/database.types.ts
      - run: perl -0pi -e 's/\n\n\z/\n/' /tmp/database.types.ts
      - run: diff -u src/lib/supabase/database.types.ts /tmp/database.types.ts
      - run: pnpm test:rls
      - name: Export local Supabase browser-test environment
        shell: bash
        run: |
          pnpm supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: pnpm supabase stop --no-backup
      - run: pnpm build
