name: CI

on:
  pull_request:
  push:
    branches:
      - refactor/prototype-state-root

permissions:
  contents: write

jobs:
  apply_canvas_pdf:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/canvas-pdf-split-view'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canvas-pdf-split-view
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Extract and apply Canvas PDF patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-canvas-pdf.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/apply-canvas-pdf.py').write_text(script)
          PY
          python /tmp/apply-canvas-pdf.py
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            src/lib/canvas/canvas-document.ts \
            src/lib/canvas/react-flow-canvas-adapter.ts \
            src/lib/canvas/canvas-node-clipboard.ts \
            src/prototype/canvases/canvas-project-file-picker.tsx \
            src/prototype/canvases/canvas-desktop-composition.tsx \
            src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx \
            src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css \
            supabase/migrations/20260826193000_canvas_pdf_project_file_nodes.sql \
            tests/canvas-pdf-node.test.ts \
            tests/rls/canvas-project-file-references.test.sql \
            tests/e2e/canvas-pdf-split-view.spec.ts
      - run: git diff --check
      - run: pnpm test -- tests/canvas-pdf-node.test.ts tests/canvas-document-v2.test.ts tests/canvas-node-clipboard.test.ts
      - run: pnpm typecheck
      - name: Commit product changes and remove bootstrap files
        run: |
          rm -f .github/workflows/apply-canvas-pdf.yml .tmp-canvas-pdf-trigger
          git checkout origin/refactor/prototype-state-root -- .github/workflows/ci.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add PDF nodes and split reader to Canvas"
          git push origin HEAD:feature/canvas-pdf-split-view

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve changed range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "DIFF_BASE_SHA=$PR_BASE_SHA" >> "$GITHUB_ENV"
          else
            echo "DIFF_BASE_SHA=$PUSH_BEFORE_SHA" >> "$GITHUB_ENV"
          fi
      - name: Check formatting of changed files
        shell: bash
        run: |
          git diff --name-only -z --diff-filter=ACMR "$DIFF_BASE_SHA...HEAD" -- \
            '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.css' '*.md' '*.yml' '*.yaml' \
            | xargs -0 -r pnpm exec prettier --check
      - name: Check changed-file whitespace
        run: git diff --check "$DIFF_BASE_SHA...HEAD"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm supabase start
      - run: pnpm supabase gen types typescript --local --schema public > /tmp/database.types.ts
      - run: perl -0pi -e 's/\n\n\z/\n/' /tmp/database.types.ts
      - run: diff -u src/lib/supabase/database.types.ts /tmp/database.types.ts
      - run: pnpm test:rls
      - name: Export local Supabase browser-test environment
        shell: bash
        run: |
          pnpm supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: pnpm supabase stop --no-backup
      - run: pnpm build
