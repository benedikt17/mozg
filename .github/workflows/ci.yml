name: CI

on:
  pull_request:
  push:
    branches:
      - refactor/prototype-state-root

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cached shape restore patch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/canvas-cached-shape-restore'
        shell: bash
        run: |
          git checkout -B fix/canvas-cached-shape-restore origin/fix/canvas-cached-shape-restore
          python -c 'from pathlib import Path; p=Path("src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx"); s=p.read_text(); old="        ...canvasDocumentToTextNodes(cachedState.document),\n      ];\n      // Keep the runtime-cache composition contract explicit for desktop-shell checks:"; new="        ...canvasDocumentToTextNodes(cachedState.document),\n        ...canvasDocumentToShapeNodes(cachedState.document),\n      ];\n      // Keep the runtime-cache composition contract explicit for desktop-shell checks:"; assert s.count(old) in (0, 1), s.count(old); p.write_text(s.replace(old, new, 1)) if old in s else None'
          if git diff --quiet -- src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx
          git diff --cached --check
          git commit -m "fix(canvas): restore shapes from runtime cache"
          git push origin HEAD:fix/canvas-cached-shape-restore
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve changed range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "DIFF_BASE_SHA=$PR_BASE_SHA" >> "$GITHUB_ENV"
          else
            echo "DIFF_BASE_SHA=$PUSH_BEFORE_SHA" >> "$GITHUB_ENV"
          fi
      - name: Check formatting of changed files
        shell: bash
        run: |
          git diff --name-only -z --diff-filter=ACMR "$DIFF_BASE_SHA...HEAD" -- \
            '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.css' '*.md' '*.yml' '*.yaml' \
            | xargs -0 -r pnpm exec prettier --check
      - name: Check changed-file whitespace
        run: git diff --check "$DIFF_BASE_SHA...HEAD"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm supabase start
      - run: pnpm supabase gen types typescript --local --schema public > /tmp/database.types.ts
      - run: perl -0pi -e 's/\n\n\z/\n/' /tmp/database.types.ts
      - run: diff -u src/lib/supabase/database.types.ts /tmp/database.types.ts
      - run: pnpm test:rls
      - name: Export local Supabase browser-test environment
        shell: bash
        run: |
          pnpm supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: pnpm supabase stop --no-backup
      - run: pnpm build
