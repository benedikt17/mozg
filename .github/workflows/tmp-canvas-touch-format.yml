name: Temporary Canvas touch format

on:
  push:
    branches:
      - fix/canvas-touch-pinch-priority

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canvas-touch-pinch-priority
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Harden pinch transition and format changed files
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path("src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx")
          text = path.read_text()
          old = '''    touchViewportGestureActiveRef.current = true;
              setTouchViewportGestureActive(true);

              const snapshot = touchGestureNodesRef.current;
          '''
          new = '''    touchViewportGestureActiveRef.current = true;
              nodeDragActiveRef.current = false;
              edgeRemovalSuppressionUntilRef.current = Date.now() + 5000;
              setTouchViewportGestureActive(true);

              const snapshot = touchGestureNodesRef.current;
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one pinch transition, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx tests/canvas-miro-selection-runtime.test.ts
          rm .github/workflows/tmp-canvas-touch-format.yml
          git diff --check
      - name: Commit formatted product patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx tests/canvas-miro-selection-runtime.test.ts .github/workflows/tmp-canvas-touch-format.yml
          git commit -m "Format Canvas touch pinch fix"
          git push origin HEAD:fix/canvas-touch-pinch-priority
