name: Canvas text lint fix

on:
  push:
    branches:
      - agent/canvas-miro-text-foundation
    paths:
      - .github/workflows/canvas-text-lint-fix.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Extract inline Canvas text editor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx')
          source = path.read_text()
          start = source.index('function TextNodeBody({')
          end = source.index('function TaskNodeBody({', start)
          assert start >= 0 and end > start
          block = '''function CanvasTextEditor({\n  id,\n  markdown,\n}: {\n  id: string;\n  markdown: string;\n}): React.JSX.Element {\n  const [draft, setDraft] = useState(markdown);\n  const skipNextBlurCommitRef = useRef(false);\n  const update = (value: string) => {\n    setDraft(value);\n    window.dispatchEvent(\n      new CustomEvent("mozg:canvas-text-draft", {\n        detail: { id, markdown: value },\n      }),\n    );\n  };\n  const commit = () => {\n    window.dispatchEvent(\n      new CustomEvent("mozg:canvas-text-commit", {\n        detail: { id, markdown: commitTextMarkdown(draft) },\n      }),\n    );\n  };\n  const cancel = () => {\n    skipNextBlurCommitRef.current = true;\n    window.dispatchEvent(\n      new CustomEvent("mozg:canvas-text-cancel", { detail: { id } }),\n    );\n  };\n  return (\n    <textarea\n      autoFocus\n      value={draft}\n      placeholder="Type something"\n      aria-label="Canvas text"\n      className={`${styles.textEditorInput} nodrag nopan nowheel`}\n      onBlur={() => {\n        if (skipNextBlurCommitRef.current) {\n          skipNextBlurCommitRef.current = false;\n          return;\n        }\n        commit();\n      }}\n      onChange={(event) => update(event.target.value)}\n      onKeyDown={(event) => {\n        event.stopPropagation();\n        if (event.key === "Escape") {\n          event.preventDefault();\n          cancel();\n        } else if (\n          event.key === "Enter" &&\n          (event.ctrlKey || event.metaKey)\n        ) {\n          event.preventDefault();\n          event.currentTarget.blur();\n        }\n      }}\n      onPaste={(event) => event.stopPropagation()}\n    />\n  );\n}\n\nfunction TextNodeBody({\n  data,\n  selected,\n  id,\n}: NodeProps<CanvasTextFlowNode>): React.JSX.Element {\n  const textStyle = canvasTextCss(data.style);\n  return (\n    <CanvasNodeFrame\n      selected={selected}\n      minWidth={120}\n      minHeight={32}\n      className={styles.textNodeFrame}\n      connectionHandleLayer={<ConnectionHandleLayer selected={selected} />}\n    >\n      <div\n        className={styles.textNodeContent}\n        style={textStyle}\n        onDoubleClick={(event) => {\n          event.stopPropagation();\n          window.dispatchEvent(\n            new CustomEvent("mozg:canvas-text-edit", { detail: { id } }),\n          );\n        }}\n      >\n        {data.isEditing ? (\n          <CanvasTextEditor id={id} markdown={data.markdown} />\n        ) : data.markdown.trim() ? (\n          <div className={styles.textPreview}>\n            <MarkdownStringPreview contentId={id} markdown={data.markdown} />\n          </div>\n        ) : (\n          <span className={styles.textPlaceholder}>Type something</span>\n        )}\n      </div>\n    </CanvasNodeFrame>\n  );\n}\n\n'''
          source = source[:start] + block + source[end:]
          path.write_text(source)
          PY
      - run: pnpm exec prettier --write src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx
      - name: Commit lint-safe editor structure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx
          git commit -m "Canvas: make inline text editor lint-safe"
          git push
