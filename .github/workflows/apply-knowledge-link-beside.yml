name: Apply Knowledge internal-link beside navigation

on:
  push:
    branches:
      - fix/knowledge-internal-links-beside

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/knowledge-internal-links-beside
      - name: Patch Knowledge workspace
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/prototype/knowledge/knowledge-workspace.tsx")
          text = path.read_text()

          old_import = '''import { getKnowledgeHistoryShortcutAction } from "./knowledge-content-history";\nimport { useKnowledgeContentHistory } from "./knowledge-content-history-runtime";'''
          new_import = '''import { getKnowledgeHistoryShortcutAction } from "./knowledge-content-history";\nimport { useKnowledgeContentHistory } from "./knowledge-content-history-runtime";\nimport { getKnowledgeInternalLinkNavigationActions } from "./knowledge-internal-link-navigation";'''
          assert old_import in text
          text = text.replace(old_import, new_import, 1)

          old_primary = '''                editing={editingDocumentId === selectedDocument.id}\n                onActivate={() => activatePane("primary")}'''
          new_primary = '''                editing={editingDocumentId === selectedDocument.id}\n                onActivate={() => activatePane("primary")}\n                splitEnabled={splitEnabled}'''
          assert old_primary in text
          text = text.replace(old_primary, new_primary, 1)

          old_secondary = '''                  onActivate={() => activatePane("secondary")}\n                  secondary'''
          new_secondary = '''                  onActivate={() => activatePane("secondary")}\n                  secondary\n                  splitEnabled={splitEnabled}'''
          assert old_secondary in text
          text = text.replace(old_secondary, new_secondary, 1)

          old_signature = '''  dispatch,\n  onActivate,\n}: {\n  document: PrototypeDocument | undefined;\n  documents: PrototypeDocument[];\n  activeProjectId: string;\n  secondary?: boolean;\n  active: boolean;\n  editing: boolean;\n  dispatch: Dispatch;\n  onActivate: () => void;\n}): React.JSX.Element {'''
          new_signature = '''  dispatch,\n  onActivate,\n  splitEnabled,\n}: {\n  document: PrototypeDocument | undefined;\n  documents: PrototypeDocument[];\n  activeProjectId: string;\n  secondary?: boolean;\n  active: boolean;\n  editing: boolean;\n  dispatch: Dispatch;\n  onActivate: () => void;\n  splitEnabled: boolean;\n}): React.JSX.Element {'''
          assert old_signature in text
          text = text.replace(old_signature, new_signature, 1)

          old_handler = '''              dispatch({\n                type: "open-knowledge-document-in-active-pane",\n                documentId: target.id,\n              });'''
          new_handler = '''              getKnowledgeInternalLinkNavigationActions({\n                sourcePane: secondary ? "secondary" : "primary",\n                splitEnabled,\n                targetDocumentId: target.id,\n              }).forEach(dispatch);'''
          assert old_handler in text
          text = text.replace(old_handler, new_handler, 1)

          path.write_text(text)
      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          git rm .github/workflows/apply-knowledge-link-beside.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/prototype/knowledge/knowledge-workspace.tsx
          git commit -m "Knowledge: open internal article links beside source"
          git push origin HEAD:fix/knowledge-internal-links-beside
