name: Apply Canvas eyedropper descendant cursor

on:
  push:
    branches:
      - feat/canvas-custom-color-picker
    paths:
      - .github/workflows/apply-canvas-eyedropper-descendant-cursor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canvas-custom-color-picker
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Keep eyedropper cursor over node descendants
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css")
          text = path.read_text()
          old = '''.canvasStyleEyedropperActive,
          .canvasStyleEyedropperActive :global(.react-flow__pane),
          .canvasStyleEyedropperActive :global(.react-flow__node) {
          '''
          new = '''.canvasStyleEyedropperActive,
          .canvasStyleEyedropperActive :global(.react-flow__pane),
          .canvasStyleEyedropperActive :global(.react-flow__node),
          .canvasStyleEyedropperActive :global(.react-flow__node *) {
          '''
          if old not in text:
              raise SystemExit("eyedropper cursor selector block not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm exec prettier --write src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css
      - run: git diff --check
      - run: pnpm exec vitest run tests/canvas-style-eyedropper-runtime.test.ts && pnpm lint && pnpm typecheck
      - name: Commit fix and remove workflow
        run: |
          git rm .github/workflows/apply-canvas-eyedropper-descendant-cursor.yml
          git add src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Canvas: keep eyedropper cursor over target contents"
          git push origin HEAD:feat/canvas-custom-color-picker
