name: Apply Canvas bootstrap hotfix

on:
  push:
    branches:
      - fix/canvas-active-asset-lifecycle
    paths:
      - .github/workflows/apply-canvas-bootstrap-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply canvas bootstrap hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canvas-active-asset-lifecycle
      - name: Patch Canvas bootstrap lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx')
          source = path.read_text()

          anchor = '''  );\n\n  const applyCanvasHistory = useCallback('''
          replacement = '''  );\n\n  const restoreForCanvasRef = useRef(restoreForCanvas);\n  restoreForCanvasRef.current = restoreForCanvas;\n\n  const applyCanvasHistory = useCallback('''
          assert source.count(anchor) == 1, source.count(anchor)
          source = source.replace(anchor, replacement, 1)

          replacements = {
              'await restoreForCanvas(savedState);': 'await restoreForCanvasRef.current(savedState);',
              'await restoreForCanvas(reconciled);': 'await restoreForCanvasRef.current(reconciled);',
              'await restoreForCanvas(controller.state);': 'await restoreForCanvasRef.current(controller.state);',
              '    restoreCachedScene,\n    restoreForCanvas,\n    runtimeCache,': '    restoreCachedScene,\n    runtimeCache,',
          }
          for old, new in replacements.items():
              assert source.count(old) == 1, (old, source.count(old))
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY
          git diff --check
          git diff -- src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx
          git commit -m "fix: keep Canvas bootstrap effect stable"
          git push origin HEAD:fix/canvas-active-asset-lifecycle
