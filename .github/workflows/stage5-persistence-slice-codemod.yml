name: Stage 5 lazy runtime codemod

on:
  push:
    branches:
      - agent/stage5-whole-root-lazy-work
    paths:
      - .github/workflows/stage5-persistence-slice-codemod.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage5-whole-root-lazy-work
      - name: Materialize lazy runtime boundaries
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(source, from, to, label) {
            if (source.split(from).length !== 2) throw new Error(`${label} anchor mismatch`);
            return source.replace(from, to);
          }

          {
            const path = 'src/prototype/desktop-shell.tsx';
            let source = fs.readFileSync(path, 'utf8');
            source = replaceOnce(
              source,
              'import { useEffect, useMemo, useRef, useState } from "react";\n',
              'import { useEffect, useMemo, useRef, useState } from "react";\nimport dynamic from "next/dynamic";\n',
              'desktop dynamic import',
            );
            source = replaceOnce(
              source,
              'import { CommandPalette } from "@/prototype/shell/command-palette";\n',
              '',
              'static CommandPalette import',
            );
            const cssAnchor = 'import "./desktop-knowledge.css";\n\ntype Dispatch = React.Dispatch<DesktopPrototypeAction>;';
            const dynamicBlock = `import "./desktop-knowledge.css";\n\nconst CommandPalette = dynamic(\n  () =>\n    import("@/prototype/shell/command-palette").then(\n      ({ CommandPalette }) => CommandPalette,\n    ),\n  { ssr: false },\n);\n\ntype Dispatch = React.Dispatch<DesktopPrototypeAction>;`;
            source = replaceOnce(source, cssAnchor, dynamicBlock, 'CommandPalette dynamic block');
            fs.writeFileSync(path, source);
          }

          {
            const path = 'src/prototype/knowledge/knowledge-workspace.tsx';
            let source = fs.readFileSync(path, 'utf8');
            source = replaceOnce(
              source,
              '      {currentDocument ? (\n        <article\n          className="knowledge-print-document"',
              '      {currentDocument && shareMenuOpen ? (\n        <article\n          className="knowledge-print-document"',
              'lazy print preview',
            );
            fs.writeFileSync(path, source);
          }

          {
            const path = 'src/prototype/state/knowledge-state.ts';
            let source = fs.readFileSync(path, 'utf8');
            const treeAnchor = 'export function getKnowledgeTree(\n  state: DesktopPrototypeState,\n  projectId = state.activeProjectId,\n): KnowledgeTreeNode[] {';
            const cacheSupport = `type KnowledgeTreeDocumentShape = {\n  id: string;\n  title: string;\n  excerpt: string;\n  folderPath: string[];\n  order: number | undefined;\n};\n\ntype KnowledgeTreeCacheEntry = {\n  projectId: string;\n  query: string;\n  knowledgeFolders: DesktopPrototypeState["knowledgeFolders"];\n  documents: KnowledgeTreeDocumentShape[];\n  tree: KnowledgeTreeNode[];\n};\n\nlet knowledgeTreeCache: KnowledgeTreeCacheEntry | null = null;\n\nfunction knowledgeTreeDocumentShape(\n  document: PrototypeDocument,\n): KnowledgeTreeDocumentShape {\n  return {\n    id: document.id,\n    title: getDocumentTitle(document),\n    excerpt: document.excerpt,\n    folderPath: [...getDocumentFolderPath(document)],\n    order: document.order,\n  };\n}\n\nfunction knowledgeTreeDocumentMatches(\n  document: PrototypeDocument,\n  shape: KnowledgeTreeDocumentShape,\n): boolean {\n  const folderPath = getDocumentFolderPath(document);\n  return (\n    document.id === shape.id &&\n    getDocumentTitle(document) === shape.title &&\n    document.excerpt === shape.excerpt &&\n    document.order === shape.order &&\n    folderPath.length === shape.folderPath.length &&\n    folderPath.every((segment, index) => segment === shape.folderPath[index])\n  );\n}\n\nfunction getCachedKnowledgeTree(\n  state: DesktopPrototypeState,\n  projectId: string,\n  query: string,\n  documents: PrototypeDocument[],\n): KnowledgeTreeNode[] | undefined {\n  const cached = knowledgeTreeCache;\n  if (\n    !cached ||\n    cached.projectId !== projectId ||\n    cached.query !== query ||\n    cached.knowledgeFolders !== state.knowledgeFolders ||\n    cached.documents.length !== documents.length\n  ) {\n    return undefined;\n  }\n  return documents.every((document, index) =>\n    knowledgeTreeDocumentMatches(document, cached.documents[index]!),\n  )\n    ? cached.tree\n    : undefined;\n}\n\nfunction cacheKnowledgeTree(\n  state: DesktopPrototypeState,\n  projectId: string,\n  query: string,\n  documents: PrototypeDocument[],\n  tree: KnowledgeTreeNode[],\n): void {\n  knowledgeTreeCache = {\n    projectId,\n    query,\n    knowledgeFolders: state.knowledgeFolders,\n    documents: documents.map(knowledgeTreeDocumentShape),\n    tree,\n  };\n}\n\n${treeAnchor}`;
            source = replaceOnce(source, treeAnchor, cacheSupport, 'Knowledge tree cache support');
            const queryAnchor = '  const query = state.knowledgeSearchQuery.trim().toLocaleLowerCase("ru");\n  const rootFolders = new Map<string, KnowledgeTreeNode>();';
            source = replaceOnce(
              source,
              queryAnchor,
              '  const query = state.knowledgeSearchQuery.trim().toLocaleLowerCase("ru");\n  const cachedTree = getCachedKnowledgeTree(state, projectId, query, documents);\n  if (cachedTree) return cachedTree;\n  const rootFolders = new Map<string, KnowledgeTreeNode>();',
              'Knowledge tree cache lookup',
            );
            const returnAnchor = `  return sortKnowledgeNodes(\n    [...Array.from(rootFolders.values()), ...rootDocuments],\n    documentOrder,\n  );\n}`;
            const cachedReturn = `  const tree = sortKnowledgeNodes(\n    [...Array.from(rootFolders.values()), ...rootDocuments],\n    documentOrder,\n  );\n  cacheKnowledgeTree(state, projectId, query, documents, tree);\n  return tree;\n}`;
            source = replaceOnce(source, returnAnchor, cachedReturn, 'Knowledge tree cached return');
            fs.writeFileSync(path, source);
          }
          NODE
      - name: Commit materialized runtime work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/desktop-shell.tsx src/prototype/knowledge/knowledge-workspace.tsx src/prototype/state/knowledge-state.ts
          git diff --cached --quiet && exit 0
          git commit -m "perf: defer inactive Desktop runtime work"
          git push origin HEAD:agent/stage5-whole-root-lazy-work
