name: Apply Canvas style eyedropper

on:
  push:
    branches:
      - feat/canvas-custom-color-picker
    paths:
      - .github/workflows/apply-canvas-style-eyedropper.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canvas-custom-color-picker
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch eyedropper runtime
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          shell_path = Path("src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx")
          text = shell_path.read_text()

          def sub(pattern: str, replacement: str, count: int = 1, flags: int = 0):
              global text
              text, actual = re.subn(pattern, replacement, text, count=count, flags=flags)
              if actual != count:
                  raise SystemExit(f"expected {count} replacement(s), got {actual}: {pattern[:140]!r}")

          sub(
              r'(function dispatchCanvasTextStylePatch\([\s\S]*?\n\})\n\nfunction TextSelectionToolbar',
              r'''\1

function dispatchCanvasStyleEyedropperStart(id: string): void {
  window.dispatchEvent(
    new CustomEvent("mozg:canvas-style-eyedropper-start", {
      detail: { id },
    }),
  );
}

function TextSelectionToolbar''',
          )

          sub(
              r'(<CanvasColorPicker\s+label="Цвет фона"[\s\S]*?onCommit=\{\(backgroundColor\) => patchStyle\(\{ backgroundColor \}\)\}\s*/>)\s*(<span className=\{styles\.textToolbarDivider\} aria-hidden="true" />)',
              r'''\1
      <button
        type="button"
        className={`${styles.textToolbarButton} ${styles.styleEyedropperButton}`}
        aria-label="Пипетка"
        title="Скопировать цвет текста и фона"
        onClick={() => dispatchCanvasStyleEyedropperStart(id)}
      >
        <svg
          className={styles.styleEyedropperIcon}
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="m14.5 5.5 4-4a2.12 2.12 0 0 1 3 3l-4 4m-3-3 4 4m-4-4-9.8 9.8a2 2 0 0 0-.5.8L3 21l4.9-1.2a2 2 0 0 0 .8-.5l9.8-9.8"
            stroke="currentColor"
            strokeWidth="1.7"
            strokeLinecap="round"
            strokeLinejoin="round"
          />
        </svg>
      </button>
      \2''',
          )

          sub(
              r'(const \[touchViewportGestureActive, setTouchViewportGestureActive\] =\s*useState\(false\);)',
              r'''\1
  const [styleEyedropperSourceId, setStyleEyedropperSourceId] = useState<
    string | null
  >(null);''',
          )

          sub(
              r'(const onStyle = \(event: Event\) => \{[\s\S]*?if \(detail\.id && detail\.patch\) updateTextStyle\(detail\.id, detail\.patch\);\s*\};)\s*(window\.addEventListener\("mozg:canvas-text-edit", onEdit\);)',
              r'''\1
    const onEyedropperStart = (event: Event) => {
      const id = (event as CustomEvent<{ id?: string }>).detail?.id;
      if (id) setStyleEyedropperSourceId(id);
    };
    \2''',
          )

          sub(
              r'(window\.addEventListener\("mozg:canvas-text-style", onStyle\);)',
              r'''\1
    window.addEventListener(
      "mozg:canvas-style-eyedropper-start",
      onEyedropperStart,
    );''',
          )

          sub(
              r'(window\.removeEventListener\("mozg:canvas-text-style", onStyle\);)\s*(\};\s*\}, \[commitTextNode, setTextEditing, updateTextStyle\]\);)',
              r'''\1
      window.removeEventListener(
        "mozg:canvas-style-eyedropper-start",
        onEyedropperStart,
      );
    \2

  useEffect(() => {
    if (!styleEyedropperSourceId) return;
    const cancelOnEscape = (event: KeyboardEvent): void => {
      if (event.key !== "Escape") return;
      event.preventDefault();
      setStyleEyedropperSourceId(null);
    };
    window.addEventListener("keydown", cancelOnEscape);
    return () => window.removeEventListener("keydown", cancelOnEscape);
  }, [styleEyedropperSourceId]);''',
          )

          sub(
              r'(const handleCanvasPointerDown = useCallback\(\s*\(event: ReactPointerEvent<HTMLDivElement>\) => \{)\s*(if \(event\.pointerType === "touch"\) \{)',
              r'''\1
      if (styleEyedropperSourceId && event.button === 0) {
        const targetElement =
          event.target instanceof Element
            ? event.target.closest<HTMLElement>(".react-flow__node")
            : null;
        if (!targetElement) {
          setStyleEyedropperSourceId(null);
        } else {
          event.preventDefault();
          event.stopPropagation();
          const sourceId = styleEyedropperSourceId;
          const targetId = targetElement.dataset.id;
          if (!targetId || targetId === sourceId) return;
          const sourceNode = nodesRef.current.find((node) => node.id === sourceId);
          const targetNode = nodesRef.current.find((node) => node.id === targetId);
          if (
            sourceNode?.type !== CANVAS_TEXT_NODE_TYPE ||
            targetNode?.type !== CANVAS_TEXT_NODE_TYPE
          )
            return;
          updateTextStyle(sourceId, {
            color: targetNode.data.style.color,
            backgroundColor: targetNode.data.style.backgroundColor,
          });
          setStyleEyedropperSourceId(null);
          return;
        }
      }
      \2''',
          )

          sub(
              r'\[beginTouchViewportGesture, cancelPanInertia, reactFlow\],\s*\);',
              '''[
      beginTouchViewportGesture,
      cancelPanInertia,
      reactFlow,
      styleEyedropperSourceId,
      updateTextStyle,
    ],
  );''',
          )

          sub(
              r'className=\{`\$\{styles\.canvas\} \$\{dropActive \? styles\.dropActive : ""\}`\}',
              'className={`${styles.canvas} ${dropActive ? styles.dropActive : ""} ${styleEyedropperSourceId ? styles.canvasStyleEyedropperActive : ""}`}',
              count=2,
          )

          shell_path.write_text(text)

          css_path = Path("src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css")
          css = css_path.read_text()
          marker = ".textToolbarButton:disabled {\n  color: #a8a29e;\n  cursor: default;\n}\n"
          if marker not in css:
              raise SystemExit("CSS marker not found")
          css = css.replace(
              marker,
              marker + '''.styleEyedropperButton {
  display: grid;
  place-items: center;
}
.styleEyedropperIcon {
  width: 16px;
  height: 16px;
}
.canvasStyleEyedropperActive,
.canvasStyleEyedropperActive :global(.react-flow__node) {
  cursor: crosshair !important;
}
.canvasStyleEyedropperActive .styleEyedropperButton {
  background: #e7e5e4;
  color: #0f766e;
}
''',
              1,
          )
          css_path.write_text(css)
          PY
          pnpm exec prettier --write \
            src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx \
            src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css \
            tests/canvas-style-eyedropper-runtime.test.ts
          git diff --check
      - name: Validate eyedropper
        run: |
          pnpm exec vitest run \
            tests/canvas-style-eyedropper-runtime.test.ts \
            tests/canvas-custom-color-picker-runtime.test.ts \
            tests/canvas-miro-text-toolbar-runtime.test.ts \
            tests/canvas-alt-drag-duplicate.test.ts
          pnpm lint
          pnpm typecheck
      - name: Commit implementation and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-canvas-style-eyedropper.yml
          git add \
            src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx \
            src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css \
            tests/canvas-style-eyedropper-runtime.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Canvas: add text style eyedropper"
          git push origin HEAD:feat/canvas-custom-color-picker
