name: Format Canvas Cache Helper Once

on:
  push:
    branches:
      - fix/canvas-active-asset-lifecycle

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[canvas-helper-formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canvas-active-asset-lifecycle
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/lib/canvas/canvas-runtime-cache-reconciliation.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/canvas/canvas-runtime-cache-reconciliation.ts
          git diff --cached --quiet && exit 0
          git commit -m "Format Canvas cache helper [canvas-helper-formatted]"
          git push origin HEAD:fix/canvas-active-asset-lifecycle
