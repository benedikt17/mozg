name: Canvas copy paste format

on:
  push:
    branches:
      - agent/canvas-miro-copy-paste
    paths:
      - .github/workflows/canvas-copy-paste-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/lib/canvas/canvas-node-clipboard.ts
      - name: Commit formatted file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/canvas/canvas-node-clipboard.ts
          git diff --cached --quiet || git commit -m "Format Canvas node clipboard"
          git push
