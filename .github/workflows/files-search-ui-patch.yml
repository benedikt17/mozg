name: Files Search UX Patch

on:
  push:
    branches:
      - feature/files-content-search
    paths:
      - .github/workflows/files-search-ui-patch.yml
      - scripts/files-search-ui-patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/files-search-ui-patch.py
      - run: pnpm exec prettier --write src/prototype/files/files-workspace.tsx src/lib/files/project-file-search-client.ts src/lib/files/project-file-search-client.test.ts src/app/api/files/search/index/route.ts
      - run: pnpm exec vitest run src/lib/files/project-file-search-content.test.ts src/lib/files/project-file-search-client.test.ts src/prototype/files/files-workspace.test.ts
      - name: Commit UX patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/files/files-workspace.tsx src/lib/files/project-file-search-client.ts src/lib/files/project-file-search-client.test.ts src/app/api/files/search/index/route.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(files): finish content search UX"
          git push origin HEAD:feature/files-content-search
