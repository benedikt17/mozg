name: Stage 4.2 self patch

on:
  push:
    branches:
      - agent/stage4-2-knowledge-mdast-integration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage4-2-knowledge-mdast-integration
      - name: Apply exact MDAST integration codemod
        run: python scripts/stage4-2-mdast-integration.py
      - name: Verify patch whitespace
        run: git diff --check
      - name: Commit materialized integration
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/state/knowledge-state.ts src/prototype/knowledge/markdown-document-preview.tsx
          git commit -m "refactor: derive Knowledge structure from MDAST"
          git push
