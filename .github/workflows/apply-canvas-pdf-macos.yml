name: Apply Canvas PDF feature macOS

on:
  push:
    branches:
      - feature/canvas-pdf-split-view

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canvas-pdf-split-view
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Extract and apply product patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-canvas-pdf.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/apply-canvas-pdf.py').write_text(script)
          PY
          python /tmp/apply-canvas-pdf.py
      - name: Format product files
        shell: bash
        run: |
          pnpm exec prettier --write \
            src/lib/canvas/canvas-document.ts \
            src/lib/canvas/react-flow-canvas-adapter.ts \
            src/lib/canvas/canvas-node-clipboard.ts \
            src/prototype/canvases/canvas-project-file-picker.tsx \
            src/prototype/canvases/canvas-desktop-composition.tsx \
            src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx \
            src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css \
            supabase/migrations/20260826160000_canvas_pdf_nodes.sql \
            tests/canvas-document-v2.test.ts
      - run: git diff --check
      - run: pnpm test -- tests/canvas-document-v2.test.ts tests/canvas-node-clipboard.test.ts
      - run: pnpm typecheck
      - name: Commit product changes and remove bootstrap files
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-canvas-pdf.yml \
            .github/workflows/apply-canvas-pdf-macos.yml \
            .tmp-canvas-pdf-trigger \
            .tmp-ready-trigger
          git checkout origin/refactor/prototype-state-root -- .github/workflows/ci.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add PDF nodes and split reader to Canvas"
          git push origin HEAD:feature/canvas-pdf-split-view
