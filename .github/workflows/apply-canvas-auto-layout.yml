name: Apply Canvas Auto Layout

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canvas-auto-layout
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch and format Canvas auto layout
        shell: bash
        run: |
          echo '' | base64 -d | python
          pnpm exec prettier --write \
            src/lib/canvas/canvas-auto-layout.ts \
            src/prototype/canvases/canvas-auto-layout-button.tsx \
            src/prototype/canvases/canvas-desktop-composition.tsx \
            tests/canvas-auto-layout.test.ts
          git diff --check
      - name: Commit Canvas auto layout patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/lib/canvas/canvas-auto-layout.ts \
            src/prototype/canvases/canvas-auto-layout-button.tsx \
            src/prototype/canvases/canvas-desktop-composition.tsx \
            tests/canvas-auto-layout.test.ts
          git commit -m "feat: wire Canvas auto layout toolbar"
          git push origin HEAD:feat/canvas-auto-layout
