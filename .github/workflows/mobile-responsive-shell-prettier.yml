name: Mobile responsive shell prettier

on:
  push:
    branches:
      - feat/mobile-responsive-shell

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-responsive-shell
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/mobile-responsive-shell.test.ts
      - run: pnpm exec prettier --check tests/mobile-responsive-shell.test.ts
      - run: pnpm exec vitest run tests/mobile-responsive-shell.test.ts
      - name: Commit format
        run: |
          rm .github/workflows/mobile-responsive-shell-prettier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Mobile: format shell regression"
          git push origin HEAD:feat/mobile-responsive-shell
