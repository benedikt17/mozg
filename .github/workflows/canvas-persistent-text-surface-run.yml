name: Canvas persistent text surface runner

on:
  push:
    branches:
      - agent/canvas-miro-editing-selection-polish
    paths:
      - .github/workflows/canvas-persistent-text-surface-run.yml
      - .github/scripts/apply_canvas_persistent_text_surface.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canvas-miro-editing-selection-polish
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python .github/scripts/apply_canvas_persistent_text_surface.py
      - run: pnpm exec prettier --write src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css src/prototype/infinite-canvas-local-shell/canvas-node-frame.tsx tests/canvas-miro-text-editing-runtime.test.ts
      - run: pnpm exec vitest run tests/canvas-miro-text-editing-runtime.test.ts
      - run: pnpm typecheck
      - run: git diff --check
      - name: Commit patch
        run: |
          rm -f .github/workflows/canvas-persistent-text-surface-fix.yml
          rm -f .github/workflows/canvas-persistent-text-surface-pr-fix.yml
          rm -f .github/workflows/canvas-persistent-text-surface-run.yml
          rm -f .github/scripts/apply_canvas_persistent_text_surface.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Canvas: edit text on one persistent surface"
          git push origin HEAD:agent/canvas-miro-editing-selection-polish
