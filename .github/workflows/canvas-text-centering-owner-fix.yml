name: Canvas text centering owner fix

on:
  pull_request:
    branches:
      - refactor/prototype-state-root
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 49 && github.event.pull_request.head.ref == 'agent/canvas-miro-editing-selection-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canvas-miro-editing-selection-polish
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply exact centering fix
        shell: python
        run: |
          from pathlib import Path

          shell_path = Path("src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx")
          text = shell_path.read_text()
          old = "    <textarea\n      ref={inputRef}\n      value={draft}"
          new = "    <textarea\n      ref={inputRef}\n      rows={1}\n      value={draft}"
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one CanvasTextEditor textarea anchor, found {text.count(old)}")
          shell_path.write_text(text.replace(old, new, 1))

          test_path = Path("tests/canvas-miro-text-editing-runtime.test.ts")
          test = test_path.read_text()
          old_test = '    expect(shell).toContain("input.setSelectionRange(caret, caret)");\n    expect(frame).not.toContain("withCenteredTextContent");'
          new_test = '    expect(shell).toContain("input.setSelectionRange(caret, caret)");\n    expect(shell).toContain("rows={1}");\n    expect(frame).not.toContain("withCenteredTextContent");'
          if test.count(old_test) != 1:
              raise SystemExit(f"Expected exactly one text-editing test anchor, found {test.count(old_test)}")
          test_path.write_text(test.replace(old_test, new_test, 1))

      - name: Format touched files
        run: npx prettier --write src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx tests/canvas-miro-text-editing-runtime.test.ts

      - name: Run focused regression test
        run: npx vitest run tests/canvas-miro-text-editing-runtime.test.ts

      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/canvas-text-centering-owner-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx tests/canvas-miro-text-editing-runtime.test.ts .github/workflows/canvas-text-centering-owner-fix.yml
          git diff --cached --check
          git commit -m "Canvas: keep text centered when editing"
          git push origin HEAD:agent/canvas-miro-editing-selection-polish
