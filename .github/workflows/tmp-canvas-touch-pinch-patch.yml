name: Temporary Canvas touch pinch patch

on:
  push:
    branches:
      - fix/canvas-touch-pinch-priority

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canvas-touch-pinch-priority
          fetch-depth: 0

      - name: Apply focused Canvas touch patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          shell_path = Path("src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx")
          text = shell_path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          helper_anchor = '''function autoAttachCanvasEdge(
          '''
          helper = '''function snapshotCanvasTouchGestureNodes(
            nodes: readonly CanvasFlowNode[],
          ): CanvasFlowNode[] {
            return nodes.map((node) => ({
              ...node,
              position: { ...node.position },
              ...(node.measured ? { measured: { ...node.measured } } : {}),
              ...(node.style ? { style: { ...node.style } } : {}),
            }));
          }

          function autoAttachCanvasEdge(
          '''
          replace_once(helper_anchor, helper)

          refs_old = '''  const nodeGeometrySignatureRef = useRef("");
            const nodeDragActiveRef = useRef(false);
            const middlePanActiveRef = useRef(false);
            const panSamplesRef = useRef<CanvasPanSample[]>([]);
          '''
          refs_new = '''  const nodeGeometrySignatureRef = useRef("");
            const nodeDragActiveRef = useRef(false);
            const middlePanActiveRef = useRef(false);
            const activeTouchPointersRef = useRef(new Set<number>());
            const touchGestureNodesRef = useRef<CanvasFlowNode[] | null>(null);
            const touchViewportGestureActiveRef = useRef(false);
            const panSamplesRef = useRef<CanvasPanSample[]>([]);
          '''
          replace_once(refs_old, refs_new)

          state_old = '''  const [desktopSidebarOpen, setDesktopSidebarOpen] = useState(true);
            useEffect(() => {
              if (!window.matchMedia("(max-width: 767px)").matches) return;
              const frame = window.requestAnimationFrame(() => {
                setDesktopSidebarOpen(false);
              });
              return () => window.cancelAnimationFrame(frame);
            }, []);
            const [flowInstanceEpoch, setFlowInstanceEpoch] = useState(0);
          '''
          state_new = '''  const [desktopSidebarOpen, setDesktopSidebarOpen] = useState(true);
            const [touchPrimaryInput, setTouchPrimaryInput] = useState(false);
            const [touchViewportGestureActive, setTouchViewportGestureActive] =
              useState(false);
            useEffect(() => {
              if (!window.matchMedia("(max-width: 767px)").matches) return;
              const frame = window.requestAnimationFrame(() => {
                setDesktopSidebarOpen(false);
              });
              return () => window.cancelAnimationFrame(frame);
            }, []);
            useEffect(() => {
              const media = window.matchMedia("(pointer: coarse)");
              const syncPrimaryTouchInput = (): void => {
                setTouchPrimaryInput(media.matches);
              };
              syncPrimaryTouchInput();
              media.addEventListener("change", syncPrimaryTouchInput);
              return () => media.removeEventListener("change", syncPrimaryTouchInput);
            }, []);
            const [flowInstanceEpoch, setFlowInstanceEpoch] = useState(0);
          '''
          replace_once(state_old, state_new)

          connect_old = '''  const handleConnect = useCallback(
              (connection: Connection) => {
                const edge = createCanvasEdgeFromConnection(connection);
          '''
          connect_new = '''  const handleConnect = useCallback(
              (connection: Connection) => {
                if (touchViewportGestureActiveRef.current) return;
                const edge = createCanvasEdgeFromConnection(connection);
          '''
          replace_once(connect_old, connect_new)

          drag_start_old = '''  const handleNodeDragStart = useCallback((): void => {
              nodeDragActiveRef.current = true;
              edgeRemovalSuppressionUntilRef.current = Date.now() + 5000;
            }, []);
          '''
          drag_start_new = '''  const handleNodeDragStart = useCallback((): void => {
              if (touchViewportGestureActiveRef.current) return;
              nodeDragActiveRef.current = true;
              edgeRemovalSuppressionUntilRef.current = Date.now() + 5000;
            }, []);
          '''
          replace_once(drag_start_old, drag_start_new)

          drag_stop_old = '''  const handleNodeDragStop = useCallback((): void => {
              nodeDragActiveRef.current = false;
              edgeRemovalSuppressionUntilRef.current = Date.now() + 5000;
              window.setTimeout(() => {
          '''
          drag_stop_new = '''  const handleNodeDragStop = useCallback((): void => {
              nodeDragActiveRef.current = false;
              edgeRemovalSuppressionUntilRef.current = Date.now() + 5000;
              if (touchViewportGestureActiveRef.current) return;
              window.setTimeout(() => {
          '''
          replace_once(drag_stop_old, drag_stop_new)

          start = text.index("  const handleNodesChange = useCallback(")
          end = text.index("\n  const onDrop = useCallback(", start)
          block = text[start:end]
          callback_old = '''    (changes: NodeChange<CanvasFlowNode>[]) => {
          '''
          callback_new = '''    (changes: NodeChange<CanvasFlowNode>[]) => {
                const guardedChanges = touchViewportGestureActiveRef.current
                  ? changes.filter(
                      (change) =>
                        change.type !== "position" && change.type !== "dimensions",
                    )
                  : changes;
                if (guardedChanges.length === 0) return;
          '''
          if block.count(callback_old) != 1:
              raise SystemExit("handleNodesChange callback signature drifted")
          block = block.replace(callback_old, callback_new, 1)
          block = block.replace("changes.some(", "guardedChanges.some(")
          block = block.replace("changes.filter(", "guardedChanges.filter(")
          block = block.replace("onNodesChange(changes);", "onNodesChange(guardedChanges);")
          block = block.replace(
              "            changes,\n          ),",
              "            guardedChanges,\n          ),",
          )
          text = text[:start] + block + text[end:]

          pointer_anchor = '''  const handleCanvasPointerDown = useCallback(
              (event: ReactPointerEvent<HTMLDivElement>) => {
                cancelPanInertia(true);
                if (event.button !== 1) return;
          '''
          pointer_replacement = '''  const beginTouchViewportGesture = useCallback((): void => {
              if (touchViewportGestureActiveRef.current) return;
              touchViewportGestureActiveRef.current = true;
              setTouchViewportGestureActive(true);

              const snapshot = touchGestureNodesRef.current;
              if (snapshot) {
                nodesRef.current = snapshot;
                setNodes(snapshot);
              }
              const canonicalEdges = canvasDocumentToEdges(
                controller.state.document,
                handleEdgeUpdate,
              );
              edgesRef.current = canonicalEdges;
              setEdges(canonicalEdges);
            }, [controller, handleEdgeUpdate, setEdges, setNodes]);

            const handleCanvasPointerDown = useCallback(
              (event: ReactPointerEvent<HTMLDivElement>) => {
                if (event.pointerType === "touch") {
                  const activeTouchPointers = activeTouchPointersRef.current;
                  if (activeTouchPointers.size === 0) {
                    touchGestureNodesRef.current = snapshotCanvasTouchGestureNodes(
                      nodesRef.current,
                    );
                  }
                  activeTouchPointers.add(event.pointerId);
                  if (activeTouchPointers.size >= 2) beginTouchViewportGesture();
                }
                cancelPanInertia(true);
                if (event.button !== 1) return;
          '''
          replace_once(pointer_anchor, pointer_replacement)

          pointer_deps_old = '''    [cancelPanInertia, reactFlow],
            );

            const handleCanvasPointerMove = useCallback(
          '''
          pointer_deps_new = '''    [beginTouchViewportGesture, cancelPanInertia, reactFlow],
            );

            const handleCanvasPointerMove = useCallback(
          '''
          replace_once(pointer_deps_old, pointer_deps_new)

          pointer_effect_old = '''  useEffect(() => {
              const onPointerUp = (event: PointerEvent): void => {
                if (event.button !== 1 || !middlePanActiveRef.current) return;
                middlePanActiveRef.current = false;
                const velocity = canvasPanReleaseVelocity(panSamplesRef.current);
                panSamplesRef.current = [];
                if (velocity) startPanInertia(velocity);
                else commitViewportMove(reactFlow.getViewport());
              };
              const onPointerCancel = (): void => {
                if (!middlePanActiveRef.current) return;
                middlePanActiveRef.current = false;
                panSamplesRef.current = [];
                commitViewportMove(reactFlow.getViewport());
              };
          '''
          pointer_effect_new = '''  useEffect(() => {
              const releaseTouchPointer = (event: PointerEvent): void => {
                if (event.pointerType !== "touch") return;
                activeTouchPointersRef.current.delete(event.pointerId);
                if (activeTouchPointersRef.current.size > 0) return;
                window.requestAnimationFrame(() => {
                  if (activeTouchPointersRef.current.size > 0) return;
                  touchGestureNodesRef.current = null;
                  if (!touchViewportGestureActiveRef.current) return;
                  touchViewportGestureActiveRef.current = false;
                  setTouchViewportGestureActive(false);
                });
              };
              const onPointerUp = (event: PointerEvent): void => {
                releaseTouchPointer(event);
                if (event.button !== 1 || !middlePanActiveRef.current) return;
                middlePanActiveRef.current = false;
                const velocity = canvasPanReleaseVelocity(panSamplesRef.current);
                panSamplesRef.current = [];
                if (velocity) startPanInertia(velocity);
                else commitViewportMove(reactFlow.getViewport());
              };
              const onPointerCancel = (event: PointerEvent): void => {
                releaseTouchPointer(event);
                if (!middlePanActiveRef.current) return;
                middlePanActiveRef.current = false;
                panSamplesRef.current = [];
                commitViewportMove(reactFlow.getViewport());
              };
          '''
          replace_once(pointer_effect_old, pointer_effect_new)

          props_old = '''            panOnDrag={[1]}
                      selectionOnDrag
                      selectionMode={SelectionMode.Partial}
          '''
          props_new = '''            panOnDrag={touchPrimaryInput ? [0, 1] : [1]}
                      selectionOnDrag={!touchPrimaryInput}
                      selectionMode={SelectionMode.Partial}
                      nodesDraggable={!touchViewportGestureActive}
                      nodesConnectable={!touchViewportGestureActive}
                      elementsSelectable={!touchViewportGestureActive}
                      nodeDragThreshold={touchPrimaryInput ? 8 : 1}
                      zoomOnPinch
          '''
          count = text.count(props_old)
          if count != 2:
              raise SystemExit(f"expected two ReactFlow interaction blocks, found {count}")
          text = text.replace(props_old, props_new)

          pane_old = '''            onPaneClick={(event) => {
                        if (event.detail !== 2) return;
          '''
          pane_new = '''            onPaneClick={(event) => {
                        if (touchViewportGestureActiveRef.current || event.detail !== 2)
                          return;
          '''
          count = text.count(pane_old)
          if count != 2:
              raise SystemExit(f"expected two pane-click blocks, found {count}")
          text = text.replace(pane_old, pane_new)

          shell_path.write_text(text)

          test_path = Path("tests/canvas-miro-selection-runtime.test.ts")
          test_path.write_text('''import fs from "node:fs";\nimport path from "node:path";\nimport { describe, expect, it } from "vitest";\n\nconst shellPath = path.resolve(\n  process.cwd(),\n  "src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx",\n);\nconst shellCssPath = path.resolve(\n  process.cwd(),\n  "src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css",\n);\n\nfunction readShell(): string {\n  return fs.readFileSync(shellPath, "utf8");\n}\n\ndescribe("Canvas Miro-style selection interaction", () => {\n  it("keeps desktop marquee/MMB behavior while coarse touch uses one-finger pane pan", () => {\n    const source = readShell();\n\n    expect(source).toContain("SelectionMode,");\n    expect(source).toContain('window.matchMedia("(pointer: coarse)")');\n    expect(\n      source.match(/panOnDrag=\\{touchPrimaryInput \\? \\[0, 1\\] : \\[1\\]\\}/g),\n    ).toHaveLength(2);\n    expect(\n      source.match(/selectionOnDrag=\\{!touchPrimaryInput\\}/g),\n    ).toHaveLength(2);\n    expect(\n      source.match(/selectionMode=\\{SelectionMode\\.Partial\\}/g),\n    ).toHaveLength(2);\n    expect(\n      source.match(/nodeDragThreshold=\\{touchPrimaryInput \\? 8 : 1\\}/g),\n    ).toHaveLength(2);\n  });\n\n  it("gives a two-touch viewport gesture priority over node mutation", () => {\n    const source = readShell();\n\n    expect(source).toContain("activeTouchPointersRef");\n    expect(source).toContain("snapshotCanvasTouchGestureNodes");\n    expect(source).toContain("touchViewportGestureActiveRef.current = true");\n    expect(source).toContain('event.pointerType === "touch"');\n    expect(source).toContain('change.type !== "position" && change.type !== "dimensions"');\n    expect(\n      source.match(/nodesDraggable=\\{!touchViewportGestureActive\\}/g),\n    ).toHaveLength(2);\n    expect(\n      source.match(/nodesConnectable=\\{!touchViewportGestureActive\\}/g),\n    ).toHaveLength(2);\n    expect(\n      source.match(/elementsSelectable=\\{!touchViewportGestureActive\\}/g),\n    ).toHaveLength(2);\n    expect(source.match(/zoomOnPinch/g)).toHaveLength(2);\n    expect(source).toContain("window.requestAnimationFrame(() => {");\n  });\n\n  it("keeps the arrow cursor while dragging a multi-selection", () => {\n    const css = fs.readFileSync(shellCssPath, "utf8");\n\n    expect(css).toContain(".react-flow__nodesselection-rect");\n    expect(css).toContain("cursor: default !important");\n  });\n\n  it("does not re-enable unconditional pointer-drag panning", () => {\n    const source = readShell();\n\n    expect(source).not.toContain("panOnDrag={true}");\n    expect(source).not.toContain("panOnDrag={false}");\n  });\n});\n''')
          PY

          rm .github/workflows/tmp-canvas-touch-pinch-patch.yml
          git diff --check
          git status --short

      - name: Commit focused patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx tests/canvas-miro-selection-runtime.test.ts .github/workflows/tmp-canvas-touch-pinch-patch.yml
          git commit -m "Fix Canvas touch pinch gesture priority"
          git push origin HEAD:fix/canvas-touch-pinch-priority
