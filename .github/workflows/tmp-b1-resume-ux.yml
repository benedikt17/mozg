name: tmp-b1-resume-ux

on:
  push:
    branches:
      - feat/project-files-b1-resumable-uploads

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch B1 reload resume UX
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          # Repository contract: pending files are a first-class read path.
          path = Path('src/lib/files/project-file-repository.ts')
          text = path.read_text()
          old = '''  listFiles(input: ListProjectFilesInput): Promise<ProjectFileRecord[]>;\n  getFile(\n'''
          new = '''  listFiles(input: ListProjectFilesInput): Promise<ProjectFileRecord[]>;\n  listPendingFiles(\n    input: ProjectFileScope & { folderId?: string | null },\n  ): Promise<ProjectFileRecord[]>;\n  getFile(\n'''
          if old not in text:
            raise SystemExit('repository interface marker missing')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # Cloud repository: list only the current user's pending uploads and allow
          # explicit reuse of an existing pending reservation by file_id.
          path = Path('src/lib/files/cloud-project-file-repository.ts')
          text = path.read_text()
          marker = '\n  async getFile(\n'
          if marker not in text:
            raise SystemExit('getFile marker missing')
          pending_method = '''\n  async listPendingFiles(\n    input: ProjectFileScope & { folderId?: string | null },\n  ): Promise<ProjectFileRecord[]> {\n    try {\n      await this.assertAuthenticated();\n      const userId = this.authenticatedUserId;\n      if (!userId) {\n        throw new CloudProjectFileRepositoryError(\n          "unauthenticated",\n          "Project Files requires an authenticated session.",\n        );\n      }\n      const scope = projectFileScope(input);\n      let query = this.supabase\n        .from("project_files")\n        .select(PROJECT_FILE_SELECT)\n        .eq("workspace_id", scope.workspaceId)\n        .eq("project_id", scope.projectId)\n        .eq("created_by", userId)\n        .is("ready_at", null)\n        .is("deleted_at", null);\n      if (input.folderId !== undefined) {\n        const folderId = projectFileFolderId(input.folderId);\n        query =\n          folderId === null\n            ? query.is("folder_id", null)\n            : query.eq("folder_id", folderId);\n      }\n      const { data, error } = await query.order("created_at", {\n        ascending: false,\n      });\n      if (error) throw error;\n      return (data ?? []).map((row) => mapProjectFile(row, scope));\n    } catch (cause) {\n      throw projectFileRepositoryError(cause, "metadata");\n    }\n  }\n'''
          text = text.replace(marker, pending_method + marker, 1)

          start = text.index('      let reserved: ProjectFileRecord | null = null;\n      if (transport === "resumable") {')
          end = text.index('\n\n      if (!reserved) {', start)
          replacement = '''      let reserved: ProjectFileRecord | null = null;\n      if (transport === "resumable") {\n        const resumeKey = validated.resumeKey?.trim();\n        if (!this.resumableUploadEndpoint || !resumeKey) {\n          throw new CloudProjectFileRepositoryError(\n            "invalid-input",\n            "Resumable Project file upload is not configured.",\n          );\n        }\n\n        resumableReservationKey = projectFileResumableReservationKey({\n          ...scope,\n          folderId: validated.folderId,\n          resumeKey,\n        });\n\n        if (input.fileId) {\n          const explicitReservation = await this.findProjectFileReservation(\n            scope,\n            validated.fileId,\n          );\n          if (explicitReservation) {\n            if (!projectFileReservationMatches(explicitReservation, validated)) {\n              throw new CloudProjectFileRepositoryError(\n                "invalid-input",\n                "The selected file does not match the pending upload.",\n              );\n            }\n            if (explicitReservation.deletedAt !== null) {\n              throw new CloudProjectFileRepositoryError(\n                "invalid-input",\n                "The pending upload is no longer active.",\n              );\n            }\n            if (explicitReservation.readyAt !== null) {\n              this.removeResumableFileId(resumableReservationKey);\n              return explicitReservation;\n            }\n            reserved = explicitReservation;\n          }\n        }\n\n        if (!reserved) {\n          const previousFileId = this.readResumableFileId(\n            resumableReservationKey,\n          );\n          if (previousFileId) {\n            const previous = await this.findProjectFileReservation(\n              scope,\n              previousFileId,\n            );\n            if (previous && projectFileReservationMatches(previous, validated)) {\n              if (previous.readyAt !== null && previous.deletedAt === null) {\n                this.removeResumableFileId(resumableReservationKey);\n                return previous;\n              }\n              if (previous.readyAt === null && previous.deletedAt === null) {\n                reserved = previous;\n              }\n            }\n            if (!reserved) {\n              this.removeResumableFileId(resumableReservationKey);\n            }\n          }\n        }\n      }'''
          text = text[:start] + replacement + text[end:]

          marker = '''      reservedForCancellation = reserved;\n'''
          if marker not in text:
            raise SystemExit('reservation final marker missing')
          text = text.replace(
            marker,
            '''      if (resumableReservationKey) {\n        this.writeResumableFileId(resumableReservationKey, reserved.id);\n      }\n\n''' + marker,
            1,
          )
          path.write_text(text)

          # Recover the original browser resume identity from our reservation map.
          path = Path('src/lib/files/project-file-resumable-upload.ts')
          text = path.read_text()
          marker = '''export function projectFileTusFingerprint(input: {\n'''
          if marker not in text:
            raise SystemExit('tus fingerprint marker missing')
          helper = '''export function findProjectFileResumableResumeKey(\n  input: {\n    workspaceId: string;\n    projectId: string;\n    folderId: string | null;\n    fileId: string;\n  },\n  storage?: Pick<Storage, "getItem" | "key" | "length"> | null,\n): string | null {\n  const resolvedStorage =\n    storage === undefined\n      ? (getProjectFileResumableReservationStorage() as Storage | null)\n      : storage;\n  if (!resolvedStorage) return null;\n\n  const prefix =\n    [\n      "mozg:project-files:resumable:v1",\n      input.workspaceId,\n      encodeURIComponent(input.projectId),\n      input.folderId ?? "inbox",\n    ].join(":") + ":";\n\n  for (let index = 0; index < resolvedStorage.length; index += 1) {\n    const key = resolvedStorage.key(index);\n    if (!key || !key.startsWith(prefix)) continue;\n    if (resolvedStorage.getItem(key) !== input.fileId) continue;\n    try {\n      return decodeURIComponent(key.slice(prefix.length));\n    } catch {\n      return null;\n    }\n  }\n  return null;\n}\n\n'''
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)

          # Unit coverage for persisted resume identity lookup.
          path = Path('src/lib/files/project-file-resumable-upload.test.ts')
          text = path.read_text()
          text = text.replace(
            '''import {\n  projectFileResumableReservationKey,\n''',
            '''import {\n  findProjectFileResumableResumeKey,\n  projectFileResumableReservationKey,\n''',
            1,
          )
          marker = '''  it("binds the TUS fingerprint to the immutable reserved file id", () => {\n'''
          if marker not in text:
            raise SystemExit('resumable test marker missing')
          test = '''  it("recovers the persisted resume key for the same pending reservation", () => {\n    const key = projectFileResumableReservationKey({\n      workspaceId,\n      projectId: "project-a",\n      folderId: null,\n      resumeKey,\n    });\n    const values = new Map([[key, fileId]]);\n    const keys = [...values.keys()];\n    const storage = {\n      get length() {\n        return keys.length;\n      },\n      getItem: (candidate: string) => values.get(candidate) ?? null,\n      key: (index: number) => keys[index] ?? null,\n    };\n\n    expect(\n      findProjectFileResumableResumeKey(\n        {\n          workspaceId,\n          projectId: "project-a",\n          folderId: null,\n          fileId,\n        },\n        storage,\n      ),\n    ).toBe(resumeKey);\n  });\n\n'''
          text = text.replace(marker, test + marker, 1)
          path.write_text(text)

          # Files workspace: load pending uploads, render a visible resume row and
          # keep progress in an explicit grid row.
          path = Path('src/prototype/files/files-workspace.tsx')
          text = path.read_text()
          text = text.replace(
            '''import { projectFileResumableUploadEndpoint } from "@/lib/files/project-file-resumable-upload";\n''',
            '''import {\n  findProjectFileResumableResumeKey,\n  projectFileResumableUploadEndpoint,\n} from "@/lib/files/project-file-resumable-upload";\n''',
            1,
          )
          text = text.replace(
            '''  const uploadInputRef = useRef<HTMLInputElement>(null);\n  const uploadAbortControllerRef = useRef<AbortController | null>(null);\n  const [folders, setFolders] = useState<ProjectFolderRecord[]>([]);\n  const [files, setFiles] = useState<ProjectFileRecord[]>([]);\n''',
            '''  const uploadInputRef = useRef<HTMLInputElement>(null);\n  const resumeInputRef = useRef<HTMLInputElement>(null);\n  const resumeTargetFileRef = useRef<ProjectFileRecord | null>(null);\n  const uploadAbortControllerRef = useRef<AbortController | null>(null);\n  const [folders, setFolders] = useState<ProjectFolderRecord[]>([]);\n  const [files, setFiles] = useState<ProjectFileRecord[]>([]);\n  const [pendingFiles, setPendingFiles] = useState<ProjectFileRecord[]>([]);\n''',
            1,
          )

          old = '''    const filesPromise =\n      location.kind === "trash"\n        ? repository\n            .listFiles({ ...scope, includeDeleted: true })\n            .then((rows) => rows.filter((file) => file.deletedAt !== null))\n        : repository.listFiles({\n            ...scope,\n            ...(trimmedQuery\n              ? { query: trimmedQuery }\n              : { folderId: activeFolderId }),\n          });\n\n    void Promise.all([repository.listFolders(scope), filesPromise])\n      .then(([nextFolders, nextFiles]) => {\n'''
          new = '''    const filesPromise =\n      location.kind === "trash"\n        ? repository\n            .listFiles({ ...scope, includeDeleted: true })\n            .then((rows) => rows.filter((file) => file.deletedAt !== null))\n        : repository.listFiles({\n            ...scope,\n            ...(trimmedQuery\n              ? { query: trimmedQuery }\n              : { folderId: activeFolderId }),\n          });\n    const pendingFilesPromise =\n      location.kind === "trash" || trimmedQuery\n        ? Promise.resolve<ProjectFileRecord[]>([])\n        : repository.listPendingFiles({\n            ...scope,\n            folderId: activeFolderId,\n          });\n\n    void Promise.all([\n      repository.listFolders(scope),\n      filesPromise,\n      pendingFilesPromise,\n    ])\n      .then(([nextFolders, nextFiles, nextPendingFiles]) => {\n'''
          if old not in text:
            raise SystemExit('workspace load marker missing')
          text = text.replace(old, new, 1)
          text = text.replace(
            '''        setFolders(nextFolders);\n        setFiles(nextFiles);\n''',
            '''        setFolders(nextFolders);\n        setFiles(nextFiles);\n        setPendingFiles(nextPendingFiles);\n''',
            1,
          )
          text = text.replace(
            '''        setFolders([]);\n        setFiles([]);\n        setSelectedFileId(null);\n''',
            '''        setFolders([]);\n        setFiles([]);\n        setPendingFiles([]);\n        setSelectedFileId(null);\n''',
            1,
          )
          text = text.replace(
            '''  const hasEntries = files.length > 0;\n''',
            '''  const hasEntries = files.length > 0 || pendingFiles.length > 0;\n''',
            1,
          )

          old = '''  const uploadFiles = async (browserFiles: readonly File[]) => {\n    if (!workspaceId || !canMutate || browserFiles.length === 0) return;\n\n    setActionState("uploading");\n    setActionMessage({\n      kind: "info",\n      text:\n        browserFiles.length === 1\n          ? "Загрузка файла…"\n          : `Загрузка файлов: ${browserFiles.length}…`,\n    });\n'''
          new = '''  const uploadFiles = async (\n    browserFiles: readonly File[],\n    resumeFile?: ProjectFileRecord,\n  ) => {\n    if (!workspaceId || !canMutate || browserFiles.length === 0) return;\n    if (resumeFile && browserFiles.length !== 1) return;\n\n    setActionState("uploading");\n    setActionMessage({\n      kind: "info",\n      text: resumeFile\n        ? `Продолжение загрузки: ${resumeFile.name}…`\n        : browserFiles.length === 1\n          ? "Загрузка файла…"\n          : `Загрузка файлов: ${browserFiles.length}…`,\n    });\n'''
          if old not in text:
            raise SystemExit('uploadFiles header marker missing')
          text = text.replace(old, new, 1)

          old = '''        const prepared = await prepareProjectFileBrowserUpload(browserFile);\n        const transport = projectFileUploadTransport(prepared.byteSize);\n'''
          new = '''        const prepared = await prepareProjectFileBrowserUpload(browserFile);\n        if (resumeFile) {\n          const expectedResumeKey = findProjectFileResumableResumeKey({\n            workspaceId,\n            projectId,\n            folderId: resumeFile.folderId,\n            fileId: resumeFile.id,\n          });\n          if (\n            expectedResumeKey === null ||\n            expectedResumeKey !== prepared.resumeKey ||\n            resumeFile.name !== prepared.name ||\n            resumeFile.originalName !== prepared.originalName ||\n            resumeFile.byteSize !== prepared.byteSize ||\n            resumeFile.mimeType !== prepared.mimeType\n          ) {\n            throw new ProjectFileBrowserUploadError(\n              expectedResumeKey === null\n                ? "Не удалось найти данные незавершённой загрузки. Загрузите файл заново."\n                : "Выберите тот же исходный файл, загрузка которого была прервана.",\n            );\n          }\n        }\n        const transport = projectFileUploadTransport(prepared.byteSize);\n'''
          if old not in text:
            raise SystemExit('prepared marker missing')
          text = text.replace(old, new, 1)
          text = text.replace(
            '''          resumed: false,\n''',
            '''          resumed: Boolean(resumeFile),\n''',
            1,
          )
          old = '''        const uploaded = await repository.uploadFile({\n          workspaceId,\n          projectId,\n          folderId: activeFolderId,\n          ...prepared,\n'''
          new = '''        const uploaded = await repository.uploadFile({\n          workspaceId,\n          projectId,\n          ...(resumeFile ? { fileId: resumeFile.id } : {}),\n          folderId: resumeFile ? resumeFile.folderId : activeFolderId,\n          ...prepared,\n'''
          if old not in text:
            raise SystemExit('repository upload marker missing')
          text = text.replace(old, new, 1)
          text = text.replace(
            '''        lastUploadedFile = uploaded;\n        setFiles((current) => [\n''',
            '''        lastUploadedFile = uploaded;\n        if (resumeFile) {\n          setPendingFiles((current) =>\n            current.filter((file) => file.id !== resumeFile.id),\n          );\n        }\n        setFiles((current) => [\n''',
            1,
          )

          # Add hidden resume file picker next to the normal upload picker.
          marker = '''          <input\n            ref={uploadInputRef}\n'''
          start = text.index(marker)
          end = text.index('          />\n        </header>', start) + len('          />\n')
          normal_input = text[start:end]
          resume_input = '''          <input\n            ref={resumeInputRef}\n            accept={PROJECT_FILE_MIME_TYPES.join(",")}\n            aria-label="Выбрать исходный файл для продолжения"\n            className={styles.hiddenFileInput}\n            onChange={(event) => {\n              const browserFile = event.currentTarget.files?.[0] ?? null;\n              const resumeFile = resumeTargetFileRef.current;\n              event.currentTarget.value = "";\n              resumeTargetFileRef.current = null;\n              if (!browserFile || !resumeFile) return;\n              void uploadFiles([browserFile], resumeFile);\n            }}\n            type="file"\n          />\n'''
          text = text[:end] + resume_input + text[end:]

          text = text.replace(
            '''      <main className={styles.contentPane}>\n''',
            '''      <main\n        className={`${styles.contentPane} ${\n          activeUpload ? styles.contentPaneUploading : ""\n        }`}\n      >\n''',
            1,
          )

          # Render pending rows before ready rows.
          marker = '''              <div className={styles.entries}>\n                {files.map((file) => (\n'''
          pending_rows = '''              <div className={styles.entries}>\n                {pendingFiles.map((file) => (\n                  <div\n                    className={`${styles.entryRow} ${styles.pendingEntryRow}`}\n                    key={`pending-${file.id}`}\n                  >\n                    <span className={styles.nameCell}>\n                      <span className={styles.entryIcon} aria-hidden="true">\n                        ↻\n                      </span>\n                      <span className={styles.fileName} title={file.name}>\n                        {file.name}\n                      </span>\n                    </span>\n                    <span className={styles.pendingState}>Не завершено</span>\n                    <span>{formatProjectFileSize(file.byteSize)}</span>\n                    <button\n                      className={styles.pendingResumeButton}\n                      disabled={!canMutate}\n                      onClick={() => {\n                        resumeTargetFileRef.current = file;\n                        resumeInputRef.current?.click();\n                      }}\n                      type="button"\n                    >\n                      Продолжить\n                    </button>\n                  </div>\n                ))}\n                {files.map((file) => (\n'''
          if marker not in text:
            raise SystemExit('entries marker missing')
          text = text.replace(marker, pending_rows, 1)
          path.write_text(text)

          # CSS: explicit fourth row while uploading + pending row styling.
          path = Path('src/prototype/files/files-workspace.module.css')
          text = path.read_text()
          marker = '''.contentPane {\n  display: grid;\n  grid-template-rows: 38px 34px minmax(0, 1fr);\n  overflow: hidden;\n  background: var(--surface);\n}\n'''
          if marker not in text:
            raise SystemExit('contentPane css marker missing')
          text = text.replace(
            marker,
            marker + '''\n.contentPaneUploading {\n  grid-template-rows: 38px auto 34px minmax(0, 1fr);\n}\n''',
            1,
          )
          marker = '''.entryRowSelected {\n  box-shadow: inset 2px 0 0 #ff5200;\n}\n'''
          pending_css = '''\n.pendingEntryRow {\n  background: color-mix(in srgb, var(--surface-2) 72%, var(--surface) 28%);\n}\n\n.pendingEntryRow:hover {\n  background: color-mix(in srgb, var(--surface-2) 88%, var(--surface) 12%);\n}\n\n.pendingState {\n  color: var(--text-3);\n  font-size: 12px;\n}\n\n.pendingResumeButton {\n  justify-self: start;\n  min-height: 28px;\n  border: 1px solid var(--border);\n  border-radius: var(--radius-md);\n  background: var(--surface);\n  padding: 0 9px;\n  color: var(--text-2);\n  cursor: pointer;\n  font: inherit;\n  font-size: 12px;\n}\n\n.pendingResumeButton:hover:not(:disabled) {\n  border-color: var(--border-strong);\n  color: var(--text);\n}\n\n.pendingResumeButton:disabled {\n  cursor: default;\n  opacity: 0.5;\n}\n'''
          if marker not in text:
            raise SystemExit('entry selected marker missing')
          text = text.replace(marker, marker + pending_css, 1)
          old = '''  .contentPane {\n    grid-template-rows: 38px 34px minmax(0, 1fr);\n  }\n\n  .breadcrumbs {\n'''
          new = '''  .contentPane {\n    grid-template-rows: 38px 34px minmax(0, 1fr);\n  }\n\n  .contentPaneUploading {\n    grid-template-rows: 38px auto 34px minmax(0, 1fr);\n  }\n\n  .breadcrumbs {\n'''
          if old not in text:
            raise SystemExit('mobile contentPane marker missing')
          text = text.replace(old, new, 1)
          # Preserve the resume button in the 3-column tablet layout.
          marker = '''  .tableHeader > :last-child,\n  .entryRow > :last-child {\n    display: none;\n  }\n}\n'''
          replacement = '''  .tableHeader > :last-child,\n  .entryRow > :last-child {\n    display: none;\n  }\n\n  .pendingEntryRow {\n    grid-template-columns: minmax(200px, 1fr) 100px auto;\n  }\n\n  .pendingEntryRow > :nth-child(3) {\n    display: none;\n  }\n\n  .pendingEntryRow > :last-child {\n    display: inline-flex;\n  }\n}\n'''
          if marker not in text:
            raise SystemExit('tablet marker missing')
          text = text.replace(marker, replacement, 1)
          path.write_text(text)

          # E2E: real interrupted TUS transfer, F5, pending row, same-file resume.
          path = Path('tests/e2e/files-desktop.spec.ts')
          text = path.read_text()
          text = text.replace(
            '''import { expect, test, type Page } from "@playwright/test";\n''',
            '''import { mkdirSync, utimesSync, writeFileSync } from "node:fs";\nimport { dirname } from "node:path";\n\nimport { expect, test, type Page } from "@playwright/test";\n''',
            1,
          )
          marker = '''test("renames, moves, drags, trashes and restores files and reorganizes folders", async ({\n'''
          if marker not in text:
            raise SystemExit('second e2e marker missing')
          resume_test = '''test("keeps an interrupted TUS upload visible after F5 and resumes the same reservation", async ({\n  page,\n}, testInfo) => {\n  await signIn(page);\n  await openFiles(page);\n\n  const filePath = testInfo.outputPath("resume-after-reload.txt");\n  mkdirSync(dirname(filePath), { recursive: true });\n  writeFileSync(filePath, Buffer.alloc(20 * 1024 * 1024, "R"));\n  const stableTimestamp = new Date("2026-08-14T12:00:00.000Z");\n  utimesSync(filePath, stableTimestamp, stableTimestamp);\n\n  let delayTusPatches = true;\n  await page.route("**/storage/v1/upload/resumable**", async (route) => {\n    if (delayTusPatches && route.request().method() === "PATCH") {\n      await new Promise((resolve) => setTimeout(resolve, 1_200));\n    }\n    try {\n      await route.continue();\n    } catch {\n      // Reload intentionally abandons the in-flight request.\n    }\n  });\n\n  const uploadButton = page.getByRole("button", {\n    name: "Загрузить файл",\n    exact: true,\n  });\n  const firstPatch = page.waitForRequest(\n    (request) =>\n      request.url().includes("/storage/v1/upload/resumable") &&\n      request.method() === "PATCH",\n  );\n  const chooserPromise = page.waitForEvent("filechooser");\n  await uploadButton.click();\n  const chooser = await chooserPromise;\n  await chooser.setFiles(filePath);\n  await firstPatch;\n  await expect(\n    page.getByRole("status", { name: "Прогресс загрузки" }),\n  ).toBeVisible();\n\n  await page.reload();\n  await openFiles(page);\n\n  await expect(page.getByText("resume-after-reload.txt", { exact: true })).toBeVisible();\n  await expect(page.getByText("Не завершено", { exact: true })).toBeVisible();\n  const continueButton = page.getByRole("button", {\n    name: "Продолжить",\n    exact: true,\n  });\n  await expect(continueButton).toBeEnabled();\n\n  const resumeChooserPromise = page.waitForEvent("filechooser");\n  await continueButton.click();\n  const resumeChooser = await resumeChooserPromise;\n  await resumeChooser.setFiles(filePath);\n\n  await expect(page.getByText("Продолжение загрузки", { exact: true })).toBeVisible({\n    timeout: 10_000,\n  });\n  delayTusPatches = false;\n  await expect(\n    page.getByText("Загружен: resume-after-reload.txt", { exact: true }),\n  ).toBeVisible({ timeout: 30_000 });\n  await expect(page.getByText("Не завершено", { exact: true })).toHaveCount(0);\n  await expect(\n    page.getByRole("button", { name: /resume-after-reload\\.txt/ }),\n  ).toHaveCount(1);\n});\n\n'''
          text = text.replace(marker, resume_test + marker, 1)
          path.write_text(text)
          PY
      - run: pnpm exec prettier --write src/lib/files/project-file-repository.ts src/lib/files/cloud-project-file-repository.ts src/lib/files/project-file-resumable-upload.ts src/lib/files/project-file-resumable-upload.test.ts src/prototype/files/files-workspace.tsx src/prototype/files/files-workspace.module.css tests/e2e/files-desktop.spec.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit B1 resume UX
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/files src/prototype/files tests/e2e/files-desktop.spec.ts
          git commit -m 'Files B1: restore interrupted upload UX after reload'
          git push
