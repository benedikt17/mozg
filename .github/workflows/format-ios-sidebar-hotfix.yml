name: Format iOS sidebar hotfix

on:
  pull_request:
    branches:
      - refactor/prototype-state-root

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix/ios-mobile-sidebar-touch' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/prototype/shell/application-header.tsx
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/shell/application-header.tsx
          git commit -m "style: format iOS sidebar touch hotfix"
          git push origin HEAD:${{ github.head_ref }}
