name: tmp-b2-image-variants-retry

on:
  push:
    branches:
      - feat/project-files-b2-image-variants

permissions:
  contents: write

jobs:
  wire-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean B2 branch
        uses: actions/checkout@v4
        with:
          ref: feat/project-files-b2-image-variants-clean
          path: work
      - name: Check out disposable helper branch
        uses: actions/checkout@v4
        with:
          ref: feat/project-files-b2-image-variants
          path: helper
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: work/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: work
        run: pnpm install --frozen-lockfile
      - name: Wire permanent B2 product code
        working-directory: work
        run: |
          python ../helper/scripts/tmp-b2-wire.py
          python ../helper/scripts/tmp-b2-harden.py
          sed -i 's/Загружен: pixel.gif/Загружен: preview-image.png/g' tests/e2e/files-desktop.spec.ts
      - name: Format changed product code
        working-directory: work
        run: >-
          pnpm exec prettier --write
          src/prototype/files/files-workspace.tsx
          tests/e2e/files-desktop.spec.ts
          src/lib/files/project-file-image-variants.ts
      - name: Check changed-file whitespace
        working-directory: work
        run: git diff --check
      - name: Start local Supabase
        working-directory: work
        run: pnpm supabase start
      - name: Regenerate Supabase types
        shell: bash
        working-directory: work
        run: |
          pnpm supabase gen types typescript --local --schema public > /tmp/database.types.ts
          perl -0pi -e 's/\n\n\z/\n/' /tmp/database.types.ts
          cp /tmp/database.types.ts src/lib/supabase/database.types.ts
      - name: Lint
        working-directory: work
        run: pnpm lint
      - name: Typecheck
        working-directory: work
        run: pnpm typecheck
      - name: Unit tests
        working-directory: work
        run: pnpm test
      - name: RLS tests
        working-directory: work
        run: pnpm test:rls
      - name: Export local Supabase browser-test environment
        shell: bash
        working-directory: work
        run: |
          pnpm supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"
      - name: Install Playwright
        working-directory: work
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        id: e2e
        continue-on-error: true
        shell: bash
        working-directory: work
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee b2-e2e.log
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-playwright-report
          path: |
            work/playwright-report/
            work/test-results/
            work/b2-e2e.log
          retention-days: 7
      - name: Stop Supabase
        if: always()
        working-directory: work
        run: pnpm supabase stop --no-backup
      - name: Require E2E success
        if: steps.e2e.outcome != 'success'
        run: exit 1
      - name: Build
        working-directory: work
        run: pnpm build
      - name: Final diff checks
        working-directory: work
        run: |
          git diff --check
          pnpm exec prettier --check src/prototype/files/files-workspace.tsx tests/e2e/files-desktop.spec.ts src/lib/files/project-file-image-variants.ts
      - name: Commit validated B2 slice to clean branch
        shell: bash
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/supabase/database.types.ts src/prototype/files/files-workspace.tsx tests/e2e/files-desktop.spec.ts
          git diff --cached --check
          git commit -m "Files B2: wire image variants into Files UI"
          git push origin HEAD:feat/project-files-b2-image-variants-clean
