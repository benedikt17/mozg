name: tmp-b2-image-variants-retry

on:
  push:
    branches:
      - feat/project-files-b2-image-variants

permissions:
  contents: write

jobs:
  format-clean-b2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean B2 branch
        uses: actions/checkout@v4
        with:
          ref: feat/project-files-b2-image-variants-clean
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format every canonical changed file
        shell: bash
        run: |
          git diff --name-only -z --diff-filter=ACMR 9d1f816ea2d9a80a508ebb3b5af297e9d135bf12...HEAD -- \
            '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.css' '*.md' '*.yml' '*.yaml' \
            | xargs -0 -r pnpm exec prettier --write
          git diff --check
      - name: Commit formatting only if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/files src/lib/supabase/database.types.ts src/prototype/files/files-workspace.tsx tests/e2e/files-desktop.spec.ts
          git diff --cached --check
          git commit -m "Files B2: canonical formatting"
          git push origin HEAD:feat/project-files-b2-image-variants-clean
