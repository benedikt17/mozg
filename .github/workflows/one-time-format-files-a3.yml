name: One-time format Files A3

on:
  push:
    branches:
      - feat/project-files-stage-a3-core-actions

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-files-stage-a3-core-actions
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          src/lib/files/project-file-browser-upload.test.ts
          src/lib/files/project-file-browser-upload.ts
          src/prototype/files/files-workspace.tsx
          tests/e2e/files-desktop.spec.ts
      - run: git diff --check
      - name: Remove formatter and commit
        run: |
          rm .github/workflows/one-time-format-files-a3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/files/project-file-browser-upload.test.ts src/lib/files/project-file-browser-upload.ts src/prototype/files/files-workspace.tsx tests/e2e/files-desktop.spec.ts .github/workflows/one-time-format-files-a3.yml
          git commit -m 'Files: apply canonical A3 formatting'
          git push origin HEAD:feat/project-files-stage-a3-core-actions
