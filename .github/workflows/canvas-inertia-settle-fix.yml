name: Canvas inertia settle fix

on:
  push:
    branches:
      - agent/canvas-miro-inertia-settle-fix
    paths:
      - .github/workflows/canvas-inertia-settle-fix.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit slow-pan final viewport
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shell = Path('src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx')
          source = shell.read_text()
          old = '''      if (velocity) startPanInertia(velocity);'''
          new = '''      if (velocity) startPanInertia(velocity);\n      else commitViewportMove(reactFlow.getViewport());'''
          assert source.count(old) == 1, source.count(old)
          shell.write_text(source.replace(old, new, 1))

          test = Path('tests/canvas-pan-inertia-runtime.test.ts')
          test_source = test.read_text()
          anchor = '''    expect(source).toContain("canvasPanReleaseVelocity");\n    expect(source).toContain("advanceCanvasPanInertia");'''
          replacement = '''    expect(source).toContain("canvasPanReleaseVelocity");\n    expect(source).toContain("else commitViewportMove(reactFlow.getViewport())");\n    expect(source).toContain("advanceCanvasPanInertia");'''
          assert test_source.count(anchor) == 1, test_source.count(anchor)
          test.write_text(test_source.replace(anchor, replacement, 1))
          PY
      - run: pnpm exec prettier --write src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx tests/canvas-pan-inertia-runtime.test.ts
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx tests/canvas-pan-inertia-runtime.test.ts
          git commit -m "Canvas: persist slow middle-button pans"
          git push
