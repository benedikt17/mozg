name: One-time format Files sidebar

"on":
  push:
    branches:
      - feat/project-files-stage-a2-preview

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-files-stage-a2-preview
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/prototype/files/files-workspace.tsx
      - run: git diff --check
      - name: Remove formatter and commit
        run: |
          rm .github/workflows/one-time-format-files-sidebar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Files: apply canonical sidebar formatting"
          git push origin HEAD:feat/project-files-stage-a2-preview
