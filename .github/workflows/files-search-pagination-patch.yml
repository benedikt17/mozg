name: Files Search Pagination Patch

on:
  push:
    branches:
      - feature/files-content-search
    paths:
      - .github/workflows/files-search-pagination-patch.yml
      - scripts/files-search-pagination-patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/files-search-pagination-patch.py
      - run: pnpm exec prettier --write src/lib/files/cloud-project-file-repository.ts
      - run: pnpm supabase start
      - name: Generate database types
        shell: bash
        run: |
          pnpm supabase gen types typescript --local --schema public > src/lib/supabase/database.types.ts
          perl -0pi -e 's/\n\n\z/\n/' src/lib/supabase/database.types.ts
      - run: pnpm test:rls
      - if: always()
        run: pnpm supabase stop --no-backup
      - name: Commit pagination changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260816010000_project_file_content_search.sql tests/rls/project-file-content-search.test.sql src/lib/files/cloud-project-file-repository.ts src/lib/supabase/database.types.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(files): return every matching Project file"
          git push origin HEAD:feature/files-content-search
