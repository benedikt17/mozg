name: Stage 4 selector performance hotfix

on:
  push:
    branches:
      - fix/stage4-markdown-performance-regression

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stage4-markdown-performance-regression
      - name: Remove Markdown parsing from document title selector
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/prototype/state/knowledge-state.ts')
          text = path.read_text(encoding='utf-8')
          old = '''export function getDocumentTitle(document: PrototypeDocument): string {\n  return (\n    getFirstMarkdownHeading(document.content.join("\\n"))?.text ?? document.title\n  );\n}'''
          new = '''export function getDocumentTitle(document: PrototypeDocument): string {\n  return document.title;\n}'''
          if text.count(old) != 1:
              raise RuntimeError(f'expected exactly one hot-path title selector, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/state/knowledge-state.ts
          git commit -m "fix: keep Markdown parsing out of global document selectors"
          git push
