name: Format Knowledge tree link picker

on:
  push:
    branches:
      - fix/knowledge-internal-links-beside
    paths:
      - .github/workflows/format-knowledge-tree-link-picker.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/knowledge-internal-links-beside
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            src/prototype/desktop-shell.tsx \
            src/prototype/desktop-knowledge.css \
            src/prototype/knowledge/knowledge-sidebar.tsx \
            src/prototype/knowledge/knowledge-workspace.tsx \
            src/prototype/knowledge/markdown-source-editor.tsx \
            tests/knowledge-internal-link-picker-runtime.test.ts
          git diff --check
      - name: Commit formatting and remove workflow
        run: |
          git rm .github/workflows/format-knowledge-tree-link-picker.yml
          git add src/prototype/desktop-shell.tsx src/prototype/desktop-knowledge.css src/prototype/knowledge/knowledge-sidebar.tsx src/prototype/knowledge/knowledge-workspace.tsx src/prototype/knowledge/markdown-source-editor.tsx tests/knowledge-internal-link-picker-runtime.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format Knowledge tree article link picker"
          git push origin HEAD:fix/knowledge-internal-links-beside
