name: Stage 4.2 type fix

on:
  push:
    branches:
      - agent/stage4-2-knowledge-mdast-integration

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage4-2-knowledge-mdast-integration
      - name: Apply exact title value fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/prototype/state/knowledge-state.ts')
          text = path.read_text(encoding='utf-8')
          old = '  const nextTitle =\n    getFirstMarkdownHeading(normalizedMarkdown) ?? "Без названия";'
          new = '  const nextTitle =\n    getFirstMarkdownHeading(normalizedMarkdown)?.text ?? "Без названия";'
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'expected one exact title assignment, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/state/knowledge-state.ts
          git commit -m "fix: use semantic Markdown heading text for title"
          git push
