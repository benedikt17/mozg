name: Files A2 e2e one-time format

on:
  push:
    branches:
      - feat/project-files-stage-a2-preview

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-files-stage-a2-preview
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Files A2 E2E exactly once
        shell: bash
        run: |
          pnpm exec prettier --write tests/e2e/critical-desktop.spec.ts
          git diff --check
          if git diff --quiet -- tests/e2e/critical-desktop.spec.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/critical-desktop.spec.ts
          git commit -m "Files A2: apply canonical E2E formatting"
          git push origin HEAD:feat/project-files-stage-a2-preview
