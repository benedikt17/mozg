name: Diagnose Canvas shapes tests

on:
  push:
    branches:
      - feat/canvas-shape-nodes

jobs:
  vitest-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Vitest with JSON report
        run: pnpm exec vitest run --reporter=json --outputFile=vitest-results.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: vitest-results
          path: vitest-results.json
          if-no-files-found: error
          retention-days: 1
