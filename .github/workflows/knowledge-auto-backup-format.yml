name: Knowledge automatic backup format

on:
  push:
    branches:
      - feat/knowledge-automatic-backup

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/knowledge-automatic-backup
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply project Prettier and remove formatter
        shell: bash
        run: |
          pnpm exec prettier --write src/lib/knowledge-backup/automatic-knowledge-backup.ts
          rm .github/workflows/knowledge-auto-backup-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/knowledge-backup/automatic-knowledge-backup.ts .github/workflows/knowledge-auto-backup-format.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "format automatic Knowledge backup"
          git push origin HEAD:feat/knowledge-automatic-backup
