name: Mobile format probe

on:
  push:
    branches:
      - feat/mobile-responsive-shell

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print formatter patch
        run: |
          pnpm exec prettier --write src/prototype/shell/mobile-navigation.tsx src/prototype/shell/mobile-navigation.module.css
          git diff -- src/prototype/shell/mobile-navigation.tsx src/prototype/shell/mobile-navigation.module.css
