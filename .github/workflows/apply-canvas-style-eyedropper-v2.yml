name: Apply stable Canvas style eyedropper patch

on:
  push:
    branches:
      - feat/canvas-custom-color-picker
    paths:
      - .github/workflows/apply-canvas-style-eyedropper-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canvas-custom-color-picker
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch eyedropper runtime
        run: python -c "import base64;exec(base64.b64decode(''))"
      - run: pnpm exec prettier --write src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css tests/canvas-style-eyedropper-runtime.test.ts
      - run: git diff --check
      - name: Validate eyedropper
        run: pnpm exec vitest run tests/canvas-style-eyedropper-runtime.test.ts tests/canvas-custom-color-picker-runtime.test.ts tests/canvas-miro-text-toolbar-runtime.test.ts tests/canvas-alt-drag-duplicate.test.ts && pnpm lint && pnpm typecheck
      - name: Commit implementation and remove workflows
        run: |
          git rm .github/workflows/apply-canvas-style-eyedropper.yml .github/workflows/apply-canvas-style-eyedropper-v2.yml
          git add src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css tests/canvas-style-eyedropper-runtime.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Canvas: add text style eyedropper"
          git push origin HEAD:feat/canvas-custom-color-picker
