name: Canvas text toolbar codemod

on:
  push:
    branches:
      - agent/canvas-miro-text-toolbar
    paths:
      - .github/workflows/canvas-text-toolbar-codemod.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Miro text toolbar changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shell = Path('src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx')
          source = shell.read_text()

          style_import_old = '''import {\n  canvasTextFontFamilyCss,\n  type CanvasTextStyle,\n} from "@/lib/canvas/canvas-text-style";'''
          style_import_new = '''import {\n  CANVAS_TEXT_FONT_FAMILIES,\n  CANVAS_TEXT_FONT_SIZES,\n  canvasTextFontFamilyCss,\n  nextCanvasTextFontSize,\n  previousCanvasTextFontSize,\n  type CanvasTextFontFamily,\n  type CanvasTextFontSize,\n  type CanvasTextStyle,\n} from "@/lib/canvas/canvas-text-style";'''
          assert source.count(style_import_old) == 1, source.count(style_import_old)
          source = source.replace(style_import_old, style_import_new, 1)

          css_fn = '''function canvasTextCss(style: CanvasTextStyle): CSSProperties {'''
          toolbar_block = '''const CANVAS_TEXT_FONT_LABELS: Record<CanvasTextFontFamily, string> = {\n  system: "System",\n  arial: "Arial",\n  georgia: "Georgia",\n  "times-new-roman": "Times New Roman",\n  "courier-new": "Courier New",\n  verdana: "Verdana",\n};\n\nfunction dispatchCanvasTextStyle(id: string, style: CanvasTextStyle): void {\n  window.dispatchEvent(\n    new CustomEvent("mozg:canvas-text-style", { detail: { id, style } }),\n  );\n}\n\nfunction TextSelectionToolbar({\n  id,\n  style,\n}: {\n  id: string;\n  style: CanvasTextStyle;\n}): React.JSX.Element {\n  const patchStyle = (patch: Partial<CanvasTextStyle>) =>\n    dispatchCanvasTextStyle(id, { ...style, ...patch });\n  return (\n    <div\n      className={`${styles.textSelectionToolbar} nodrag nopan nowheel`}\n      aria-label="Панель форматирования текста"\n      onPointerDown={(event) => event.stopPropagation()}\n    >\n      <button\n        type="button"\n        className={styles.textToolbarButton}\n        aria-label="Текст"\n        title="Текст"\n        disabled\n      >\n        T\n      </button>\n      <span className={styles.textToolbarDivider} aria-hidden="true" />\n      <select\n        className={`${styles.textToolbarSelect} ${styles.textToolbarFontSelect}`}\n        aria-label="Шрифт"\n        value={style.fontFamily}\n        onChange={(event) =>\n          patchStyle({ fontFamily: event.target.value as CanvasTextFontFamily })\n        }\n      >\n        {CANVAS_TEXT_FONT_FAMILIES.map((fontFamily) => (\n          <option key={fontFamily} value={fontFamily}>\n            {CANVAS_TEXT_FONT_LABELS[fontFamily]}\n          </option>\n        ))}\n      </select>\n      <span className={styles.textToolbarDivider} aria-hidden="true" />\n      <button\n        type="button"\n        className={styles.textToolbarButton}\n        aria-label="Уменьшить размер шрифта"\n        title="Уменьшить размер"\n        onClick={() =>\n          patchStyle({ fontSize: previousCanvasTextFontSize(style.fontSize) })\n        }\n      >\n        −\n      </button>\n      <select\n        className={`${styles.textToolbarSelect} ${styles.textToolbarSizeSelect}`}\n        aria-label="Размер шрифта"\n        value={style.fontSize}\n        onChange={(event) =>\n          patchStyle({ fontSize: Number(event.target.value) as CanvasTextFontSize })\n        }\n      >\n        {CANVAS_TEXT_FONT_SIZES.map((fontSize) => (\n          <option key={fontSize} value={fontSize}>\n            {fontSize}\n          </option>\n        ))}\n      </select>\n      <button\n        type="button"\n        className={styles.textToolbarButton}\n        aria-label="Увеличить размер шрифта"\n        title="Увеличить размер"\n        onClick={() =>\n          patchStyle({ fontSize: nextCanvasTextFontSize(style.fontSize) })\n        }\n      >\n        +\n      </button>\n      <span className={styles.textToolbarDivider} aria-hidden="true" />\n      <button\n        type="button"\n        className={styles.textToolbarButton}\n        aria-label="Полужирный"\n        aria-pressed={style.bold}\n        title="Полужирный"\n        onClick={() => patchStyle({ bold: !style.bold })}\n      >\n        <strong>B</strong>\n      </button>\n      <button\n        type="button"\n        className={styles.textToolbarButton}\n        aria-label="Курсив"\n        aria-pressed={style.italic}\n        title="Курсив"\n        onClick={() => patchStyle({ italic: !style.italic })}\n      >\n        <em>I</em>\n      </button>\n      <button\n        type="button"\n        className={styles.textToolbarButton}\n        aria-label="Подчеркнутый"\n        aria-pressed={style.underline}\n        title="Подчеркнутый"\n        onClick={() => patchStyle({ underline: !style.underline })}\n      >\n        <u>U</u>\n      </button>\n      <button\n        type="button"\n        className={styles.textToolbarButton}\n        aria-label="Перечеркнутый"\n        aria-pressed={style.strikethrough}\n        title="Перечеркнутый"\n        onClick={() => patchStyle({ strikethrough: !style.strikethrough })}\n      >\n        <s>S</s>\n      </button>\n      <span className={styles.textToolbarDivider} aria-hidden="true" />\n      <label className={styles.textToolbarColorControl} title="Цвет текста">\n        <span className={styles.textToolbarColorGlyph}>A</span>\n        <input\n          type="color"\n          aria-label="Цвет текста"\n          value={style.color}\n          onChange={(event) => patchStyle({ color: event.target.value })}\n        />\n      </label>\n      <label className={styles.textToolbarColorControl} title="Цвет фона">\n        <span className={styles.textToolbarBackgroundGlyph}>▣</span>\n        <input\n          type="color"\n          aria-label="Цвет фона"\n          value={\n            style.backgroundColor === "transparent"\n              ? "#ffffff"\n              : style.backgroundColor\n          }\n          onChange={(event) =>\n            patchStyle({ backgroundColor: event.target.value })\n          }\n        />\n      </label>\n      <button\n        type="button"\n        className={styles.textToolbarButton}\n        aria-label="Убрать цвет фона"\n        title="Убрать фон"\n        disabled={style.backgroundColor === "transparent"}\n        onClick={() => patchStyle({ backgroundColor: "transparent" })}\n      >\n        ×\n      </button>\n    </div>\n  );\n}\n\nfunction canvasTextCss(style: CanvasTextStyle): CSSProperties {'''
          assert source.count(css_fn) == 1, source.count(css_fn)
          source = source.replace(css_fn, toolbar_block, 1)

          frame_anchor = '''      className={styles.textNodeFrame}\n      connectionHandleLayer={<ConnectionHandleLayer selected={selected} />}\n    >'''
          frame_replace = '''      className={styles.textNodeFrame}\n      toolbar={<TextSelectionToolbar id={id} style={data.style} />}\n      connectionHandleLayer={<ConnectionHandleLayer selected={selected} />}\n    >'''
          assert source.count(frame_anchor) == 1, source.count(frame_anchor)
          source = source.replace(frame_anchor, frame_replace, 1)

          listener_anchor = '''  const createTextNode = useCallback('''
          update_fn = '''  const updateTextStyle = useCallback(\n    (id: string, style: CanvasTextStyle) => {\n      let found = false;\n      const nextNodes = nodesRef.current.map((node) => {\n        if (node.id !== id || node.type !== CANVAS_TEXT_NODE_TYPE) return node;\n        found = true;\n        return {\n          ...node,\n          data: { ...node.data, style: { ...style } },\n        };\n      });\n      if (!found) return;\n      nodesRef.current = nextNodes;\n      setNodes(nextNodes);\n      controller.setRuntimeNodes(nextNodes);\n      syncState();\n      scheduleSave();\n    },\n    [controller, scheduleSave, setNodes, syncState],\n  );\n\n  const createTextNode = useCallback('''
          assert source.count(listener_anchor) == 1, source.count(listener_anchor)
          source = source.replace(listener_anchor, update_fn, 1)

          event_anchor = '''    const onCancel = (event: Event) => {\n      const id = (event as CustomEvent<{ id?: string }>).detail?.id;\n      if (id) setTextEditing(id, false);\n    };\n    window.addEventListener("mozg:canvas-text-edit", onEdit);\n    window.addEventListener("mozg:canvas-text-commit", onCommit);\n    window.addEventListener("mozg:canvas-text-cancel", onCancel);\n    return () => {\n      window.removeEventListener("mozg:canvas-text-edit", onEdit);\n      window.removeEventListener("mozg:canvas-text-commit", onCommit);\n      window.removeEventListener("mozg:canvas-text-cancel", onCancel);\n    };\n  }, [commitTextNode, setTextEditing]);'''
          event_replace = '''    const onCancel = (event: Event) => {\n      const id = (event as CustomEvent<{ id?: string }>).detail?.id;\n      if (id) setTextEditing(id, false);\n    };\n    const onStyle = (event: Event) => {\n      const detail = (\n        event as CustomEvent<{ id?: string; style?: CanvasTextStyle }>\n      ).detail;\n      if (detail.id && detail.style) updateTextStyle(detail.id, detail.style);\n    };\n    window.addEventListener("mozg:canvas-text-edit", onEdit);\n    window.addEventListener("mozg:canvas-text-commit", onCommit);\n    window.addEventListener("mozg:canvas-text-cancel", onCancel);\n    window.addEventListener("mozg:canvas-text-style", onStyle);\n    return () => {\n      window.removeEventListener("mozg:canvas-text-edit", onEdit);\n      window.removeEventListener("mozg:canvas-text-commit", onCommit);\n      window.removeEventListener("mozg:canvas-text-cancel", onCancel);\n      window.removeEventListener("mozg:canvas-text-style", onStyle);\n    };\n  }, [commitTextNode, setTextEditing, updateTextStyle]);'''
          assert source.count(event_anchor) == 1, source.count(event_anchor)
          source = source.replace(event_anchor, event_replace, 1)
          shell.write_text(source)

          css = Path('src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css')
          css_source = css.read_text()
          css_anchor = '''.textEditorInput::placeholder,\n.textPlaceholder {\n  color: #a8a29e;\n  font: inherit;\n  font-style: normal;\n  font-weight: 400;\n  text-decoration: none;\n}\n'''
          css_add = css_anchor + '''.textSelectionToolbar {\n  display: flex;\n  align-items: center;\n  gap: 2px;\n  padding: 4px;\n  border: 1px solid #d6d3d1;\n  border-radius: 8px;\n  background: #ffffff;\n  box-shadow: 0 8px 24px rgba(28, 25, 23, 0.16);\n  color: #292524;\n  pointer-events: all;\n  white-space: nowrap;\n}\n.textToolbarButton,\n.textToolbarSelect {\n  height: 30px;\n  border: 0;\n  border-radius: 5px;\n  background: transparent;\n  color: #292524;\n  font: inherit;\n  font-size: 12px;\n}\n.textToolbarButton {\n  min-width: 30px;\n  padding: 0 7px;\n  cursor: pointer;\n}\n.textToolbarButton:hover:not(:disabled),\n.textToolbarButton:focus-visible,\n.textToolbarButton[aria-pressed="true"] {\n  background: #e7e5e4;\n  color: #0f766e;\n}\n.textToolbarButton:disabled {\n  color: #a8a29e;\n  cursor: default;\n}\n.textToolbarSelect {\n  padding: 0 7px;\n  outline: none;\n  cursor: pointer;\n}\n.textToolbarSelect:hover,\n.textToolbarSelect:focus-visible {\n  background: #f5f5f4;\n}\n.textToolbarFontSelect {\n  width: 122px;\n}\n.textToolbarSizeSelect {\n  width: 58px;\n}\n.textToolbarDivider {\n  width: 1px;\n  height: 20px;\n  margin: 0 2px;\n  background: #e7e5e4;\n}\n.textToolbarColorControl {\n  position: relative;\n  width: 30px;\n  height: 30px;\n  display: grid;\n  place-items: center;\n  border-radius: 5px;\n  cursor: pointer;\n  overflow: hidden;\n}\n.textToolbarColorControl:hover {\n  background: #f5f5f4;\n}\n.textToolbarColorControl input {\n  position: absolute;\n  inset: auto 4px 2px;\n  width: 22px;\n  height: 7px;\n  padding: 0;\n  border: 0;\n  background: transparent;\n  cursor: pointer;\n}\n.textToolbarColorGlyph,\n.textToolbarBackgroundGlyph {\n  margin-bottom: 5px;\n  pointer-events: none;\n  font-size: 13px;\n  font-weight: 700;\n  line-height: 1;\n}\n'''
          assert css_source.count(css_anchor) == 1, css_source.count(css_anchor)
          css.write_text(css_source.replace(css_anchor, css_add, 1))

          controls_test = Path('tests/canvas-text-style-controls.test.ts')
          controls_test.write_text('''import { describe, expect, it } from "vitest";\nimport {\n  CANVAS_TEXT_FONT_SIZES,\n  nextCanvasTextFontSize,\n  previousCanvasTextFontSize,\n} from "@/lib/canvas/canvas-text-style";\n\ndescribe("Canvas text size controls", () => {\n  it("keeps the exact Miro-style size scale", () => {\n    expect(CANVAS_TEXT_FONT_SIZES).toEqual([\n      10, 12, 14, 18, 24, 36, 48, 64, 80, 144, 288,\n    ]);\n  });\n\n  it("steps down and up only through the canonical size scale", () => {\n    expect(previousCanvasTextFontSize(18)).toBe(14);\n    expect(nextCanvasTextFontSize(18)).toBe(24);\n  });\n\n  it("clamps size stepping at both ends", () => {\n    expect(previousCanvasTextFontSize(10)).toBe(10);\n    expect(nextCanvasTextFontSize(288)).toBe(288);\n  });\n});\n''')

          runtime_test = Path('tests/canvas-miro-text-toolbar-runtime.test.ts')
          runtime_test.write_text('''import fs from "node:fs";\nimport path from "node:path";\nimport { describe, expect, it } from "vitest";\n\nconst shell = fs.readFileSync(\n  path.resolve(process.cwd(), "src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx"),\n  "utf8",\n);\n\ndescribe("Miro-style Canvas text toolbar", () => {\n  it("renders the requested text controls in the generic screen-space toolbar", () => {\n    expect(shell).toContain("function TextSelectionToolbar");\n    expect(shell).toContain('aria-label="Текст"');\n    expect(shell).toContain("disabled");\n    expect(shell).toContain("CANVAS_TEXT_FONT_FAMILIES.map");\n    expect(shell).toContain("CANVAS_TEXT_FONT_SIZES.map");\n    expect(shell).toContain('aria-label="Полужирный"');\n    expect(shell).toContain('aria-label="Курсив"');\n    expect(shell).toContain('aria-label="Подчеркнутый"');\n    expect(shell).toContain('aria-label="Перечеркнутый"');\n    expect(shell.match(/type="color"/g)).toHaveLength(2);\n    expect(shell).toContain("toolbar={<TextSelectionToolbar id={id} style={data.style} />}");\n  });\n\n  it("persists toolbar style changes through the existing runtime-node autosave path", () => {\n    expect(shell).toContain('new CustomEvent("mozg:canvas-text-style"');\n    expect(shell).toContain('window.addEventListener("mozg:canvas-text-style", onStyle)');\n    expect(shell).toContain("controller.setRuntimeNodes(nextNodes)");\n    expect(shell).toContain("scheduleSave()");\n  });\n\n  it("keeps all style toggles independent and exposes transparent background reset", () => {\n    expect(shell).toContain("bold: !style.bold");\n    expect(shell).toContain("italic: !style.italic");\n    expect(shell).toContain("underline: !style.underline");\n    expect(shell).toContain("strikethrough: !style.strikethrough");\n    expect(shell).toContain('backgroundColor: "transparent"');\n  });\n});\n''')
          PY
      - name: Format changed files
        run: pnpm exec prettier --write src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css tests/canvas-text-style-controls.test.ts tests/canvas-miro-text-toolbar-runtime.test.ts
      - name: Commit materialized toolbar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.module.css tests/canvas-text-style-controls.test.ts tests/canvas-miro-text-toolbar-runtime.test.ts
          git commit -m "Canvas: add Miro-style text toolbar controls"
          git push
