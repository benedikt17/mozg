name: Canvas text toolbar follow-up

on:
  push:
    branches:
      - agent/canvas-miro-text-toolbar
    paths:
      - .github/workflows/canvas-text-toolbar-codemod.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Make rapid toolbar updates patch-based
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx')
          source = path.read_text()

          dispatch_old = '''function dispatchCanvasTextStyle(id: string, style: CanvasTextStyle): void {\n  window.dispatchEvent(\n    new CustomEvent("mozg:canvas-text-style", { detail: { id, style } }),\n  );\n}'''
          dispatch_new = '''function dispatchCanvasTextStylePatch(\n  id: string,\n  patch: Partial<CanvasTextStyle>,\n): void {\n  window.dispatchEvent(\n    new CustomEvent("mozg:canvas-text-style", { detail: { id, patch } }),\n  );\n}'''
          assert source.count(dispatch_old) == 1, source.count(dispatch_old)
          source = source.replace(dispatch_old, dispatch_new, 1)

          patch_old = '''  const patchStyle = (patch: Partial<CanvasTextStyle>) =>\n    dispatchCanvasTextStyle(id, { ...style, ...patch });'''
          patch_new = '''  const patchStyle = (patch: Partial<CanvasTextStyle>) =>\n    dispatchCanvasTextStylePatch(id, patch);'''
          assert source.count(patch_old) == 1, source.count(patch_old)
          source = source.replace(patch_old, patch_new, 1)

          update_old = '''  const updateTextStyle = useCallback(\n    (id: string, style: CanvasTextStyle) => {\n      let found = false;\n      const nextNodes = nodesRef.current.map((node) => {\n        if (node.id !== id || node.type !== CANVAS_TEXT_NODE_TYPE) return node;\n        found = true;\n        return {\n          ...node,\n          data: { ...node.data, style: { ...style } },\n        };\n      });'''
          update_new = '''  const updateTextStyle = useCallback(\n    (id: string, patch: Partial<CanvasTextStyle>) => {\n      let found = false;\n      const nextNodes = nodesRef.current.map((node) => {\n        if (node.id !== id || node.type !== CANVAS_TEXT_NODE_TYPE) return node;\n        found = true;\n        return {\n          ...node,\n          data: {\n            ...node.data,\n            style: { ...node.data.style, ...patch },\n          },\n        };\n      });'''
          assert source.count(update_old) == 1, source.count(update_old)
          source = source.replace(update_old, update_new, 1)

          event_old = '''      const detail = (\n        event as CustomEvent<{ id?: string; style?: CanvasTextStyle }>\n      ).detail;\n      if (detail.id && detail.style) updateTextStyle(detail.id, detail.style);'''
          event_new = '''      const detail = (\n        event as CustomEvent<{\n          id?: string;\n          patch?: Partial<CanvasTextStyle>;\n        }>\n      ).detail;\n      if (detail.id && detail.patch) updateTextStyle(detail.id, detail.patch);'''
          assert source.count(event_old) == 1, source.count(event_old)
          source = source.replace(event_old, event_new, 1)
          path.write_text(source)

          test = Path('tests/canvas-miro-text-toolbar-runtime.test.ts')
          test_source = test.read_text()
          anchor = '''    expect(shell).toContain("controller.setRuntimeNodes(nextNodes)");\n    expect(shell).toContain("scheduleSave()");'''
          replacement = '''    expect(shell).toContain("controller.setRuntimeNodes(nextNodes)");\n    expect(shell).toContain("style: { ...node.data.style, ...patch }");\n    expect(shell).toContain("scheduleSave()");'''
          assert test_source.count(anchor) == 1, test_source.count(anchor)
          test.write_text(test_source.replace(anchor, replacement, 1))
          PY
      - run: pnpm exec prettier --write src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx tests/canvas-miro-text-toolbar-runtime.test.ts
      - name: Commit patch-safe toolbar events
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/infinite-canvas-local-shell/infinite-canvas-local-shell.tsx tests/canvas-miro-text-toolbar-runtime.test.ts
          git commit -m "Canvas: make text toolbar updates patch-safe"
          git push
