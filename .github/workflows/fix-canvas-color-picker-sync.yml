name: Fix Canvas color picker state sync

on:
  push:
    branches:
      - feat/canvas-custom-color-picker
    paths:
      - .github/workflows/fix-canvas-color-picker-sync.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canvas-custom-color-picker
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply event-driven picker sync
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/prototype/infinite-canvas-local-shell/canvas-color-picker.tsx")
          text = path.read_text()

          def replace(old: str, new: str):
              global text
              if old not in text:
                  raise SystemExit(f"expected block not found: {old[:120]!r}")
              text = text.replace(old, new, 1)

          replace(
          '''  useEffect(() => {
              lastCommittedRef.current = normalizedValue;
              setHsv(hsvForHex(normalizedValue));
              setDraftHex(displayHex(normalizedValue));
            }, [normalizedValue]);

          ''',
          '''''')

          replace(
          '''    const closeOnEscape = (event: KeyboardEvent): void => {
                if (event.key !== "Escape") return;
                setOpen(false);
                setHsv(hsvForHex(lastCommittedRef.current));
                setDraftHex(displayHex(lastCommittedRef.current));
              };
              document.addEventListener("pointerdown", closeOnOutsidePointer, true);
              document.addEventListener("keydown", closeOnEscape, true);
              return () => {
                document.removeEventListener("pointerdown", closeOnOutsidePointer, true);
                document.removeEventListener("keydown", closeOnEscape, true);
              };
          ''',
          '''    const closeOnKeyboard = (event: KeyboardEvent): void => {
                if (event.key === "Escape") {
                  setOpen(false);
                  return;
                }
                if (
                  (event.ctrlKey || event.metaKey) &&
                  (event.key.toLowerCase() === "z" || event.key.toLowerCase() === "y")
                )
                  setOpen(false);
              };
              document.addEventListener("pointerdown", closeOnOutsidePointer, true);
              document.addEventListener("keydown", closeOnKeyboard, true);
              return () => {
                document.removeEventListener("pointerdown", closeOnOutsidePointer, true);
                document.removeEventListener("keydown", closeOnKeyboard, true);
              };
          ''')

          replace(
          '''  const swatchColor = normalizeCanvasHexColor(draftHex) ?? normalizedValue;

            return (
          ''',
          '''  const swatchColor = open
              ? (normalizeCanvasHexColor(draftHex) ?? normalizedValue)
              : normalizedValue;

            const toggleOpen = (): void => {
              if (!open) {
                lastCommittedRef.current = normalizedValue;
                setHsv(hsvForHex(normalizedValue));
                setDraftHex(displayHex(normalizedValue));
              }
              setOpen((current) => !current);
            };

            return (
          ''')

          replace(
          '''        onClick={() => setOpen((current) => !current)}
          ''',
          '''        onClick={toggleOpen}
          ''')

          path.write_text(text)
          PY
          pnpm exec prettier --write src/prototype/infinite-canvas-local-shell/canvas-color-picker.tsx
          git diff --check
      - name: Validate
        run: |
          pnpm lint
          pnpm exec vitest run tests/canvas-color.test.ts tests/canvas-custom-color-picker-runtime.test.ts tests/canvas-miro-selection-runtime.test.ts
          pnpm typecheck
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-canvas-color-picker-sync.yml
          git add src/prototype/infinite-canvas-local-shell/canvas-color-picker.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Canvas: keep color picker sync event-driven"
          git push origin HEAD:feat/canvas-custom-color-picker
