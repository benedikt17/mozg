name: Format Canvas Branch

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print Prettier diff
        run: |
          pnpm exec prettier src/lib/canvas/canvas-branch-collapse.ts --write
          git diff -- src/lib/canvas/canvas-branch-collapse.ts
